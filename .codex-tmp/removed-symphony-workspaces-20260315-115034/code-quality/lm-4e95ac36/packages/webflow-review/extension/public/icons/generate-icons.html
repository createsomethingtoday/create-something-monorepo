<!DOCTYPE html>
<html>
<head>
  <title>Generate Extension Icons</title>
</head>
<body>
  <h1>Icon Generator</h1>
  <p>Open browser console and icons will be saved as data URLs.</p>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    // Generate extension icons at different sizes
    const sizes = [16, 32, 48, 128];
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function generateIcon(size) {
      canvas.width = size;
      canvas.height = size;

      // Clear
      ctx.clearRect(0, 0, size, size);

      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#3b82f6');
      gradient.addColorStop(1, '#2563eb');

      // Draw rounded square
      const radius = size * 0.15;
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();

      // Draw shield symbol
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();

      const centerX = size / 2;
      const centerY = size / 2;
      const shieldWidth = size * 0.6;
      const shieldHeight = size * 0.7;

      // Shield path
      ctx.moveTo(centerX, centerY - shieldHeight / 2);
      ctx.lineTo(centerX + shieldWidth / 2, centerY - shieldHeight / 3);
      ctx.lineTo(centerX + shieldWidth / 2, centerY + shieldHeight / 4);
      ctx.lineTo(centerX, centerY + shieldHeight / 2);
      ctx.lineTo(centerX - shieldWidth / 2, centerY + shieldHeight / 4);
      ctx.lineTo(centerX - shieldWidth / 2, centerY - shieldHeight / 3);
      ctx.closePath();
      ctx.fill();

      // Draw checkmark
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = size * 0.08;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(centerX - size * 0.15, centerY);
      ctx.lineTo(centerX - size * 0.05, centerY + size * 0.12);
      ctx.lineTo(centerX + size * 0.2, centerY - size * 0.12);
      ctx.stroke();

      return canvas.toDataURL('image/png');
    }

    // Generate all sizes
    sizes.forEach(size => {
      const dataUrl = generateIcon(size);
      console.log(`Icon ${size}x${size}:`, dataUrl);

      // Create downloadable link
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `icon-${size}.png`;
      link.textContent = `Download icon-${size}.png`;
      link.style.display = 'block';
      document.body.appendChild(link);
    });

    console.log('Icons generated! Click links above to download.');
  </script>
</body>
</html>
