#:schema node_modules/wrangler/config-schema.json
name = "webflow-review-orchestrator"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Routes - deployed to review.webflow.dev (or your domain)
# Update with your actual domain
# routes = [
#   { pattern = "review.webflow.dev/*", zone_name = "webflow.dev" }
# ]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "webflow-review-db"
database_id = "YOUR_D1_DATABASE_ID" # Run: wrangler d1 create webflow-review-db

# KV Namespace (for caching)
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID" # Run: wrangler kv:namespace create KV

# R2 Bucket (for screenshots)
[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "webflow-review-screenshots"

# Queue (for background reviews)
[[queues.producers]]
binding = "QUEUE"
queue = "webflow-review-queue"

# Workers AI (FREE tier)
[ai]
binding = "AI"

# Browser Rendering API
# Note: Enable in Cloudflare dashboard first
# https://developers.cloudflare.com/browser-rendering/

# Durable Objects (for real-time SSE)
[[durable_objects.bindings]]
name = "REVIEW_SESSIONS"
class_name = "ReviewSession"
script_name = "webflow-review-orchestrator"

[[migrations]]
tag = "v1"
new_classes = ["ReviewSession"]
