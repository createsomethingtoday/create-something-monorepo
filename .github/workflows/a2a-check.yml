name: A2A release checks

on:
  pull_request:
    paths:
      - 'packages/a2a/**'
      - 'packages/canon/**'
      - 'packages/canon-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/a2a-check.yml'
  push:
    branches: [main]
    paths:
      - 'packages/a2a/**'
      - 'packages/canon/**'
      - 'packages/canon-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/a2a-check.yml'

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce A2A build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Clean frozen install without lifecycle scripts or side-effect cache
        run: pnpm --filter @create-something/a2a... install --frozen-lockfile --ignore-scripts --side-effects-cache=false
      - name: Check, test and build
        run: |
          pnpm --filter @create-something/a2a check
          pnpm --filter @create-something/a2a test
          pnpm --filter @create-something/a2a build
