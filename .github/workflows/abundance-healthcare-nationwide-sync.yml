name: Abundance Healthcare Nationwide Sync

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      source_kind:
        description: Source file type. Use monthly_full for the initial seed or replacement.
        required: true
        type: choice
        default: weekly_incremental
        options:
          - weekly_incremental
          - monthly_full
      taxonomy_scope:
        description: Import all registered NP specialties or the legacy primary Family NP cohort.
        required: true
        type: choice
        default: all_np_taxonomies
        options:
          - all_np_taxonomies
          - primary_family_np
      source_url:
        description: Optional explicit official CMS ZIP URL.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: abundance-healthcare-nationwide-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve source kind
        id: source
        env:
          DISPATCH_KIND: ${{ inputs.source_kind }}
          DISPATCH_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          kind="${DISPATCH_KIND:-weekly_incremental}"
          printf 'kind=%s\n' "$kind" >> "$GITHUB_OUTPUT"
          printf 'url=%s\n' "${DISPATCH_URL:-}" >> "$GITHUB_OUTPUT"
      - name: Sync official NPPES NP snapshot
        env:
          AGENCY_INTERNAL_API_KEY: ${{ secrets.AGENCY_INTERNAL_API_KEY }}
          TAXONOMY_SCOPE: ${{ inputs.taxonomy_scope || 'all_np_taxonomies' }}
          SOURCE_KIND: ${{ steps.source.outputs.kind }}
          SOURCE_URL: ${{ steps.source.outputs.url }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_KIND" == "weekly_incremental" ]]; then
            python3 scripts/sync-nppes-family-np.py --kind monthly_full --taxonomy-scope "$TAXONOMY_SCOPE"
          fi
          args=(--kind "$SOURCE_KIND" --taxonomy-scope "$TAXONOMY_SCOPE")
          if [[ -n "$SOURCE_URL" ]]; then args+=(--source-url "$SOURCE_URL"); fi
          python3 scripts/sync-nppes-family-np.py "${args[@]}"
