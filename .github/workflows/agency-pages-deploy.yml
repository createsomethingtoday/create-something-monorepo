name: Agency Pages Deploy

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'packages/agency/**'
      - 'packages/canon/**'
      - 'packages/tufte/**'
      - 'scripts/run-wrangler.mjs'
      - 'scripts/agency-pages-deploy-eligibility.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agency-pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agency-pages-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN != '' && secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Resolve deploy eligibility
        id: deploy
        shell: bash
        run: |
          node scripts/agency-pages-deploy-eligibility.mjs \
            --event "${{ github.event_name }}" \
            --ref "${{ github.ref_name }}" \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Canon package
        run: pnpm --filter @create-something/canon package

      - name: Build Tufte package
        run: pnpm --filter @create-something/tufte package

      - name: Build Agency
        run: pnpm --filter @create-something/agency build

      - name: Resolve Pages branch alias
        id: branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "alias=main" >> "$GITHUB_OUTPUT"
          else
            alias=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/[:upper:]' '-[:lower:]')
            echo "alias=${alias}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Agency to Cloudflare Pages
        if: steps.deploy.outputs.eligible == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          node scripts/run-wrangler.mjs --cwd packages/agency pages deploy .svelte-kit/cloudflare \
            --project-name=create-something-agency \
            --branch="${{ steps.branch.outputs.alias }}"

      - name: Skip Agency deploy
        if: steps.deploy.outputs.eligible != 'true'
        run: |
          echo "Skipping Agency Pages deploy: ${{ steps.deploy.outputs.reason }}"

      - name: Emit preview URL
        if: steps.deploy.outputs.eligible == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.ref_name != 'main'
        run: |
          echo "Preview URL: https://${{ steps.branch.outputs.alias }}.create-something-agency.pages.dev"
