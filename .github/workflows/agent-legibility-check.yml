name: Agent Legibility Check

on:
  pull_request:
    paths:
      - 'packages/*/README.md'
      - 'packages/*/AGENTS.md'
      - 'packages/*/UNDERSTANDING.md'
      - 'packages/*/package.json'
      - 'docs/guides/AGENT_LEGIBILITY_CONTRACT.md'
      - 'docs/guides/CODING_AGENT_HARNESS_PATTERN.md'
      - 'scripts/agent-legibility-check.mjs'
      - 'scripts/agent-legibility-map.mjs'
      - 'scripts/test/agent-legibility.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-legibility-check.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/*/README.md'
      - 'packages/*/AGENTS.md'
      - 'packages/*/UNDERSTANDING.md'
      - 'packages/*/package.json'
      - 'docs/guides/AGENT_LEGIBILITY_CONTRACT.md'
      - 'docs/guides/CODING_AGENT_HARNESS_PATTERN.md'
      - 'scripts/agent-legibility-check.mjs'
      - 'scripts/agent-legibility-map.mjs'
      - 'scripts/test/agent-legibility.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-legibility-check.yml'

permissions:
  contents: read

jobs:
  agent-legibility:
    name: Verify package legibility contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify agent legibility tooling
        run: pnpm agent:legibility:verify
