name: Agent Legibility Check

on:
  pull_request:
    paths:
      - 'packages/*/README.md'
      - 'packages/*/AGENTS.md'
      - 'packages/*/UNDERSTANDING.md'
      - 'packages/*/package.json'
      - 'docs/guides/AGENT_LEGIBILITY_CONTRACT.md'
      - 'docs/guides/CODING_AGENT_HARNESS_PATTERN.md'
      - 'scripts/agent-legibility-check.mjs'
      - 'scripts/agent-legibility-map.mjs'
      - 'scripts/test/agent-legibility.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-legibility-check.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/*/README.md'
      - 'packages/*/AGENTS.md'
      - 'packages/*/UNDERSTANDING.md'
      - 'packages/*/package.json'
      - 'docs/guides/AGENT_LEGIBILITY_CONTRACT.md'
      - 'docs/guides/CODING_AGENT_HARNESS_PATTERN.md'
      - 'scripts/agent-legibility-check.mjs'
      - 'scripts/agent-legibility-map.mjs'
      - 'scripts/test/agent-legibility.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-legibility-check.yml'

permissions:
  contents: read

jobs:
  agent-legibility:
    name: Verify package legibility contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify agent legibility tooling
        run: pnpm agent:legibility:verify
