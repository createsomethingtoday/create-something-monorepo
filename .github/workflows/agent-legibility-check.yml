name: Agent Legibility Check

on:
  pull_request:
    paths:
      - 'packages/*/README.md'
      - 'packages/*/AGENTS.md'
      - 'packages/*/UNDERSTANDING.md'
      - 'packages/*/package.json'
      - 'docs/guides/AGENT_LEGIBILITY_CONTRACT.md'
      - 'docs/guides/CODING_AGENT_HARNESS_PATTERN.md'
      - 'scripts/agent-legibility-check.mjs'
      - 'scripts/agent-legibility-map.mjs'
      - 'scripts/test/agent-legibility.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-legibility-check.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/*/README.md'
      - 'packages/*/AGENTS.md'
      - 'packages/*/UNDERSTANDING.md'
      - 'packages/*/package.json'
      - 'docs/guides/AGENT_LEGIBILITY_CONTRACT.md'
      - 'docs/guides/CODING_AGENT_HARNESS_PATTERN.md'
      - 'scripts/agent-legibility-check.mjs'
      - 'scripts/agent-legibility-map.mjs'
      - 'scripts/test/agent-legibility.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-legibility-check.yml'

permissions:
  contents: read

jobs:
  agent-legibility:
    name: Verify package legibility contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify agent legibility tooling
        run: |
          node --check scripts/agent-legibility-check.mjs
          node --check scripts/agent-legibility-map.mjs
          node --test scripts/test/agent-legibility.test.mjs
          node scripts/agent-legibility-check.mjs --format json
          node scripts/agent-legibility-map.mjs --format json > /dev/null
