name: Agent Wiki
on:
  # Topology inputs span packages, apps, workers, Dify config and policy docs.
  # Keep this unfiltered so new input locations cannot silently skip validation.
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  wiki:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test packages/database-layer/test/agent-wiki*.test.mjs
      - run: node packages/database-layer/scripts/generate-agent-wiki.mjs --check
