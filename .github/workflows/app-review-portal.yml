name: App Review Portal
on:
  pull_request:
    paths:
      - 'packages/webflow-app-review-portal/**'
      - '.github/workflows/app-review-portal.yml'
  push:
    branches: [main]
    paths:
      - 'packages/webflow-app-review-portal/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/webflow-app-review-portal
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/webflow-app-review-portal/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
