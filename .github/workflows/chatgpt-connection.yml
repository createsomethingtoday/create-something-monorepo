name: Native ChatGPT connection contracts
on:
  pull_request:
    paths:
      - 'packages/chatgpt-connection/**'
      - '.github/workflows/chatgpt-connection.yml'
  push:
    branches: [main]
    paths:
      - 'packages/chatgpt-connection/**'
      - '.github/workflows/chatgpt-connection.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test synthetic contracts without OAuth, Keychain or inference
        run: cargo test --locked --manifest-path packages/chatgpt-connection/Cargo.toml
