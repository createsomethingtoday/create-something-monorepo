name: Cloudflare Bot Access Hardening

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      zone:
        description: 'Zone name or all'
        required: true
        default: 'all'

permissions:
  contents: read

jobs:
  harden:
    name: ${{ inputs.mode }} scanner hardening
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN != '' && secrets.CLOUDFLARE_WAF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Require Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_WAF_API_TOKEN, CLOUDFLARE_API_TOKEN, or CLOUDFLARE_WORKERS_API_TOKEN is required" >&2
            exit 1
          fi

      - name: Run hardening plan/apply
        run: |
          args=(--zone "${{ inputs.zone }}")
          if [ "${{ inputs.mode }}" = "apply" ]; then
            args+=(--apply)
          fi
          node scripts/cloudflare-bot-access-hardening.mjs "${args[@]}"
