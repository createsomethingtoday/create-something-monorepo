name: Composio Hub Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'config/mcp-hub/registry.json'
      - 'packages/composio-toolkit-mcp/**'
      - 'packages/cs-mcp-hub-remote/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composio-hub-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mcp-core dependency
        run: pnpm --filter @create-something/mcp-core build

      - name: Build composio-bridge dependency
        run: pnpm --filter @create-something/composio-bridge build

      - name: Deploy Composio toolkit gateway
        run: pnpm --filter @create-something/composio-toolkit-mcp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy remote MCP hub fleet
        run: pnpm mcp:hub:fleet:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify remote MCP hub fleet
        run: pnpm mcp:hub:fleet:verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Policy OS live gating
        if: vars.POLICY_OS_LIVE_VERIFY_ENABLED == 'true' && secrets.AGENCY_INTERNAL_API_KEY != '' && secrets.IDENTITY_API_KEY != '' && secrets.HUB_API_TOKEN != '' && secrets.MCP_ONLY_AUTH_SUBJECT != '' && secrets.MCP_ONLY_ACCOUNT_ID != '' && secrets.MCP_ONLY_TENANT_ID != '' && secrets.POLICY_OS_AUTH_SUBJECT != '' && secrets.POLICY_OS_ACCOUNT_ID != '' && secrets.POLICY_OS_TENANT_ID != ''
        run: pnpm policy:os:verify:live
        env:
          AGENCY_BASE_URL: ${{ vars.AGENCY_BASE_URL }}
          IDENTITY_BASE_URL: ${{ vars.IDENTITY_BASE_URL }}
          HUB_BASE_URL: ${{ vars.POLICY_OS_HUB_BASE_URL }}
          AGENCY_INTERNAL_API_KEY: ${{ secrets.AGENCY_INTERNAL_API_KEY }}
          IDENTITY_API_KEY: ${{ secrets.IDENTITY_API_KEY }}
          HUB_API_TOKEN: ${{ secrets.HUB_API_TOKEN }}
          MCP_ONLY_AUTH_SUBJECT: ${{ secrets.MCP_ONLY_AUTH_SUBJECT }}
          MCP_ONLY_ACCOUNT_ID: ${{ secrets.MCP_ONLY_ACCOUNT_ID }}
          MCP_ONLY_TENANT_ID: ${{ secrets.MCP_ONLY_TENANT_ID }}
          POLICY_OS_AUTH_SUBJECT: ${{ secrets.POLICY_OS_AUTH_SUBJECT }}
          POLICY_OS_ACCOUNT_ID: ${{ secrets.POLICY_OS_ACCOUNT_ID }}
          POLICY_OS_TENANT_ID: ${{ secrets.POLICY_OS_TENANT_ID }}
          POLICY_OS_DENY_AUTH_SUBJECT: ${{ secrets.POLICY_OS_DENY_AUTH_SUBJECT }}
          POLICY_OS_DENY_ACCOUNT_ID: ${{ secrets.POLICY_OS_DENY_ACCOUNT_ID }}
          POLICY_OS_DENY_TENANT_ID: ${{ secrets.POLICY_OS_DENY_TENANT_ID }}
          POLICY_OS_DENY_EXPECTED_REASON: ${{ vars.POLICY_OS_DENY_EXPECTED_REASON }}
