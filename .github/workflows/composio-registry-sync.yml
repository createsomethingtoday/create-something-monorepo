name: Composio Registry Sync

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: composio-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Composio toolkit registry
        run: pnpm mcp:composio:sync-and-generate
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_TOOLKIT_MCP_BASE_URL: ${{ vars.COMPOSIO_TOOLKIT_MCP_BASE_URL }}

      - name: Validate registry artifacts
        run: pnpm mcp:registry:check

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: codex/composio-registry-sync
          commit-message: 'chore(registry): sync composio toolkits'
          title: 'chore(registry): sync composio toolkits'
          body: |
            Automated nightly sync of Composio toolkit inventory into the MCP Hub registry.

            Changes include:
            - `composio-toolkit-*` server entries
            - `composio-all` bundle
            - `composio-category-*` bundles
            - regenerated MCP registry artifacts
          labels: |
            automation
            mcp
            composio
          delete-branch: true
