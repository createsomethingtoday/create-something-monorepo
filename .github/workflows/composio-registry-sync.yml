name: Composio Registry Sync

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: composio-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_TOOLKIT_MCP_BASE_URL: ${{ vars.COMPOSIO_TOOLKIT_MCP_BASE_URL }}

    steps:
      - name: Check sync prerequisites
        id: prereqs
        run: |
          missing=0

          if [ -z "${COMPOSIO_API_KEY}" ]; then
            echo "COMPOSIO_API_KEY is unset; skipping registry sync."
            missing=1
          fi

          if [ -z "${COMPOSIO_TOOLKIT_MCP_BASE_URL}" ]; then
            echo "COMPOSIO_TOOLKIT_MCP_BASE_URL is unset; skipping registry sync."
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.prereqs.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: steps.prereqs.outputs.enabled == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - name: Setup Node
        if: steps.prereqs.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.prereqs.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Sync Composio toolkit registry
        if: steps.prereqs.outputs.enabled == 'true'
        run: pnpm mcp:composio:sync-and-generate

      - name: Validate registry artifacts
        if: steps.prereqs.outputs.enabled == 'true'
        run: pnpm mcp:registry:check

      - name: Create Pull Request
        if: steps.prereqs.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: codex/composio-registry-sync
          commit-message: 'chore(registry): sync composio toolkits'
          title: 'chore(registry): sync composio toolkits'
          body: |
            Automated nightly sync of Composio toolkit inventory into the MCP Hub registry.

            The sync writes to `config/mcp-hub/registry.composio.generated.json`
            (the composio source layer) and then runs `pnpm mcp:registry:generate`
            to rebuild the merged `config/mcp-hub/registry.json`, the playbook
            catalog, and the fleet doc.

            Changes include:
            - `composio-toolkit-*` server entries (in the composio source layer)
            - `composio-all` bundle (in the composio source layer)
            - `composio-category-*` bundles (in the composio source layer)
            - regenerated `config/mcp-hub/registry.json`
            - regenerated MCP registry artifacts
          labels: |
            automation
            mcp
            composio
          delete-branch: true
