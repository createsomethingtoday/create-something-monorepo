name: Dependency Review

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'patches/extract-zip@2.0.1.patch'
      - 'security/extract-zip/**'
      - 'security/basic-ftp/**'
      - '.github/workflows/extract-zip-backport.yml'
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-review.yml'
      - 'config/security-advisory-exceptions.v1.json'
      - 'scripts/security-advisory-exceptions.mjs'
      - 'scripts/security-local-remediation.mjs'
      - 'scripts/security-standalone-removal.mjs'
      - 'scripts/test/security-standalone-removal.test.mjs'
      - 'scripts/test/security-local-remediation.test.mjs'
      - 'security/advisory-history/**'
      - 'scripts/test/security-advisory-exceptions.test.mjs'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Reject vulnerable dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Clean workspace install for byte verification
        run: pnpm install --frozen-lockfile --ignore-scripts --side-effects-cache=false

      - name: Verify owned exceptions and local remediation
        run: |
          node --test scripts/test/security-advisory-exceptions.test.mjs scripts/test/security-local-remediation.test.mjs scripts/test/security-standalone-removal.test.mjs
          node scripts/security-advisory-exceptions.mjs

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
