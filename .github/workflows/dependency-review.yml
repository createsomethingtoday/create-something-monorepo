name: Dependency Review

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-review.yml'
      - 'config/security-advisory-exceptions.v1.json'
      - 'scripts/security-advisory-exceptions.mjs'
      - 'scripts/test/security-advisory-exceptions.test.mjs'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Reject vulnerable dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify owned advisory exceptions
        run: |
          node --test scripts/test/security-advisory-exceptions.test.mjs
          node scripts/security-advisory-exceptions.mjs

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
