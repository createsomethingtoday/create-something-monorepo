name: Dotfiles account helper
on:
  pull_request:
    paths:
      - 'packages/dotfiles/scripts/codex-account.py'
      - 'packages/dotfiles/scripts/install-codex-account.sh'
      - 'packages/dotfiles/tests/**'
      - '.github/workflows/dotfiles-account-helper.yml'
  push:
    branches: [main]
    paths:
      - 'packages/dotfiles/scripts/codex-account.py'
      - 'packages/dotfiles/scripts/install-codex-account.sh'
      - 'packages/dotfiles/tests/**'
      - '.github/workflows/dotfiles-account-helper.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s packages/dotfiles/tests -v
      - run: bash -n packages/dotfiles/scripts/install-codex-account.sh
