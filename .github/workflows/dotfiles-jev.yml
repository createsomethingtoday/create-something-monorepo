name: Jev Codex integration
on:
  pull_request:
    paths:
      - 'packages/dotfiles/codex/jev/**'
      - 'packages/dotfiles/codex/skills/jev-coding-assist/**'
      - 'scripts/test/agent-skills-effectiveness.test.mjs'
      - '.github/workflows/dotfiles-jev.yml'
  push:
    branches: [main]
    paths:
      - 'packages/dotfiles/codex/jev/**'
      - 'packages/dotfiles/codex/skills/jev-coding-assist/**'
      - 'scripts/test/agent-skills-effectiveness.test.mjs'
      - '.github/workflows/dotfiles-jev.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python3 -m unittest discover -s packages/dotfiles/codex/jev -p 'test_*.py' -v
      - run: node --test scripts/test/agent-skills-effectiveness.test.mjs scripts/test/svg-education-precision.test.mjs
