name: Jev Codex integration
on:
  pull_request:
    paths:
      - 'packages/dotfiles/codex/jev/**'
      - 'packages/dotfiles/codex/skills/jev-coding-assist/**'
      - 'scripts/test/agent-skills-effectiveness.test.mjs'
      - '.github/workflows/dotfiles-jev.yml'
  push:
    branches: [main]
    paths:
      - 'packages/dotfiles/codex/jev/**'
      - 'packages/dotfiles/codex/skills/jev-coding-assist/**'
      - 'scripts/test/agent-skills-effectiveness.test.mjs'
      - '.github/workflows/dotfiles-jev.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python3 -m unittest discover -s packages/dotfiles/codex/jev -p 'test_*.py' -v
      - run: node --test scripts/test/agent-skills-effectiveness.test.mjs scripts/test/svg-education-precision.test.mjs
