name: Draw agent contracts
on:
  pull_request:
    paths: ['packages/mapping-canvas/**', '.github/workflows/draw-agent.yml']
  push:
    branches: [main]
    paths: ['packages/mapping-canvas/**', '.github/workflows/draw-agent.yml']
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s packages/mapping-canvas/scripts -p 'test_draw_*.py' -v
