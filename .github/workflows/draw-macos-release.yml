name: Draw macOS signed candidate

# Mac-only packaging. Publication requires the separate exact-byte owner receipt.
# This workflow never uploads to TestFlight or publishes a GitHub release.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Immutable version already committed in tauri.conf.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: draw-macos-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require approved production source
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test apps/draw-native/scripts/mac-release.test.mjs
      - run: pnpm --dir packages/mapping-canvas check
      - run: pnpm --dir packages/mapping-canvas test -- --run
  signed-candidate:
    needs: verify
    if: ${{ vars.DRAW_SIGNING_ENABLED == 'true' }}
    environment: draw-apple-production
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Validate existing protected signing inputs
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          configured="$(node -p "require('./apps/draw-native/src-tauri/tauri.conf.json').version")"
          test "$configured" = "$RELEASE_VERSION"
          for value in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            test -n "${!value:-}" || { echo "Missing protected release input: $value" >&2; exit 1; }
          done
          key_dir="$RUNNER_TEMP/draw-macos-private-keys"
          mkdir -m 700 "$key_dir"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$key_dir/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/draw-native prepare:canvas
      - run: cargo test --manifest-path apps/draw-native/src-tauri/Cargo.toml --lib
      - run: pnpm --dir packages/mapping-canvas verify:native-ui
      - run: pnpm --dir apps/draw-native build:dmg
      - name: Qualify one exact signed and notarized DMG
        env:
          DRAW_INSTALLED_SKIP_BUILD: '1'
          DRAW_REQUIRE_PRODUCTION_RELEASE: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("$GITHUB_WORKSPACE"/apps/draw-native/src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          DRAW_DMG_PATH="${dmgs[0]}" pnpm --dir apps/draw-native verify:installed
          shasum -a 256 "${dmgs[0]}" > apps/draw-native/output/MAC_SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: draw-macos-${{ inputs.release_version }}-${{ github.sha }}-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/draw-native/src-tauri/target/release/bundle/dmg/*.dmg
            apps/draw-native/output/MAC_SHA256SUMS
            apps/draw-native/output/installed-acceptance/*.json
      - name: Remove temporary API key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/draw-macos-private-keys"
      - name: Record owner acceptance boundary
        run: echo 'Not published. Exact-artifact native UI, live agent and rollback receipts are still required by receipt:macos. No iOS acceptance is claimed.'
