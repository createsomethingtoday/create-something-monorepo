name: Draw native release candidate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Immutable release version already present in tauri.conf.json
        required: true
        type: string
      build_number:
        description: Monotonic App Store Connect build number
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Verify immutable version input
        shell: bash
        run: |
          configured="$(node -p "require('./apps/draw-native/src-tauri/tauri.conf.json').version")"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$configured" = "$RELEASE_VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/mapping-canvas check
      - run: pnpm --dir packages/mapping-canvas test -- --run
      - name: Build native frontend for Tauri compile-time context
        run: pnpm --dir apps/draw-native prepare:canvas
      - run: cargo test --manifest-path apps/draw-native/src-tauri/Cargo.toml --lib
      - run: pnpm --dir apps/draw-native build:dmg
      - name: Build unsigned iPhone simulator archive
        run: CI=true pnpm --dir apps/draw-native exec tauri ios build --target aarch64-sim --archive-only --no-sign
      - name: Verify unsigned installed candidate
        run: DRAW_INSTALLED_SKIP_BUILD=1 pnpm --dir apps/draw-native verify:installed
      - name: Record artifact hashes
        shell: bash
        run: |
          shasum -a 256 apps/draw-native/src-tauri/target/release/bundle/dmg/*.dmg > apps/draw-native/output/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: draw-native-${{ inputs.release_version }}-unsigned-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/draw-native/src-tauri/target/release/bundle/dmg/*.dmg
            apps/draw-native/output/SHA256SUMS
            apps/draw-native/output/installed-acceptance/*.json
            apps/draw-native/src-tauri/gen/apple/build/create_something_draw_native_iOS.xcarchive/**

  signing-owner-gate:
    needs: verify-and-package
    runs-on: macos-15
    environment: draw-apple-production
    if: ${{ vars.DRAW_SIGNING_ENABLED == 'true' }}
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: pnpm install --frozen-lockfile
      - name: Materialize App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$key_dir/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$key_dir" >> "$GITHUB_ENV"
      - name: Verify immutable version and protected inputs
        shell: bash
        run: |
          set -euo pipefail
          configured="$(node -p "require('./apps/draw-native/src-tauri/tauri.conf.json').version")"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$configured" = "$RELEASE_VERSION"
          for value in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH; do
            test -n "${!value:-}" || { echo "Missing protected release input: $value" >&2; exit 1; }
          done
      - name: Run release verification
        run: |
          pnpm --dir packages/mapping-canvas check
          pnpm --dir packages/mapping-canvas test -- --run
          pnpm --dir apps/draw-native prepare:canvas
          cargo test --manifest-path apps/draw-native/src-tauri/Cargo.toml --lib
          pnpm --dir packages/mapping-canvas verify:native-ui
      - name: Build signed and notarized Mac DMG
        run: pnpm --dir apps/draw-native build:dmg
      - name: Verify installed Mac release gates
        env:
          DRAW_INSTALLED_SKIP_BUILD: '1'
          DRAW_REQUIRE_PRODUCTION_RELEASE: '1'
        run: pnpm --dir apps/draw-native verify:installed
      - name: Validate release slot before external mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="draw-v$RELEASE_VERSION"
          lookup_error="$RUNNER_TEMP/draw-release-lookup-error"
          if metadata="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>"$lookup_error")"; then
            test "$(jq -r .draft <<<"$metadata")" = 'true' || { echo "Refusing to mutate external state for published release $tag" >&2; exit 1; }
            test "$(jq -r .target_commitish <<<"$metadata")" = "$GITHUB_SHA" || { echo "Refusing to mutate external state for a different source commit" >&2; exit 1; }
          elif ! grep -q 'HTTP 404' "$lookup_error"; then
            cat "$lookup_error" >&2
            echo "Release lookup failed; refusing to mutate App Store Connect" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          tag_sha="$(awk -v peeled="refs/tags/$tag^{}" '$2 == peeled { print $1; found=1 } END { if (!found && NR) print first } NR == 1 { first=$1 }' <<<"$tag_refs" | head -n 1)"
          test -z "$tag_sha" || test "$tag_sha" = "$GITHUB_SHA" || { echo "Existing tag $tag targets a different source commit" >&2; exit 1; }
      - name: Build App Store Connect iPhone IPA
        env:
          CI: 'true'
        run: pnpm --dir apps/draw-native exec tauri ios build --target aarch64 --build-number "$BUILD_NUMBER" --export-method app-store-connect
      - name: Upload iPhone build to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find apps/draw-native/src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - name: Create production release receipt
        env:
          DRAW_RELEASE_VERSION: ${{ inputs.release_version }}
          DRAW_BUILD_NUMBER: ${{ inputs.build_number }}
        run: pnpm --dir apps/draw-native receipt:production
      - name: Record exact release hashes
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find apps/draw-native/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          ipa="$(find apps/draw-native/src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)"
          shasum -a 256 "$dmg" "$ipa" apps/draw-native/output/production-release.json > apps/draw-native/output/PRODUCTION_SHA256SUMS
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="draw-v$RELEASE_VERSION"
          dmg="$(find apps/draw-native/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          ipa="$(find apps/draw-native/src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)"
          if metadata="$(gh release view "$tag" --json isDraft,targetCommitish 2>/dev/null)"; then
            test "$(jq -r .isDraft <<<"$metadata")" = 'true' || { echo "Refusing to replace assets on published release $tag" >&2; exit 1; }
            test "$(jq -r .targetCommitish <<<"$metadata")" = "$GITHUB_SHA" || { echo "Refusing to replace assets for a different source commit" >&2; exit 1; }
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "CREATE SOMETHING Draw $RELEASE_VERSION" --notes "Signed production candidate. Publication remains gated on two clean physical Mac/iPhone acceptance runs."
          fi
          stage_id="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stage_dir="$RUNNER_TEMP/draw-release-$stage_id"
          readback_dir="$RUNNER_TEMP/draw-release-readback-$stage_id"
          manifest="$RUNNER_TEMP/draw-release-$stage_id.tsv"
          mkdir -p "$stage_dir" "$readback_dir"
          : > "$manifest"
          for source in "$dmg" "$ipa" apps/draw-native/output/production-release.json apps/draw-native/output/PRODUCTION_SHA256SUMS apps/draw-native/output/installed-acceptance/installed-acceptance.json; do
            canonical="$(basename "$source")"
            staged="$canonical.$stage_id"
            cp "$source" "$stage_dir/$staged"
            printf '%s\t%s\t%s\n' "$source" "$staged" "$canonical" >> "$manifest"
          done

          # Upload and verify uniquely named candidates before touching the last
          # known-good canonical assets. A retry may replace only its own staged set.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
          while IFS=$'\t' read -r source staged canonical; do
            stale_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq ".[] | select(.name == \"$staged\") | .id" | head -n 1)"
            test -z "$stale_id" || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$stale_id"
            gh release upload "$tag" "$stage_dir/$staged"
            gh release download "$tag" --pattern "$staged" --dir "$readback_dir"
            test "$(shasum -a 256 "$source" | awk '{print $1}')" = "$(shasum -a 256 "$readback_dir/$staged" | awk '{print $1}')"
          done < "$manifest"

          # Promote the fully verified staged set. If a rename fails, the verified
          # candidate remains attached to the draft for recovery.
          while IFS=$'\t' read -r source staged canonical; do
            canonical_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq ".[] | select(.name == \"$canonical\") | .id" | head -n 1)"
            test -z "$canonical_id" || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$canonical_id"
            staged_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq ".[] | select(.name == \"$staged\") | .id" | head -n 1)"
            test -n "$staged_id"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$staged_id" -f name="$canonical" >/dev/null
          done < "$manifest"
      - name: Verify published draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="draw-v$RELEASE_VERSION"
          readback="$RUNNER_TEMP/draw-release-readback"
          mkdir -p "$readback"
          gh release download "$tag" --dir "$readback"
          node - "$readback" <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');
          const root = process.argv[2];
          const receipt = JSON.parse(readFileSync(join(root, 'production-release.json'), 'utf8'));
          const sha = (name) => createHash('sha256').update(readFileSync(join(root, name))).digest('hex');
          for (const platform of ['macos', 'ios']) {
            const artifact = receipt.artifacts[platform];
            if (sha(artifact.name) !== artifact.sha256) throw new Error(`Published ${platform} bytes do not match the production receipt`);
          }
          NODE
      - name: Record protected release boundary
        run: |
          echo "Protected release completed for source $GITHUB_SHA."
          echo "The GitHub release remains draft until two clean physical acceptance receipts are attached."
