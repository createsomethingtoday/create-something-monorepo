name: Draw Pages Deploy

# Coordinator dispatches only after independent review and merge.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draw-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require a manual main branch release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Draw production releases must be manually dispatched from main."
            exit 1
          fi

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before dispatch."
            exit 1
          fi

      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Canon package
        run: pnpm --filter @create-something/canon package

      - name: Check Draw
        run: pnpm --filter @create-something/mapping-canvas check

      - name: Test Draw
        run: pnpm --filter @create-something/mapping-canvas test

      - name: Build Draw
        run: pnpm --filter @create-something/mapping-canvas build

      - name: Capture current Draw production deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-wrangler.mjs --cwd packages/mapping-canvas pages deployment list \
            --project-name=create-something-mapping-canvas --environment=production \
            2>&1 | tee "$RUNNER_TEMP/draw-pages-before.log"
          {
            echo '## Draw production before release'
            echo 'Retain these deployment identities for rollback.'
            echo '```text'
            cat "$RUNNER_TEMP/draw-pages-before.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy exact commit to Draw production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Record post-build state before any deploy. Untracked files are visible
          # for diagnosis; they never excuse changes to tracked release source.
          git status --short --untracked-files=normal > "$RUNNER_TEMP/draw-pages-source-status.log"
          {
            echo '## Draw source verification after build'
            printf 'Expected checkout: `%s`\n\n' "$GITHUB_SHA"
            echo 'Tracked files must match checkout (index and working tree).'
            echo 'Build outputs such as Canon dist and Draw .svelte-kit are ignored; any untracked paths are listed below.'
            echo 'Status (first 80 lines, each limited to 240 characters):'
            echo '```text'
            if [[ -s "$RUNNER_TEMP/draw-pages-source-status.log" ]]; then
              LC_ALL=C cut -c 1-240 "$RUNNER_TEMP/draw-pages-source-status.log" | sed -n '1,80p'
            else
              echo '(clean)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          node scripts/run-wrangler.mjs --cwd packages/mapping-canvas pages deploy .svelte-kit/cloudflare \
            --project-name=create-something-mapping-canvas \
            --branch=main \
            --commit-hash="$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/draw-pages-deployment.log"

      - name: Record deployment receipt
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          {
            echo '## Draw production deployment'
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Result: %s\n\n' "$DEPLOY_OUTCOME"
            echo 'Project: create-something-mapping-canvas · Branch: main'
            echo '```text'
            if [[ -f "$RUNNER_TEMP/draw-pages-deployment.log" ]]; then
              cat "$RUNNER_TEMP/draw-pages-deployment.log"
            else
              echo 'Deployment did not produce output.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
