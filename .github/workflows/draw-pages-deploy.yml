name: Draw Pages Deploy

# Coordinator dispatches only after independent review and merge.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draw-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require a manual main branch release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Draw production releases must be manually dispatched from main."
            exit 1
          fi

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before dispatch."
            exit 1
          fi

      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Canon package
        run: pnpm --filter @create-something/canon package

      - name: Check Draw
        run: pnpm --filter @create-something/mapping-canvas check

      - name: Test Draw
        run: pnpm --filter @create-something/mapping-canvas test

      - name: Build Draw
        run: pnpm --filter @create-something/mapping-canvas build

      - name: Deploy exact commit to Draw production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/run-wrangler.mjs --cwd packages/mapping-canvas pages deploy .svelte-kit/cloudflare \
            --project-name=create-something-mapping-canvas \
            --branch=main \
            --commit-hash="$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/draw-pages-deployment.log"

      - name: Record deployment receipt
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          {
            echo '## Draw production deployment'
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Result: %s\n\n' "$DEPLOY_OUTCOME"
            echo 'Project: create-something-mapping-canvas · Branch: main'
            echo '```text'
            if [[ -f "$RUNNER_TEMP/draw-pages-deployment.log" ]]; then
              cat "$RUNNER_TEMP/draw-pages-deployment.log"
            else
              echo 'Deployment did not produce output.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
