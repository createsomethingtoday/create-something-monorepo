name: Extract ZIP security regression

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/huggingface-spaces/motion-ontology/**'
      - 'scripts/test/extract-zip-*.test.mjs'
      - '.github/workflows/extract-zip-security.yml'

permissions:
  contents: read

jobs:
  regression:
    name: ZIP containment / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install only the regression subject without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/zip-security" --ignore-scripts --no-audit --no-fund --save-exact extract-zip@2.0.1
      - name: Verify negative control detects both advisories
        env:
          EXTRACT_ZIP_MODULE: ${{ runner.temp }}/zip-security/node_modules/extract-zip/index.js
        run: |
          cp "$EXTRACT_ZIP_MODULE" "$RUNNER_TEMP/extract-zip-original.js"
          if node --test --test-name-pattern='GHSA-' scripts/test/extract-zip-security.test.mjs > "$RUNNER_TEMP/zip-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/zip-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/zip-negative.log"
          grep -q '# fail 4' "$RUNNER_TEMP/zip-negative.log"
      - name: Test standalone patch installation and containment
        env:
          EXTRACT_ZIP_MODULE: ${{ runner.temp }}/zip-security/node_modules/extract-zip/index.js
          EXTRACT_ZIP_ORIGINAL: ${{ runner.temp }}/extract-zip-original.js
        run: |
          node --test scripts/test/extract-zip-installation.test.mjs
          node packages/huggingface-spaces/motion-ontology/security/apply-extract-zip-patch.cjs "$RUNNER_TEMP/zip-security/node_modules"
          node --test scripts/test/extract-zip-security.test.mjs
      - name: Verify pnpm applies the same patch bytes
        run: |
          mkdir -p "$RUNNER_TEMP/zip-pnpm"
          cp packages/huggingface-spaces/motion-ontology/security/extract-zip@2.0.1.patch "$RUNNER_TEMP/zip-pnpm/extract-zip.patch"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`${process.env.RUNNER_TEMP}/zip-pnpm/package.json`, JSON.stringify({name:'zip-patch-test', private:true, dependencies:{'extract-zip':'2.0.1'}, pnpm:{patchedDependencies:{'extract-zip@2.0.1':'extract-zip.patch'}}}));
          NODE
          pnpm --dir "$RUNNER_TEMP/zip-pnpm" install --ignore-scripts
          EXTRACT_ZIP_MODULE="$RUNNER_TEMP/zip-pnpm/node_modules/extract-zip/index.js" node --test scripts/test/extract-zip-security.test.mjs
      - name: Verify actual standalone motion-ontology npm install and build
        run: |
          cp -R packages/huggingface-spaces/motion-ontology "$RUNNER_TEMP/motion-ontology"
          cd "$RUNNER_TEMP/motion-ontology"
          npm install --ignore-scripts --no-audit --no-fund
          node security/apply-extract-zip-patch.cjs
          npm run build
