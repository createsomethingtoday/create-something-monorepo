name: Fix Broken Template Descriptions

permissions:
  contents: read

on:
  schedule:
    # 9:00 AM UTC daily (2:00 AM / 5:00 AM PT depending on DST)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Airtable updates)'
        type: boolean
        default: false
      limit:
        description: 'Max records to process (0 = all)'
        type: string
        default: '0'

jobs:
  fix-descriptions:
    name: Scan and fix broken long descriptions
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || vars.ENABLE_TEMPLATE_DESCRIPTION_FIX_SCHEDULE == 'true' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/webflow-template-analyzer/backend/requirements.txt

      - name: Install Python dependencies
        working-directory: packages/webflow-template-analyzer/backend
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run daily description check
        working-directory: packages/webflow-template-analyzer/backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.WEBFLOW_ANTHROPIC_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          python3 daily_check.py $ARGS

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-check-log-${{ github.run_id }}
          path: packages/webflow-template-analyzer/backend/daily_check_log.json
          if-no-files-found: ignore
          retention-days: 30
