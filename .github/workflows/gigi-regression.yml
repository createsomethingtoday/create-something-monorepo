name: GiGi regression

on:
  pull_request:
    paths:
      - 'apps/gigi-desktop/**'
      - 'packages/gigi-integrations/**'
      - '.github/workflows/gigi-regression.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/gigi-desktop/**'
      - 'packages/gigi-integrations/**'
      - '.github/workflows/gigi-regression.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-regression:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install scoped dependencies
        run: pnpm install --frozen-lockfile --filter @create-something/gigi-desktop... --filter @create-something/gigi-integrations... --filter @create-something/agency...
      - name: Prepare checksum-pinned CTX fixture
        run: |
          mkdir -p apps/gigi-desktop/src-tauri/resources
          node --input-type=module -e "import {prepareCtx} from './apps/gigi-desktop/scripts/ctx-companion.mjs'; await prepareCtx('apps/gigi-desktop/src-tauri/resources');"
          echo "GIGI_CTX_REAL_BINARY=$GITHUB_WORKSPACE/apps/gigi-desktop/src-tauri/resources/ctx" >> "$GITHUB_ENV"
      - run: pnpm --filter @create-something/gigi-integrations typecheck
      - run: pnpm --filter @create-something/gigi-integrations test
      - run: cargo test --locked --manifest-path apps/gigi-desktop/src-tauri/Cargo.toml
      - name: Build explicit synthetic MCP target
        run: |
          cargo build --locked --manifest-path apps/gigi-desktop/src-tauri/Cargo.toml --bin gigi-mcp
          mkdir -p "$RUNNER_TEMP/GiGi Synthetic.app/Contents/Resources"
          cp apps/gigi-desktop/src-tauri/target/debug/gigi-mcp "$RUNNER_TEMP/GiGi Synthetic.app/Contents/Resources/gigi-mcp"
          echo "GIGI_INSTALLED_MCP=$RUNNER_TEMP/GiGi Synthetic.app/Contents/Resources/gigi-mcp" >> "$GITHUB_ENV"
      - run: pnpm --filter @create-something/gigi-desktop test
      - name: Source conversion process acceptance
        run: node apps/gigi-desktop/scripts/source-proposal-acceptance.mjs "$GIGI_INSTALLED_MCP"
      - run: pnpm auth:retired-provider:check
