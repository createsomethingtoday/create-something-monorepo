name: GitHub Actions Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-github-actions-pins.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/check-github-actions-pins.mjs'

permissions:
  contents: read

jobs:
  immutable-actions:
    name: Require immutable action references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify action pins
        run: node scripts/check-github-actions-pins.mjs
