name: Goldin Coordinator

on:
  pull_request:
    paths:
      - 'packages/goldin-coordinator/**'
      - 'packages/ona-agents/**'
      - 'packages/canon/src/lib/auth/**'
      - 'packages/auth-platform/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/goldin-coordinator.yml'
  push:
    branches: [main]
    paths:
      - 'packages/goldin-coordinator/**'
      - '.github/workflows/goldin-coordinator.yml'

permissions:
  contents: read

concurrency:
  group: goldin-coordinator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goldin:
    name: Goldin domain and actual Cloudflare runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26.11.0'
          cache: pnpm
      - name: Install locked owning app and coordinator dependencies
        run: pnpm --filter @create-something/ona-agents... install --frozen-lockfile --ignore-scripts
      - name: Syntax, lint and domain contracts
        run: |
          pnpm --filter @create-something/goldin-coordinator check
          pnpm --filter @create-something/goldin-coordinator lint
          pnpm --filter @create-something/goldin-coordinator test
      - name: Build exported shared packages from source
        run: |
          pnpm --filter @create-something/auth-platform build
          pnpm --filter @create-something/tufte package
          pnpm --filter @create-something/canon package
      - name: Generated app artifacts and actual transactional runtime
        run: pnpm --filter @create-something/goldin-coordinator test:runtime
