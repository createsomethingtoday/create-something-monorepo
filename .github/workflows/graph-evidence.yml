name: Execution evidence graph

on:
  pull_request:
    paths:
      - '.github/workflows/graph-evidence.yml'
      - 'scripts/graph-engineering/**'
      - 'packages/workflow-compiler/**'
      - 'packages/workflow-runtime/**'
      - 'packages/symphony/src/**'
      - 'packages/database-layer/ontology/**'
      - 'packages/database-layer/scripts/lib/ontology.mjs'
      - 'packages/database-layer/test/ontology.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm bootstrap:worktree
      - run: pnpm graph:evidence:test
      - run: node --test packages/database-layer/test/ontology.test.mjs
