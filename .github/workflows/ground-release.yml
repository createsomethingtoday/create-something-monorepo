# Build and release Ground MCP binaries for npm distribution
name: Ground Release

on:
  push:
    tags:
      - 'ground-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., ground-v0.1.0)'
        required: true
      publish_only:
        description: 'Skip build and GitHub Release creation; publish an existing verified release to npm only'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (builds universal binary on arm64 runner)
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
          # Linux x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x64
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Record source provenance
        id: provenance
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: packages/ground
        run: cargo build --release --target ${{ matrix.target }}
        env:
          GROUND_SOURCE_SHA: ${{ steps.provenance.outputs.sha }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: packages/ground
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ground-mcp dist/
          cp target/${{ matrix.target }}/release/ground dist/
          tar -czvf ground-${{ matrix.name }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/ground
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\ground-mcp.exe dist\
          copy target\${{ matrix.target }}\release\ground.exe dist\
          Compress-Archive -Path dist\* -DestinationPath ground-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ground-${{ matrix.name }}
          path: packages/ground/ground-${{ matrix.name }}.*

  release:
    name: Create Release
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          find artifacts -type f -name 'ground-*' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Ground ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
            SHA256SUMS
          body: |
            ## Installation

            ### npm (recommended)
            ```bash
            npm install -g @createsomething/ground-mcp
            ```

            ### Manual download
            Download the appropriate binary for your platform from the assets below.

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon + Intel via Rosetta) | `ground-darwin-arm64.tar.gz` |
            | Linux x64 | `ground-linux-x64.tar.gz` |
            | Linux ARM64 | `ground-linux-arm64.tar.gz` |
            | Windows x64 | `ground-win32-x64.zip` |

            ### MCP Configuration

            Add to `.cursor/mcp.json`:
            ```json
            {
              "mcpServers": {
                "ground": {
                  "command": "ground-mcp"
                }
              }
            }
            ```

  publish-npm:
    name: Publish npm through trusted publishing
    needs: release
    if: ${{ always() && (inputs.publish_only || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag matches package version
        working-directory: packages/ground/npm
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          expected_tag="ground-v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected_tag"

      - name: Verify release checksum manifest
        working-directory: packages/ground/npm
        run: node release-verify.js

      - name: Publish package through npm trusted publishing
        working-directory: packages/ground/npm
        run: npm publish --access public
