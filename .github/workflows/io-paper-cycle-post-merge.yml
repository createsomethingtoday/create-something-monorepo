name: IO Paper Cycle Post Merge

on:
  push:
    branches:
      - main
    paths:
      - 'packages/io/src/routes/papers/**'
      - 'packages/io/src/routes/experiments/**'
      - 'packages/io/content/papers/**'
      - 'packages/io/content/experiments/**'
      - 'docs/policies/**'
      - 'STANDARDS.md'
      - 'scripts/io-paper-cycle-*.mjs'
      - 'scripts/policy-artifact-check.mjs'
      - 'packages/agent-sdk/agents/paper_agent.py'
      - 'packages/agent-sdk/scripts/run-paper.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/io-paper-cycle-preview.yml'
      - '.github/workflows/io-paper-cycle-post-merge.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: io-paper-cycle-post-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect paper-cycle context
        id: context
        run: |
          node scripts/io-paper-cycle-context.mjs \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --range-mode direct \
            --format json > io-paper-cycle-context.json
          cat io-paper-cycle-context.json
          echo "publishable=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('io-paper-cycle-context.json','utf8')); process.stdout.write(String(data.has_publishable_io_changes));")" >> "$GITHUB_OUTPUT"
          echo "policy=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('io-paper-cycle-context.json','utf8')); process.stdout.write(String(data.has_policy_changes));")" >> "$GITHUB_OUTPUT"
          {
            echo "routes<<EOF"
            node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('io-paper-cycle-context.json','utf8')); console.log((data.verification_routes || []).join(','));"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate policy artifacts
        if: steps.context.outputs.policy == 'true'
        run: pnpm policy:artifacts:check

      - name: Resolve merged PR
        if: steps.context.outputs.publishable == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const prs = response.data || [];
            if (prs.length === 0) {
              core.setFailed('Publishable .io changes on main must be associated with a merged PR.');
              return;
            }

            const pr = prs.find((item) => item.merged_at) || prs[0];
            const labels = (pr.labels || []).map((label) => label.name);

            core.setOutput('number', String(pr.number));
            core.setOutput('url', pr.html_url);
            core.setOutput('publish_approved', String(labels.includes('publish-approved')));

      - name: Enforce approved publication path
        if: steps.context.outputs.publishable == 'true'
        run: |
          if [ "${{ steps.pr.outputs.publish_approved }}" != "true" ]; then
            echo "Merged .io publication PR is missing publish-approved."
            exit 1
          fi

      - name: Deploy IO via Wrangler fallback
        if: steps.context.outputs.publishable == 'true' && steps.pr.outputs.publish_approved == 'true' && vars.IO_PAGES_USE_WRANGLER_DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @create-something/io build
          node scripts/run-wrangler.mjs --cwd packages/io pages deploy .svelte-kit/cloudflare \
            --project-name=create-something-io \
            --branch=main \
            --commit-dirty=true

      - name: Verify published routes
        if: steps.context.outputs.publishable == 'true' && steps.pr.outputs.publish_approved == 'true'
        run: |
          node scripts/io-paper-cycle-verify.mjs \
            --base-url "https://createsomething.io" \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --range-mode direct \
            --timeout-seconds 900 \
            --interval-seconds 15
