name: IO Paper Cycle Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review
    paths:
      - 'packages/io/src/routes/papers/**'
      - 'packages/io/src/routes/experiments/**'
      - 'packages/io/src/lib/config/**'
      - 'packages/io/content/papers/**'
      - 'packages/io/content/experiments/**'
      - 'docs/internal/experiments/**'
      - 'docs/policies/**'
      - 'STANDARDS.md'
      - 'scripts/io-paper-cycle-*.mjs'
      - 'scripts/policy-artifact-check.mjs'
      - 'packages/agent-sdk/agents/paper_agent.py'
      - 'packages/agent-sdk/scripts/run-paper.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/io-paper-cycle-preview.yml'
      - '.github/workflows/io-paper-cycle-post-merge.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: io-paper-cycle-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BRANCH_ALIAS: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test paper-cycle context
        run: pnpm paper-cycle:test

      - name: Collect paper-cycle context
        id: context
        run: |
          node scripts/io-paper-cycle-context.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --range-mode merge-base \
            --format json > io-paper-cycle-context.json
          cat io-paper-cycle-context.json
          echo "publishable=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('io-paper-cycle-context.json','utf8')); process.stdout.write(String(data.has_publishable_io_changes));")" >> "$GITHUB_OUTPUT"
          echo "policy=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('io-paper-cycle-context.json','utf8')); process.stdout.write(String(data.has_policy_changes));")" >> "$GITHUB_OUTPUT"
          {
            echo "routes<<EOF"
            node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('io-paper-cycle-context.json','utf8')); console.log((data.verification_routes || []).join(','));"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check IO
        run: pnpm --filter @create-something/io check

      - name: Lint IO
        if: steps.context.outputs.publishable == 'true'
        run: pnpm --filter @create-something/io lint

      - name: Test IO routes and handoff
        if: steps.context.outputs.publishable == 'true'
        run: |
          pnpm --filter @create-something/io test:search
          pnpm --filter @create-something/io test:footer-handoff

      - name: Build IO
        if: steps.context.outputs.publishable == 'true'
        run: pnpm --filter @create-something/io build

      - name: Validate policy artifacts
        if: steps.context.outputs.policy == 'true'
        run: pnpm policy:artifacts:check

      - name: Deploy IO preview
        if: steps.context.outputs.publishable == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/run-wrangler.mjs --cwd packages/io pages deploy .svelte-kit/cloudflare \
            --project-name=create-something-io \
            --branch="$PR_BRANCH_ALIAS" \
            --commit-dirty=true

      - name: Upsert preview comment
        if: steps.context.outputs.publishable == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_URL: https://${{ env.PR_BRANCH_ALIAS }}.create-something-io.pages.dev
          VERIFICATION_ROUTES: ${{ steps.context.outputs.routes }}
        with:
          script: |
            const marker = '<!-- io-paper-cycle-preview -->';
            const body = [
              marker,
              '## IO Paper Cycle Preview',
              '',
              `Preview URL: ${process.env.PREVIEW_URL}`,
              '',
              `Verification routes: ${process.env.VERIFICATION_ROUTES || '(route inference empty)'}`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce publish approval label on ready PRs
        if: steps.context.outputs.publishable == 'true' && github.event.pull_request.draft == false
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map((label) => label.name);
            if (!labels.includes('publish-approved')) {
              core.setFailed('Publishable .io PRs must carry the publish-approved label before they are merge-ready.');
            }
