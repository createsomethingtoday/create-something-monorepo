name: Jev URL classifier
on:
  pull_request:
    paths:
      - 'packages/webflow-site-analyzer-mcp/**'
      - '.github/workflows/jev-url-classifier.yml'
  push:
    branches: [main]
    paths:
      - 'packages/webflow-site-analyzer-mcp/**'
      - '.github/workflows/jev-url-classifier.yml'
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @create-something/webflow-site-analyzer-mcp...
      - run: pnpm --filter @create-something/webflow-site-analyzer-mcp test
