name: Jev URL classifier
on:
  pull_request:
    paths:
      - 'packages/webflow-site-analyzer-mcp/**'
      - '.github/workflows/jev-url-classifier.yml'
  push:
    branches: [main]
    paths:
      - 'packages/webflow-site-analyzer-mcp/**'
      - '.github/workflows/jev-url-classifier.yml'
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @create-something/webflow-site-analyzer-mcp...
      - run: pnpm --filter @create-something/webflow-site-analyzer-mcp test
