name: Marketplace Insights sync contracts
on:
  pull_request:
    paths:
      - 'packages/webflow-automation/marketplace-insights-sync/**'
      - 'packages/webflow-dashboard-core/**'
      - 'packages/webflow-dashboard/**'
      - 'apps/webflow-dashboard-cloud/**'
      - '.github/workflows/marketplace-insights-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'packages/webflow-automation/marketplace-insights-sync/**'
      - 'packages/webflow-dashboard-core/**'
      - 'packages/webflow-dashboard/**'
      - 'apps/webflow-dashboard-cloud/**'
      - '.github/workflows/marketplace-insights-contracts.yml'
permissions:
  contents: read
jobs:
  insights-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: bash -n packages/webflow-automation/marketplace-insights-sync/run.sh
      - run: node --test packages/webflow-automation/marketplace-insights-sync/sync.test.mjs packages/webflow-dashboard-core/src/marketplace-snapshot.test.mjs
      - run: pnpm --filter @create-something/webflow-dashboard-core check
      - run: pnpm --filter @create-something/webflow-dashboard-core test
      - run: pnpm --filter @create-something/webflow-dashboard check
      - run: pnpm --filter @create-something/webflow-dashboard test
      - run: pnpm --filter @create-something/webflow-dashboard-cloud check
