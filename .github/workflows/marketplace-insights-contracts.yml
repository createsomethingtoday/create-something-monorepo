name: Marketplace Insights sync contracts
on:
  pull_request:
    paths:
      - 'packages/webflow-automation/marketplace-insights-sync/**'
      - '.github/workflows/marketplace-insights-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'packages/webflow-automation/marketplace-insights-sync/**'
      - '.github/workflows/marketplace-insights-contracts.yml'
permissions:
  contents: read
jobs:
  insights-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: bash -n packages/webflow-automation/marketplace-insights-sync/run.sh
      - run: node --test packages/webflow-automation/marketplace-insights-sync/sync.test.mjs
