name: MCP Quality Gate

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/mcp-quality-gate.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-quality-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/mcp-quality-gate.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-quality-gate.yml'

permissions:
  contents: read

jobs:
  mcp-quality:
    name: Typecheck, Lint, Test MCP Packages
    runs-on: ubuntu-latest
    env:
      MCP_GATE_SCOPE: active

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: MCP typecheck gate
        run: pnpm mcp:gate:typecheck

      - name: MCP lint gate
        run: pnpm mcp:gate:lint

      - name: MCP test gate
        run: pnpm mcp:gate:test
