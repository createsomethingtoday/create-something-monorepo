name: MCP Quality Gate

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/mcp-quality-gate.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-quality-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/mcp-quality-gate.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-quality-gate.yml'

permissions:
  contents: read

jobs:
  mcp-quality:
    name: Typecheck, Lint, Test MCP Packages
    runs-on: ubuntu-latest
    env:
      MCP_GATE_SCOPE: active

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: MCP typecheck gate
        run: pnpm mcp:gate:typecheck

      - name: MCP lint gate
        run: pnpm mcp:gate:lint

      - name: MCP test gate
        run: pnpm mcp:gate:test
