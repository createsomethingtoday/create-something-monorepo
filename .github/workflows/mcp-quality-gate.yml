name: MCP Quality Gate

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/mcp-quality-gate.mjs'
      - 'scripts/test/ci-minimal-pass.test.mjs'
      - 'scripts/test/mcp-quality-gate.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-quality-gate.yml'
      # Execute the CI contract test when any workflow it inspects changes.
      - '.github/workflows/agent-legibility-check.yml'
      - '.github/workflows/svelte-strict-check.yml'
      - '.github/workflows/mcp-authz-policy.yml'
      - '.github/workflows/shared-auth-regressions.yml'
      - '.github/workflows/draw-agent.yml'
      - '.github/workflows/chatgpt-connection.yml'
      - '.github/workflows/public-distribution-ga.yml'
      - '.github/workflows/github-actions-policy.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/mcp-quality-gate.mjs'
      - 'scripts/test/ci-minimal-pass.test.mjs'
      - 'scripts/test/mcp-quality-gate.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-quality-gate.yml'
      # Execute the CI contract test when any workflow it inspects changes.
      - '.github/workflows/agent-legibility-check.yml'
      - '.github/workflows/svelte-strict-check.yml'
      - '.github/workflows/mcp-authz-policy.yml'
      - '.github/workflows/shared-auth-regressions.yml'
      - '.github/workflows/draw-agent.yml'
      - '.github/workflows/chatgpt-connection.yml'
      - '.github/workflows/public-distribution-ga.yml'
      - '.github/workflows/github-actions-policy.yml'

permissions:
  contents: read

jobs:
  mcp-quality:
    name: Typecheck, Lint, Test MCP Packages
    runs-on: ubuntu-latest
    env:
      MCP_GATE_SCOPE: active

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CI coverage and failure contracts
        run: node --test scripts/test/ci-minimal-pass.test.mjs scripts/test/mcp-quality-gate.test.mjs

      - name: MCP typecheck, lint and test gates
        # The all-stage entry point builds prerequisites once and aggregates failures.
        run: pnpm mcp:gate

      - name: Local MCP hub typecheck
        run: pnpm --filter @create-something/cs-mcp-hub typecheck

      - name: Local MCP hub tests
        run: pnpm --filter @create-something/cs-mcp-hub test
