name: MCP core and Hub contracts
on:
  pull_request:
    paths:
      - 'packages/mcp-core/**'
      - 'packages/cs-mcp-hub-remote/**'
      - 'packages/mcp-authz/**'
      - 'config/mcp-hub/**'
      - '.github/workflows/mcp-recovery-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'packages/mcp-core/**'
      - 'packages/cs-mcp-hub-remote/**'
      - 'packages/mcp-authz/**'
      - 'config/mcp-hub/**'
      - '.github/workflows/mcp-recovery-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @create-something/mcp-core build
      - run: pnpm --filter @create-something/mcp-authz build
      - run: pnpm --filter @create-something/mcp-core test
      - run: pnpm --filter @create-something/cs-mcp-hub-remote typecheck
      - run: pnpm --filter @create-something/cs-mcp-hub-remote test
