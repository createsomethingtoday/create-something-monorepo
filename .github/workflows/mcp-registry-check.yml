name: MCP Registry Check

on:
  pull_request:
    paths:
      - 'config/mcp-hub/**'
      - 'packages/**/package.json'
      - 'packages/cs-mcp-hub/**'
      - 'packages/playbook-mcp/src/catalog.registry.generated.ts'
      - 'docs/MCP_FLEET_REGISTRY.generated.md'
      - 'scripts/mcp-registry.ts'
      - 'scripts/mcp-registry-coverage.mjs'
      - 'scripts/composio-registry-sync.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-registry-check.yml'
  push:
    branches:
      - main
    paths:
      - 'config/mcp-hub/**'
      - 'packages/**/package.json'
      - 'packages/cs-mcp-hub/**'
      - 'packages/playbook-mcp/src/catalog.registry.generated.ts'
      - 'docs/MCP_FLEET_REGISTRY.generated.md'
      - 'scripts/mcp-registry.ts'
      - 'scripts/mcp-registry-coverage.mjs'
      - 'scripts/composio-registry-sync.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-registry-check.yml'

permissions:
  contents: read

concurrency:
  group: mcp-registry-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: Validate, check, and cover MCP registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate registry source (schema + policy + state.json)
        run: pnpm mcp:registry:validate

      - name: Check generated registry artifacts are up to date
        run: pnpm mcp:registry:check

      - name: Verify MCP and agent registry coverage
        run: pnpm mcp:registry:coverage

      - name: Run mcp-registry validator unit tests
        run: pnpm mcp:registry:test
