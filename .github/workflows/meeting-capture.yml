name: Meeting Capture
on:
  pull_request:
    paths:
      - 'apps/meeting-capture/**'
      - '.github/workflows/meeting-capture.yml'
  push:
    branches: [main]
    paths:
      - 'apps/meeting-capture/**'
      - '.github/workflows/meeting-capture.yml'
permissions:
  contents: read
jobs:
  synthetic-audio:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --package-path apps/meeting-capture/MeetingCapture
      - run: swift build -c release --package-path apps/meeting-capture/MeetingCapture
