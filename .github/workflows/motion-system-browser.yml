name: Motion system browser qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/huggingface-spaces/motion-ontology/**
      - .github/workflows/motion-system-browser.yml
permissions:
  contents: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/huggingface-spaces/motion-ontology
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-fund
      - run: node test/check-dependency-policy.mjs
      - run: npm run build
      - run: npm test
      - name: Test the runner's explicitly installed Chrome
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)" ;;
            macOS) export PUPPETEER_EXECUTABLE_PATH='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ;;
            Windows) export PUPPETEER_EXECUTABLE_PATH='C:\Program Files\Google\Chrome\Application\chrome.exe' ;;
          esac
          npm run test:browser
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the actual standalone image
        run: docker build -t motion-system-browser packages/huggingface-spaces/motion-ontology
      - name: Qualify packaged consumer without container network
        run: |
          docker run --rm --network none --mount "type=bind,source=$PWD/packages/huggingface-spaces/motion-ontology/test,target=/app/test,readonly" motion-system-browser node --import ./test/no-remote-node-network.mjs --test test/system-browser.test.mjs
          docker run --rm --network none --mount "type=bind,source=$PWD/packages/huggingface-spaces/motion-ontology/test,target=/app/test,readonly" motion-system-browser node --import ./test/no-remote-node-network.mjs test/consumer-smoke.mjs
          docker run --rm --network none --mount "type=bind,source=$PWD/packages/huggingface-spaces/motion-ontology/test,target=/app/test,readonly" motion-system-browser node test/check-dependency-policy.mjs
