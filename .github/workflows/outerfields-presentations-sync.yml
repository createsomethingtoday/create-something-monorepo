name: Sync OUTERFIELDS presentations subtree

on:
  # Triggered by the OUTERFIELDS MCP remote server after it publishes changes
  repository_dispatch:
    types: [outerfields_presentations_updated]

  # Manual trigger for recovery/debugging
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: outerfields-presentations-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "outerfields-presentations-bot"
          git config user.email "outerfields-presentations-bot@users.noreply.github.com"

      - name: Sync subtree
        run: |
          git subtree pull \
            --prefix "packages/agency/clients/outerfields/src/routes/presentations" \
            "https://github.com/createsomethingtoday/outerfields-presentations.git" \
            main \
            --squash \
            -m "chore(outerfields): sync presentations subtree"

      - name: Create sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: codex/outerfields-presentations-sync
          commit-message: 'chore(outerfields): sync presentations subtree'
          title: 'chore(outerfields): sync presentations subtree'
          body: |
            Automated sync of the OUTERFIELDS presentations subtree.

            Source repository: `createsomethingtoday/outerfields-presentations`
            Source branch: `main`
            Target prefix: `packages/agency/clients/outerfields/src/routes/presentations`
          labels: |
            automation
            outerfields
          delete-branch: true
