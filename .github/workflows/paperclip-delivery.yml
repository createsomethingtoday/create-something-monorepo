name: Paperclip delivery policy
on:
  pull_request:
    paths:
      - 'scripts/paperclip-delivery/**'
      - 'docs/guides/PAPERCLIP_AUTONOMOUS_DELIVERY.md'
      - '.github/workflows/paperclip-delivery.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/paperclip-delivery/**'
      - 'docs/guides/PAPERCLIP_AUTONOMOUS_DELIVERY.md'
      - '.github/workflows/paperclip-delivery.yml'
permissions:
  contents: read
jobs:
  delivery-policy:
    name: delivery-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test scripts/paperclip-delivery/*.test.mjs
      - run: node scripts/paperclip-delivery/cli.mjs verify-manifest scripts/paperclip-delivery scripts/paperclip-delivery/manifest.json
