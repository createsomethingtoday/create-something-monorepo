name: Paperclip delivery policy
on:
  pull_request:
    paths:
      - 'scripts/paperclip-delivery/**'
      - 'docs/guides/PAPERCLIP_AUTONOMOUS_DELIVERY.md'
      - '.github/workflows/paperclip-delivery.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/paperclip-delivery/**'
      - 'docs/guides/PAPERCLIP_AUTONOMOUS_DELIVERY.md'
      - '.github/workflows/paperclip-delivery.yml'
permissions:
  contents: read
jobs:
  delivery-policy:
    name: delivery-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test scripts/paperclip-delivery/*.test.mjs
      - run: node scripts/paperclip-delivery/cli.mjs verify-manifest scripts/paperclip-delivery scripts/paperclip-delivery/manifest.json
