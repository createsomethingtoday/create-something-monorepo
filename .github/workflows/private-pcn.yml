name: Private PCN
on:
  pull_request:
    paths:
      - 'packages/private-pcn/**'
      - 'packages/canon/src/lib/auth/**'
      - 'packages/auth-platform/**'
      - 'packages/identity-worker/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/private-pcn.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - run: pnpm install --filter @create-something/private-pcn... --filter @create-something/identity-worker... --frozen-lockfile
      - run: pnpm --filter @create-something/auth-platform build
      - run: pnpm --filter @create-something/tufte package
      - run: pnpm --filter @create-something/canon package
      - run: pnpm --filter @create-something/private-pcn check
      - run: pnpm --filter @create-something/private-pcn test
      - run: pnpm --filter @create-something/private-pcn build
      - run: pnpm --filter @create-something/identity-worker test
      - run: pnpm auth:retired-provider:check
