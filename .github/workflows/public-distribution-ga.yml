name: Public Distribution GA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Public Distribution GA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain for Ground
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify public-distribution and security contracts
        run: |
          node --test scripts/test/public-distribution.test.mjs
          node --test scripts/test/public-ga-policy.test.mjs
          node --test scripts/test/security-advisory-exceptions.test.mjs
          node scripts/security-advisory-exceptions.mjs
          node scripts/check-github-actions-pins.mjs

      - name: Verify Ground product and calibration contracts
        run: |
          node --test scripts/test/ground-adjudication.test.mjs
          node --test scripts/test/ground-ga-policy.test.mjs
          node --test scripts/test/ground-public-surface.test.mjs
          cargo test --manifest-path packages/ground/Cargo.toml
