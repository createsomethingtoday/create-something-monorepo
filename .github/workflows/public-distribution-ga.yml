name: Public Distribution GA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Public Distribution GA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain for Ground
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install verifier dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify public-distribution and security contracts
        run: |
          node --test scripts/test/public-distribution.test.mjs
          node --test scripts/test/public-ga-policy.test.mjs
          node --test scripts/test/security-advisory-exceptions.test.mjs
          node scripts/security-advisory-exceptions.mjs
          node scripts/check-github-actions-pins.mjs

      - name: Verify Ground product and calibration contracts
        run: |
          node --test scripts/test/ground-adjudication.test.mjs
          node --test scripts/test/ground-ga-policy.test.mjs
          node --test scripts/test/ground-public-surface.test.mjs
          node --test scripts/test/ground-adoption-contract.test.mjs
          cargo test --manifest-path packages/ground/Cargo.toml
          cargo build --manifest-path packages/ground/Cargo.toml --bins
          node scripts/ground-seeded-trial.mjs --native-dir packages/ground/target/debug --output /tmp/ground-seeded-trial.json
          node scripts/ground-execution-verify.mjs --native-dir packages/ground/target/debug --output /tmp/ground-execution.json
