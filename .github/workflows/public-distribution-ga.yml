name: Public Distribution GA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Public Distribution GA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain for Ground
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install verifier dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --side-effects-cache=false

      - name: Verify public-distribution and security contracts
        run: |
          node --test scripts/test/public-distribution.test.mjs
          node --test scripts/test/public-ga-policy.test.mjs
          node --test scripts/test/security-advisory-exceptions.test.mjs scripts/test/security-local-remediation.test.mjs scripts/test/security-standalone-removal.test.mjs
          node scripts/security-advisory-exceptions.mjs
          node scripts/check-github-actions-pins.mjs

      - name: Verify Ground product and calibration contracts
        run: |
          node --test scripts/test/ground-adjudication.test.mjs
          node --test scripts/test/ground-ga-policy.test.mjs
          node --test scripts/test/ground-public-surface.test.mjs
          node --test scripts/ground-release-evidence.test.mjs scripts/agency-ground-release-parity.test.mjs
          node --test scripts/test/ground-review.test.mjs
          node --test scripts/test/ground-adoption-contract.test.mjs
          cargo test --manifest-path packages/ground/Cargo.toml
          cargo build --manifest-path packages/ground/Cargo.toml --bins
          node --test scripts/test/ground-review-native.test.mjs
          node scripts/ground-seeded-trial.mjs --native-dir packages/ground/target/debug --output /tmp/ground-seeded-trial.json
          node scripts/ground-execution-verify.mjs --native-dir packages/ground/target/debug --output /tmp/ground-execution.json
          node scripts/ground-incremental-verify.mjs --native-dir packages/ground/target/debug --output /tmp/ground-incremental.json

      - name: Preserve incremental verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ground-incremental-receipt
          path: /tmp/ground-incremental.json
