name: RustDesk Monitor

on:
  pull_request:
    paths:
      - 'ops/rustdesk/**'
      - '.github/workflows/rustdesk-monitor.yml'
  push:
    branches: [main]
    paths:
      - 'ops/rustdesk/**'
      - '.github/workflows/rustdesk-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash -n ops/rustdesk/check-and-pull.sh
      - run: python3 ops/rustdesk/test_monitor.py
