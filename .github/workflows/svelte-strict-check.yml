name: Svelte Strict Check

on:
  pull_request:
    paths:
      - 'packages/**/src/**/*.svelte'
      - 'packages/**/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/svelte-strict-check.yml'

permissions:
  contents: read

jobs:
  svelte-strict-check:
    name: pnpm check (strict warnings)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mcp-core dependency
        run: pnpm --filter @create-something/mcp-core build

      - name: Build composio-bridge dependency
        run: pnpm --filter @create-something/composio-bridge build

      - name: Strict workspace check
        run: pnpm check
