name: Svelte Strict Check

on:
  pull_request:
    paths:
      - 'packages/**/src/**/*.svelte'
      - 'packages/**/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/svelte-strict-check.yml'

permissions:
  contents: read

jobs:
  svelte-strict-check:
    name: pnpm check (strict warnings)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mcp-core dependency
        run: pnpm --filter @create-something/mcp-core build

      - name: Build composio-bridge dependency
        run: pnpm --filter @create-something/composio-bridge build

      - name: Strict workspace check
        run: pnpm check
