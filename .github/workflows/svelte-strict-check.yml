name: Svelte Strict Check

on:
  pull_request:
    paths:
      - 'packages/**/src/**/*.svelte'
      - 'packages/**/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/svelte-strict-check.yml'

permissions:
  contents: read

jobs:
  svelte-strict-check:
    name: pnpm check (strict warnings)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust WASM tooling
        run: |
          if ! command -v rustup >/dev/null; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi

          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add wasm32-unknown-unknown

          if ! command -v wasm-pack >/dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap generated workspace deps
        run: pnpm paper-cycle:review:bootstrap

      - name: Strict workspace check
        run: pnpm check
