name: Template Review Hub contracts
on:
  pull_request:
    paths:
      - 'config/dify-agents/template-review-hub.*'
      - 'packages/webflow-template-review-mcp/src/tools.ts'
      - 'scripts/test/template-review-hub-proxy-tools.test.mjs'
      - '.github/workflows/template-review-hub-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'config/dify-agents/template-review-hub.*'
      - 'packages/webflow-template-review-mcp/src/tools.ts'
      - 'scripts/test/template-review-hub-proxy-tools.test.mjs'
      - '.github/workflows/template-review-hub-contracts.yml'
permissions:
  contents: read
jobs:
  hub-proxy-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/test/template-review-hub-proxy-tools.test.mjs
