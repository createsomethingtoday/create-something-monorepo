name: Template Review Hub contracts
on:
  pull_request:
    paths:
      - 'config/dify-agents/template-review-hub.*'
      - 'packages/webflow-template-review-mcp/src/tools.ts'
      - 'scripts/test/template-review-hub-proxy-tools.test.mjs'
      - '.github/workflows/template-review-hub-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'config/dify-agents/template-review-hub.*'
      - 'packages/webflow-template-review-mcp/src/tools.ts'
      - 'scripts/test/template-review-hub-proxy-tools.test.mjs'
      - '.github/workflows/template-review-hub-contracts.yml'
permissions:
  contents: read
jobs:
  hub-proxy-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/test/template-review-hub-proxy-tools.test.mjs
