name: Subtractive Triad Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  triad-audit:
    name: Philosophical Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Ground binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/ground/target/release/ground
          key: ground-${{ runner.os }}-${{ hashFiles('packages/ground/Cargo.lock') }}

      - name: Build Ground
        run: |
          cd packages/ground
          cargo build --release

      - name: Check CSS Token Adoption
        id: css-check
        run: |
          cd packages/ground
          RESULT=$(./target/release/ground find drift ../.. --extensions css 2>&1)
          ADOPTION=$(echo "$RESULT" | grep "Overall adoption:" | awk '{print $3}' | tr -d '%')
          echo "adoption=$ADOPTION" >> $GITHUB_OUTPUT
          if [ -n "$ADOPTION" ] && [ $(echo "$ADOPTION < 90" | bc -l) -eq 1 ]; then
            echo "::warning::CSS token adoption is below 90% ($ADOPTION%)"
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            echo "status=pass" >> $GITHUB_OUTPUT
          fi
          echo "$RESULT"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get PR diff
        id: diff
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --prune origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          if git merge-base "$BASE_REF" HEAD >/dev/null; then
            git diff --no-color "$BASE_REF"...HEAD > pr_diff.txt
          else
            echo "::warning::No merge base found for $BASE_REF and HEAD; falling back to direct diff"
            git diff --no-color "$BASE_REF" HEAD > pr_diff.txt
          fi
          echo "diff_size=$(wc -l < pr_diff.txt | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Run Subtractive Triad Audit
        id: audit
        run: |
          RESULT=$(cat pr_diff.txt | claude -p "Review this PR through the Subtractive Triad. Provide scores for DRY, Rams, Heidegger (0-10 each), list violations, and recommend APPROVE, REQUEST_CHANGES, or COMMENT." --output-format json --allowedTools "Read,Grep" 2>/dev/null || echo '{"error": "failed"}')
          ANALYSIS=$(echo "$RESULT" | jq -r '.result // "Audit could not complete"' 2>/dev/null || echo "Audit could not complete")
          echo "$ANALYSIS" > audit_result.txt
          if echo "$ANALYSIS" | grep -qi "REQUEST_CHANGES"; then
            echo "recommendation=request_changes" >> $GITHUB_OUTPUT
          elif echo "$ANALYSIS" | grep -qi "APPROVE"; then
            echo "recommendation=approve" >> $GITHUB_OUTPUT
          else
            echo "recommendation=comment" >> $GITHUB_OUTPUT
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post audit comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const audit = fs.readFileSync('audit_result.txt', 'utf8');
            const body = `## Subtractive Triad Audit\n\n${audit}\n\n---\n<sub>[CREATE SOMETHING](https://createsomething.ltd)</sub>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail on violations
        if: steps.audit.outputs.recommendation == 'request_changes'
        run: exit 1
