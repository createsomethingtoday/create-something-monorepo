name: Webflow recovery contracts
on:
  pull_request:
    paths:
      - 'packages/webflow-components/**'
      - 'packages/webflow-template-agent/**'
      - 'packages/webflow-template-search/**'
      - '.github/workflows/webflow-recovery-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'packages/webflow-components/**'
      - 'packages/webflow-template-agent/**'
      - 'packages/webflow-template-search/**'
      - '.github/workflows/webflow-recovery-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @create-something/webflow-components check
      - run: pnpm --filter @create-something/webflow-template-agent check
      - run: pnpm --filter @create-something/webflow-template-search check
