name: Webflow template validation

on:
  pull_request:
    paths:
      - 'packages/webflow-template-validation/cli/**'
      - 'packages/webflow-template-validation/extension/**'
      - 'packages/webflow-template-validation/shared/**'
      - 'packages/webflow-template-validation/spike/**'
      - 'packages/webflow-template-validation/worker/**'
      - '.github/workflows/webflow-template-validation.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/webflow-template-validation/cli/**'
      - 'packages/webflow-template-validation/extension/**'
      - 'packages/webflow-template-validation/shared/**'
      - 'packages/webflow-template-validation/spike/**'
      - 'packages/webflow-template-validation/worker/**'
      - '.github/workflows/webflow-template-validation.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-and-extension:
    name: CLI and Designer Extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install scoped dependencies
        run: pnpm install --frozen-lockfile --filter @create-something/webflow-template-validation-cli --filter @create-something/webflow-template-validation-extension
      - run: pnpm --filter @create-something/webflow-template-validation-cli check
      - run: pnpm --filter @create-something/webflow-template-validation-cli test
      - run: pnpm --filter @create-something/webflow-template-validation-cli build
      - run: pnpm --filter @create-something/webflow-template-validation-extension check
      - run: pnpm --filter @create-something/webflow-template-validation-extension test

  cli-platforms:
    name: CLI on ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install scoped dependencies
        run: pnpm install --frozen-lockfile --filter @create-something/webflow-template-validation-cli
      - run: pnpm --filter @create-something/webflow-template-validation-cli test
      # The package creators install: pack it, install it globally, and run it.
      - name: Pack, install, and run the CLI
        shell: bash
        run: |
          node packages/webflow-template-validation/cli/scripts/pack.mjs "$RUNNER_TEMP/wf-template-validate.tgz"
          npm install -g "$RUNNER_TEMP/wf-template-validate.tgz"
          wf-template-validate --version
          wf-template-validate --help

  worker:
    name: Validation worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install scoped dependencies
        run: pnpm install --frozen-lockfile --filter "@create-something/webflow-template-validation-worker..."
      - run: pnpm --filter @create-something/webflow-template-validation-worker check
      - run: pnpm --filter @create-something/webflow-template-validation-worker test
