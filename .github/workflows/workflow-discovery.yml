name: Workflow discovery and reconciliation

on:
  schedule:
    - cron: '23 8 * * 1-5'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/workflow-discovery.yml'
      - 'scripts/workflow-discovery/**'
      - 'packages/**/package.json'
      - 'apps/**/package.json'
      - 'packages/**/workflows/**'
      - 'packages/workflow-compiler/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: workflow-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Verify bootstrap runtime precedence
        run: node --test scripts/test/bootstrap-runtime-path.test.mjs
      - name: Bootstrap pinned dependencies
        run: pnpm bootstrap:worktree
      - name: Qualify discovery and repair boundaries
        run: pnpm workflow:discover:test
      - name: Discover and compile candidates
        run: node scripts/workflow-discovery/cli.mjs run --out "$RUNNER_TEMP/workflow-discovery"
      - name: Verify published generation
        run: node scripts/workflow-discovery/cli.mjs verify --out "$RUNNER_TEMP/workflow-discovery"
      - name: Retain candidate and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-discovery
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
