tasks:
  bootstrap:
    name: Bootstrap workspace
    description: Validate the pinned toolchain and ensure workspace dependencies are installed.
    triggeredBy:
      - postEnvironmentStart
    command: ./.ona/scripts/bootstrap.sh

  linear-ready:
    name: Linear ready
    description: Confirm the environment can reach Linear through the repo wrapper.
    triggeredBy:
      - manual
    command: pnpm linear:ready

  ona-rollout-check:
    name: Ona rollout check
    description: Verify the repo-tracked Ona rollout configuration is internally consistent.
    triggeredBy:
      - manual
    command: pnpm ona:rollout:check

  agency-check:
    name: Agency check
    description: Run the agency package validation flow.
    triggeredBy:
      - manual
    command: pnpm --filter @create-something/agency check

  repo-lint:
    name: Repo lint
    description: Run the workspace lint command from the monorepo root.
    triggeredBy:
      - manual
    command: pnpm lint

  repo-check:
    name: Repo check
    description: Run the workspace check command from the monorepo root.
    triggeredBy:
      - manual
    command: pnpm check

  webflow-dashboard-cloud-check:
    name: Webflow Dashboard Cloud check
    description: Run the typed validation flow for the Webflow Cloud intake app.
    triggeredBy:
      - manual
    command: pnpm --filter @create-something/webflow-dashboard-cloud check

  webflow-dashboard-cloud-build:
    name: Webflow Dashboard Cloud build
    description: Build the Webflow Cloud app in the Ona environment.
    triggeredBy:
      - manual
    command: pnpm --filter @create-something/webflow-dashboard-cloud build

  webflow-dashboard-cloud-preview:
    name: Webflow Dashboard Cloud preview
    description: Build and preview the OpenNext Cloudflare bundle for the Webflow Cloud app.
    triggeredBy:
      - manual
    command: pnpm --filter @create-something/webflow-dashboard-cloud preview

  webflow-dashboard-cloud-deploy:
    name: Webflow Dashboard Cloud deploy
    description: Build and deploy the Webflow Cloud app from the Ona environment.
    triggeredBy:
      - manual
    command: pnpm --filter @create-something/webflow-dashboard-cloud deploy

  agency-build:
    name: Agency build
    description: Build the agency package in the Ona environment.
    triggeredBy:
      - manual
    command: pnpm --filter @create-something/agency build

  agency-deploy-preview:
    name: Agency deploy preview
    description: Build and deploy the agency preview using project-scoped Cloudflare credentials.
    triggeredBy:
      - manual
    command: pnpm --filter @create-something/agency deploy:preview

services:
  webflow-dashboard-cloud-dev:
    name: Webflow Dashboard Cloud dev
    description: Start the Webflow Cloud app development loop in the product lane.
    triggeredBy:
      - manual
    commands:
      start: pnpm --filter @create-something/webflow-dashboard-cloud dev
      ready: curl -fsS http://127.0.0.1:3000 >/dev/null

  agency-dev:
    name: Agency dev
    description: Start the agency development loop with the packaged local libraries.
    triggeredBy:
      - manual
    commands:
      start: pnpm dev:agency
      ready: curl -fsS http://127.0.0.1:5173 >/dev/null

  product-dev:
    name: Product lane dev
    description: Start the product lane from the monorepo root.
    triggeredBy:
      - manual
    commands:
      start: pnpm dev:product

  services-dev:
    name: Services lane dev
    description: Start the services lane from the monorepo root.
    triggeredBy:
      - manual
    commands:
      start: pnpm dev:services

  platform-dev:
    name: Platform lane dev
    description: Start the platform lane from the monorepo root.
    triggeredBy:
      - manual
    commands:
      start: pnpm dev:platform
