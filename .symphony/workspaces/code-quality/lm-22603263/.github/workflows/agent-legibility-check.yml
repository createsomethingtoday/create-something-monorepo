name: Agent Legibility Check

on:
  pull_request:
    paths:
      - 'packages/*/README.md'
      - 'packages/*/package.json'
      - 'docs/guides/AGENT_LEGIBILITY_CONTRACT.md'
      - 'scripts/agent-legibility-check.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-legibility-check.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/*/README.md'
      - 'packages/*/package.json'
      - 'docs/guides/AGENT_LEGIBILITY_CONTRACT.md'
      - 'scripts/agent-legibility-check.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-legibility-check.yml'

permissions:
  contents: read

jobs:
  agent-legibility:
    name: Verify package legibility contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run agent legibility check
        run: pnpm agent:legibility:check
