<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#050505"/>
  <rect x="48" y="48" width="1504" height="804" rx="28" stroke="#F2F2F2" stroke-opacity="0.2"/>

  <text x="96" y="122" fill="#F5F5F5" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">
    Governed Reviewer Lane
  </text>
  <text x="96" y="164" fill="#BDBDBD" font-family="Helvetica, Arial, sans-serif" font-size="18">
    Webflow Marketplace reviewer workflow
  </text>

  <text x="96" y="244" fill="#F5F5F5" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700">
    Start small. Make it safe.
  </text>
  <text x="96" y="292" fill="#9E9E9E" font-family="Helvetica, Arial, sans-serif" font-size="26">
    The point is not full automation. The point is one safe action that actually helps.
  </text>

  <rect x="96" y="382" width="392" height="250" rx="24" fill="#111111" stroke="#F5F5F5" stroke-opacity="0.22"/>
  <text x="132" y="438" fill="#8C8C8C" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="2">
    STEP 01
  </text>
  <text x="132" y="486" fill="#F5F5F5" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700">
    Queue
  </text>
  <text x="132" y="530" fill="#D0D0D0" font-family="Helvetica, Arial, sans-serif" font-size="24">
    See what is ready
  </text>
  <text x="132" y="566" fill="#D0D0D0" font-family="Helvetica, Arial, sans-serif" font-size="24">
    for review and who
  </text>
  <text x="132" y="602" fill="#D0D0D0" font-family="Helvetica, Arial, sans-serif" font-size="24">
    owns what.
  </text>

  <rect x="604" y="382" width="392" height="250" rx="24" fill="#111111" stroke="#F5F5F5" stroke-opacity="0.22"/>
  <text x="640" y="438" fill="#8C8C8C" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="2">
    STEP 02
  </text>
  <text x="640" y="486" fill="#F5F5F5" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700">
    Assign to me
  </text>
  <text x="640" y="530" fill="#D0D0D0" font-family="Helvetica, Arial, sans-serif" font-size="24">
    One safe write:
  </text>
  <text x="640" y="566" fill="#D0D0D0" font-family="Helvetica, Arial, sans-serif" font-size="24">
    assign the version
  </text>
  <text x="640" y="602" fill="#D0D0D0" font-family="Helvetica, Arial, sans-serif" font-size="24">
    to yourself.
  </text>

  <rect x="1112" y="382" width="392" height="250" rx="24" fill="#111111" stroke="#F5F5F5" stroke-opacity="0.22"/>
  <text x="1148" y="438" fill="#8C8C8C" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="2">
    STEP 03
  </text>
  <text x="1148" y="486" fill="#F5F5F5" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700">
    Review context
  </text>
  <text x="1148" y="530" fill="#D0D0D0" font-family="Helvetica, Arial, sans-serif" font-size="24">
    Pull the context
  </text>
  <text x="1148" y="566" fill="#D0D0D0" font-family="Helvetica, Arial, sans-serif" font-size="24">
    you need before the
  </text>
  <text x="1148" y="602" fill="#D0D0D0" font-family="Helvetica, Arial, sans-serif" font-size="24">
    bigger manual decisions.
  </text>

  <line x1="500" y1="507" x2="580" y2="507" stroke="#F5F5F5" stroke-opacity="0.55" stroke-width="4"/>
  <polygon points="580,507 560,495 560,519" fill="#F5F5F5" fill-opacity="0.75"/>
  <line x1="1008" y1="507" x2="1088" y2="507" stroke="#F5F5F5" stroke-opacity="0.55" stroke-width="4"/>
  <polygon points="1088,507 1068,495 1068,519" fill="#F5F5F5" fill-opacity="0.75"/>

  <text x="617" y="348" fill="#8C8C8C" font-family="Helvetica, Arial, sans-serif" font-size="18">
    one safe action
  </text>

  <rect x="96" y="708" width="1408" height="92" rx="18" fill="#F5F5F5"/>
  <text x="136" y="764" fill="#050505" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">
    Only self-assignment is automated. Bigger review decisions stay manual.
  </text>

  <text x="96" y="836" fill="#7B7B7B" font-family="Helvetica, Arial, sans-serif" font-size="16">
    Queue -&gt; Assign to me -&gt; Review context
  </text>
  <text x="1286" y="836" fill="#7B7B7B" font-family="Helvetica, Arial, sans-serif" font-size="16">
    CREATE SOMETHING
  </text>
</svg>
