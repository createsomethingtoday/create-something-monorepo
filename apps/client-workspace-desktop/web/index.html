<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CREATE SOMETHING Client Workspace</title>
    <style>
      :root {
        color: #111318;
        background: #f4f1ea;
        font-family: Arial, 'Helvetica Neue', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(rgba(17, 19, 24, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(17, 19, 24, 0.055) 1px, transparent 1px), #f4f1ea;
        background-size: 48px 48px;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      section {
        width: min(560px, 100%);
        padding: 32px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(17, 19, 24, 0.16);
        border-radius: 10px;
        box-shadow: 0 24px 80px rgba(17, 19, 24, 0.1);
      }
      .mark {
        width: 16px;
        height: 16px;
        margin-bottom: 28px;
        background: #e54800;
        transform: rotate(45deg);
      }
      p:first-of-type {
        margin: 0 0 12px;
        color: #e54800;
        font:
          700 11px ui-monospace,
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 50px);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }
      p {
        color: #5e626b;
        line-height: 1.55;
      }
      code {
        display: block;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid rgba(17, 19, 24, 0.12);
        color: #30343b;
        font:
          12px/1.5 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="mark" aria-hidden="true"></div>
        <p>Client-owned workspace</p>
        <h1 id="title">Starting your local control surface.</h1>
        <p id="detail">
          The app is opening its verified delivery store and connecting to your installed Codex.
        </p>
        <code>Local storage · Signed delivery trust · No bundled credentials</code>
      </section>
    </main>
    <script>
      document.addEventListener('client-workspace-timeout', () => {
        document.getElementById('title').textContent = 'The local workspace could not start.';
        document.getElementById('detail').textContent =
          'Quit and reopen the app. Diagnostic details are retained only in local Application Support logs.';
      });
    </script>
  </body>
</html>
