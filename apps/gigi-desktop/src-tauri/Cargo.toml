[package]
name = "gigi_desktop"
version = "0.2.20"
edition = "2021"
default-run = "gigi"

[lib]
name = "gigi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gigi"
path = "src/main.rs"

[[bin]]
name = "gigi-mcp"
path = "src/bin/gigi-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
create-something-chatgpt-connection = { path = "../../../packages/chatgpt-connection" }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.15"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1.24"
chrono = "0.4.45"
chrono-tz = "0.10.4"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
toml = "=0.8.2"

libloading = "0.8"
