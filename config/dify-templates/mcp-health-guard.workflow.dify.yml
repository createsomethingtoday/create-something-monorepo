app:
  description: Read-only health guard for MCP Hub readiness, service visibility, policy status, and trace lookup.
  icon: M
  icon_background: '#1F1F1F'
  icon_type: emoji
  mode: agent-chat
  name: MCP Health Guard
  use_icon_as_answer_icon: true
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.3.8@592c8252795b5f75807de2d609a03196ed02596b409f7642b4a07548c7ff57ef
      version: null
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 8
    prompt: null
    strategy: function_call
    tools:
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: client_hub
        provider_name: Client Hub MCP
        provider_type: mcp
        tool_label: hub_status
        tool_name: hub_status
        tool_parameters: {}
        type: mcp
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: client_hub
        provider_name: Client Hub MCP
        provider_type: mcp
        tool_label: hub_list_services
        tool_name: hub_list_services
        tool_parameters: {}
        type: mcp
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: client_hub
        provider_name: Client Hub MCP
        provider_type: mcp
        tool_label: hub_policy_status
        tool_name: hub_policy_status
        tool_parameters: {}
        type: mcp
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: client_hub
        provider_name: Client Hub MCP
        provider_type: mcp
        tool_label: hub_trace_lookup
        tool_name: hub_trace_lookup
        tool_parameters:
          correlationId: null
          limit: null
        type: mcp
  annotation_reply:
