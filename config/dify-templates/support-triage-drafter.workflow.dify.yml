        default: ''
        label: thread_id
        max_length: 128
        required: false
        variable: thread_id
    - text-input:
        default: ''
        label: customer_email
        max_length: 256
        required: false
        variable: customer_email
    - paragraph:
        default: ''
        label: request_text
        max_length: 4000
        required: false
        variable: request_text
version: 0.6.0
