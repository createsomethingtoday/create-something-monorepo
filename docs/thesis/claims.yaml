      readable proof surfaces, not only hidden logs or chat transcripts.
    burden_of_proof:
      - The repo contains proof-surface theory.
      - The repo contains delivery records and generated trust catalogs.
      - Proof artifacts affect publish, hold, rollback, or graduation decisions.
    evidence:
      - id: proof-surface-paper
        type: file
        relation: supports
        path: packages/io/content/papers/proof-surface.md
        note: Research framing for proof as operating surface.
      - id: eval-evidence-paper
        type: file
        relation: supports
        path: packages/io/content/papers/eval-evidence-layer.md
        note: Defines eval evidence as decision support rather than vanity metrics.
      - id: deliveries-dir
        type: directory
        relation: illustrates
        path: docs/deliveries
        note: Client-safe proof records and delivery summaries.
      - id: public-trust-catalog
        type: file
        relation: implements
        path: docs/PUBLIC_AGENT_MCP_TRUST_CATALOG.generated.md
