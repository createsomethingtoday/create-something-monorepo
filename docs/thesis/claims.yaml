title: CREATE SOMETHING Living Systems Thesis Claims
source_thesis: docs/CREATE_SOMETHING_SYSTEMS_THESIS.md
generated_report: docs/CREATE_SOMETHING_SYSTEMS_THESIS_EVIDENCE.generated.md
purpose: >
  Repo-native claim and evidence map for the CREATE SOMETHING systems thesis.
  Claims should become stronger, weaker, stale, or contradicted as the codebase
  changes.
statuses:
  supported: Evidence directly supports the claim today.
  partial: Evidence supports part of the claim, but the operating proof is incomplete.
  unproven: The claim is plausible but not yet grounded in repo evidence.
  contradicted: Current repo evidence weakens or disproves the claim.
  stale: The claim once had support, but the evidence is no longer current.
relations:
  supports: The evidence directly supports the claim.
  implements: The evidence implements the claim in code or runtime structure.
  tests: The evidence validates expected behavior.
  illustrates: The evidence is an example, not sufficient proof by itself.
  contradicts: The evidence weakens or disproves the claim.
  stale: The evidence needs refresh before it can support the claim.
claims:
  - id: thesis.governed-ai-operating-system
    title: AI work becomes operational through governed systems, not agents alone.
    status: supported
    tier:
      - database
      - automation
      - judgment
    claim: >
      AI-enabled work becomes operational only when data, execution, policy,
      ownership, and proof are designed as one governed system.
    burden_of_proof:
      - A canonical thesis document states the argument.
      - The repo contains framework, policy, proof, and runtime artifacts.
      - Verification commands exist for at least part of the operating surface.
    evidence:
      - id: thesis-spine
        type: file
        relation: supports
        path: docs/CREATE_SOMETHING_SYSTEMS_THESIS.md
        anchors:
          - CREATE SOMETHING is a working thesis on how modern AI systems become useful
          - Build the connectivity and control layer between tools and AI
        note: Canonical synthesis of the systems thesis.
      - id: docs-map-route
        type: file
        relation: supports
        path: docs/README.md
        anchors:
          - CREATE_SOMETHING_SYSTEMS_THESIS.md
        note: Routes agents and operators to the thesis first.
      - id: agent-legibility-check
        type: command
        relation: tests
        command: pnpm agent:legibility:check -- --format json
        note: Verifies opted-in packages expose the expected legibility surface.
      - id: policy-artifact-check
        type: command
        relation: tests
        command: pnpm policy:artifacts:check
        note: Verifies versioned policy artifact pairs and required sections.
    falsification:
      - Generic agent setup produces equally reliable governed outcomes without explicit state, policy, ownership, and proof artifacts.
      - Repo artifacts cannot be used to debug, hand off, or improve real workflows.
    open_questions:
      - Which flagship case should become the first fully evidenced public defense?

  - id: thesis.governed-loop-reliability-system
    title: The governed loop is the unit of production reliability.
    status: partial
    tier:
      - database
      - automation
      - judgment
    claim: >
      Agent-assisted production work becomes dependable when the worker operates
      inside a loop with durable state, explicit policy, isolated execution,
      focused validation, eval evidence, proof receipts, and a visible next
      decision.
    burden_of_proof:
      - The loop model is documented as a repo operating model.
      - The repo contains executable checks for loop readiness, skill behavior,
        policy artifacts, and executor eval cases.
      - A paper or experiment plan states how to compare loop-backed execution
        against prompt-only execution.
    evidence:
      - id: loops-above-agents-guide
        type: file
        relation: supports
        path: docs/guides/LOOPS_ABOVE_AGENTS.md
        anchors:
          - A CREATE SOMETHING loop is a repeatable operating circuit with seven parts
          - Every loop run should leave a compact receipt
        note: Canonical loop operating model and evidence contract.
      - id: coding-agent-harness-guide
        type: file
        relation: supports
        path: docs/guides/CODING_AGENT_HARNESS_PATTERN.md
        anchors:
          - Turn a coding agent from a one-shot assistant into a repeatable worker
          - In this repo, harness engineering is the combination of
        note: Repo-local harness engineering pattern.
      - id: governed-loop-paper
        type: file
        relation: supports
        path: packages/io/content/papers/governed-loop-reliability-system.md
        anchors:
          - The reliable unit is not the agent.
          - Does a CREATE SOMETHING loop-backed agent process improve verified completion
        note: Public-facing codification and first experiment design.
      - id: solo-loop-check-command
        type: command
        relation: tests
        command: pnpm agent:solo-loop:check
        note: Verifies the solo-loop control files, legibility, policy, and unit-test gates.
      - id: skill-behavior-command
        type: command
        relation: tests
        command: pnpm agent:skills:test
        note: Verifies repo-owned skills retain behavioral contracts.
      - id: braintrust-mcp-list-command
        type: command
        relation: tests
        command: pnpm braintrust:eval:mcp:list
        note: Verifies MCP eval cases are discoverable without sending logs.
    falsification:
      - Prompt-only agent execution produces equal or better verified completion,
        evidence completeness, scope control, and safety behavior on the same
        bounded task set.
      - Loop receipts do not improve review, handoff, resume, rollback, or next
        decision quality.
      - Policy artifacts, eval outputs, and proof receipts exist but do not
        change publish, hold, rollback, split, or stop decisions.
    open_questions:
      - Which 6-10 bounded task corpus should become the first comparative loop benchmark?
      - What minimum improvement justifies the overhead of the loop-backed condition?

  - id: thesis.mcp-creation-is-the-moat
    title: MCP creation is the durable capability boundary.
    status: supported
    tier:
      - database
      - automation
    claim: >
      MCP consumption is becoming commoditized, but the design and creation of
      trustworthy MCP boundaries remains the strategic moat.
    burden_of_proof:
      - The repo states the MCP-first thesis.
      - The repo includes MCP creation scaffolds, registry controls, and deployed MCP package surfaces.
    evidence:
      - id: mcp-first-thesis
        type: file
        relation: supports
        path: docs/MCP_FIRST_THESIS.md
        anchors:
          - MCP creation
          - MCP consumption
        note: Strategic statement of the creation moat.
      - id: mcp-scaffold
        type: file
        relation: implements
        path: docs/MCP_SCAFFOLD.md
        note: Operational scaffold for creating new MCPs.
      - id: mcp-registry
        type: file
        relation: implements
        path: config/mcp-hub/registry.json
        note: Registry of MCP servers and exposed capability boundaries.
      - id: registry-check-command
        type: command
        relation: tests
        command: pnpm mcp:registry:check
        note: Verifies generated registry state when MCP inventory changes.
    falsification:
      - MCP runtime boundaries become irrelevant because agent platforms safely infer and enforce tool authority without explicit contracts.
      - Buyers no longer value custom connectivity, auth boundaries, or capability design.
    open_questions:
      - Which public MCP creation walkthrough best demonstrates the moat to outside developers?

  - id: thesis.three-tier-framework
    title: Database, Automation, and Judgment are the operating ontology.
    status: supported
    tier:
      - database
      - automation
      - judgment
    claim: >
      Database, Automation, and Judgment provide a useful operating ontology for
      designing, debugging, and explaining agentic systems.
    burden_of_proof:
      - The framework is documented.
      - The framework is exposed as an MCP, not only prose.
      - Package legibility maps repo surfaces into the framework vocabulary.
    evidence:
      - id: three-tier-doc
        type: file
        relation: supports
        path: docs/THREE_TIER_FRAMEWORK.md
        anchors:
          - Database
          - Rules
          - Policy
        note: Canonical framework document.
      - id: three-tier-mcp
        type: package
        relation: implements
        path: packages/three-tier-framework-mcp
        note: MCP implementation of the framework.
      - id: legibility-map
        type: command
        relation: tests
        command: pnpm agent:legibility:map -- --format json
        note: Maps opted-in packages to legible operating roles.
    falsification:
      - Real workflows consistently require a fourth core tier that cannot be treated as a composition of these three.
      - Operators cannot use the framework to localize failures or design better boundaries.
    open_questions:
      - Should external reviewers score cases against this ontology before it is treated as stable?

