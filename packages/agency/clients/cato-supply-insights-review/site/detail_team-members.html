  <script data-cato-nav-controller>
(function () {
  const desktopQuery = window.matchMedia('(min-width: 768px)');
  const closeDelay = 180;
  let ignoreFocusOpenUntil = 0;

  function getParts(dropdown) {
    return {
      toggle: dropdown.querySelector('.nav-link.is-dropdown'),
      panel: dropdown.querySelector('.nav_dropdown-nav')
    };
  }

  function setState(dropdown, open) {
    const { toggle, panel } = getParts(dropdown);
    dropdown.classList.toggle('is-open', open);
    if (toggle) {
      toggle.classList.toggle('w--open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-haspopup', 'true');
    }
    if (panel) {
      panel.classList.toggle('w--open', open);
      panel.setAttribute('aria-hidden', String(!open));
    }
  }

  function closeDropdown(dropdown) {
    clearTimeout(dropdown._catoCloseTimer);
    setState(dropdown, false);
  }

  function openDropdown(dropdown) {
    if (!desktopQuery.matches) return;
    document.querySelectorAll('.nav_dropdown').forEach((other) => {
      if (other !== dropdown) closeDropdown(other);
    });
    clearTimeout(dropdown._catoCloseTimer);
    setState(dropdown, true);
  }

  function scheduleClose(dropdown) {
    clearTimeout(dropdown._catoCloseTimer);
    dropdown._catoCloseTimer = window.setTimeout(() => closeDropdown(dropdown), closeDelay);
  }

  function closeAll() {
    document.querySelectorAll('.nav_dropdown').forEach(closeDropdown);
  }

  function initDropdown(dropdown, index) {
    if (dropdown._catoDropdownReady) return;
    dropdown._catoDropdownReady = true;
    dropdown.setAttribute('data-hover', 'false');
    const { toggle, panel } = getParts(dropdown);
    if (toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-haspopup', 'true');
      toggle.setAttribute('aria-controls', 'cato-nav-dropdown-' + index);
    }
    if (panel) {
      panel.setAttribute('id', 'cato-nav-dropdown-' + index);
      panel.setAttribute('aria-hidden', 'true');
    }

    if (toggle) {
      toggle.addEventListener('click', (event) => {
        if (!desktopQuery.matches) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        openDropdown(dropdown);
      }, true);
      toggle.addEventListener('keydown', (event) => {
        if (!desktopQuery.matches || (event.key !== 'Enter' && event.key !== ' ')) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        openDropdown(dropdown);
      }, true);
    }

    dropdown.addEventListener('mouseenter', () => openDropdown(dropdown));
    dropdown.addEventListener('mouseleave', () => scheduleClose(dropdown));
    dropdown.addEventListener('focusin', () => {
      if (performance.now() < ignoreFocusOpenUntil) return;
      openDropdown(dropdown);
    });
    dropdown.addEventListener('focusout', (event) => {
      if (!dropdown.contains(event.relatedTarget)) scheduleClose(dropdown);
    });
  }

  function initCatoNavDropdowns() {
    const dropdowns = Array.from(document.querySelectorAll('.nav_dropdown'));
    dropdowns.forEach(initDropdown);

    document.querySelectorAll('.nav-link:not(.is-dropdown), .nav-end .button, .show-mobile-landscape .button').forEach((item) => {
      item.addEventListener('mouseenter', closeAll);
      item.addEventListener('focusin', closeAll);
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.nav_dropdown')) closeAll();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      const activeDropdown = event.target.closest?.('.nav_dropdown');
      ignoreFocusOpenUntil = performance.now() + 240;
      closeAll();
      if (activeDropdown) {
        const { toggle } = getParts(activeDropdown);
        if (toggle) toggle.focus({ preventScroll: true });
      }
    });

    desktopQuery.addEventListener('change', closeAll);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCatoNavDropdowns);
  } else {
    initCatoNavDropdowns();
  }
})();

// Use a single initialization approach
function initializeSite() {
  SouthControl.global.init();
  const currentPage = $("[data-page]").attr("data-page");
  if (currentPage && SouthControl[currentPage]) {
    SouthControl[currentPage].init();
  }
}
// Check if all required libraries are loaded
if (
  typeof gsap !== "undefined" &&
  typeof $ !== "undefined" &&
  typeof Lenis !== "undefined"
) {
  // Wait for fonts to be ready before initializing
  document.fonts.ready.then(() => {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initializeSite);
    } else {
      initializeSite();
    }
  });
} else {
  // Fallback: wait for window load if libraries aren't ready
  window.addEventListener("load", () => {
    document.fonts.ready.then(initializeSite);
  });
}
