<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Decision Gate Render</title>
    <style>
      :root {
        --paper: #f7f7f1;
        --paper-shadow: #d3d3c8;
        --paper-edge: #b8b8ab;
        --carbon: #111315;
        --carbon-edge: #3e4142;
        --brass: #b4873e;
        --bench: #f0f0eb;
      }

      * { box-sizing: border-box; }

      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

      body {
        background:
          radial-gradient(circle at 75% 72%, rgba(9, 11, 12, 0.09), transparent 32%),
          radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.95), transparent 42%),
          linear-gradient(116deg, #efefea 0%, #f8f8f4 58%, #e8e8e1 100%);
      }

      .render {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
        overflow: hidden;
      }

      .grid {
        position: absolute;
        inset: 0;
        opacity: 0;
        background:
          linear-gradient(rgba(16, 18, 18, 0.055) 1px, transparent 1px) 0 0 / 100% 25%,
          linear-gradient(90deg, rgba(16, 18, 18, 0.05) 1px, transparent 1px) 0 0 / 25% 100%;
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.2;
        background-image:
          repeating-radial-gradient(circle at 20% 30%, rgba(35, 35, 32, 0.16) 0 0.4px, transparent 0.7px 3px),
          repeating-linear-gradient(112deg, transparent 0 5px, rgba(24, 24, 22, 0.04) 5px 5.5px, transparent 6px 12px);
        mix-blend-mode: multiply;
        pointer-events: none;
      }

      .stage {
        position: absolute;
        width: min(68vw, 1020px);
        height: min(74vw, 760px);
        right: 4.6vw;
        bottom: -2.2vw;
        perspective: 1600px;
        perspective-origin: 53% 44%;
        transform: scale(0.84);
        transform-origin: 100% 100%;
        transform-style: preserve-3d;
      }

      .shadow {
        position: absolute;
        width: 77%;
        height: 34%;
        left: 15%;
        bottom: 11%;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(8, 10, 10, 0.28) 0%, rgba(8, 10, 10, 0.11) 35%, transparent 70%);
        filter: blur(17px);
        transform: rotate(-12deg) skewX(-12deg);
      }

      .source {
        position: absolute;
        width: 69%;
        height: 40%;
        left: 7%;
        bottom: 15%;
        border-radius: 3px 14px 7px 9px;
        clip-path: polygon(7% 0, 100% 13%, 91% 100%, 0 80%);
        background:
          linear-gradient(130deg, #fafaf5, #e5e5dc 60%, #aeaea4),
          repeating-linear-gradient(100deg, transparent 0 7px, rgba(45, 45, 40, 0.025) 7px 8px);
        box-shadow: 18px 25px 35px rgba(7, 9, 10, 0.16), inset -12px -18px 24px rgba(101, 101, 91, 0.13);
        transform: rotateX(53deg) rotateZ(-11deg) rotateY(-11deg) translateZ(5px);
        transform-style: preserve-3d;
      }

      .source::before {
        content: '';
        position: absolute;
        inset: 5% 4% 11% 8%;
        clip-path: polygon(8% 0, 100% 13%, 91% 100%, 0 80%);
        border: 1px solid rgba(75, 75, 66, 0.12);
      }

      .source::after {
        content: '';
        position: absolute;
        width: 96%;
        height: 8px;
        left: 4%;
        bottom: 3%;
        border-radius: 50%;
        background: linear-gradient(90deg, transparent, var(--paper-edge) 20%, #f1f1ea 74%, transparent);
        filter: blur(1.3px);
      }

      .stack {
        position: absolute;
        width: 39%;
        height: 27%;
        left: 24%;
        bottom: 40%;
        transform-style: preserve-3d;
        transform: rotateX(51deg) rotateZ(8deg) rotateY(-8deg);
      }

      .sheet {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 4px 7px 6px 4px;
        background:
          linear-gradient(135deg, #fbfbf6, #e5e5dc 74%, #aaaa9f),
          repeating-linear-gradient(96deg, transparent 0 8px, rgba(43, 43, 38, 0.025) 8px 9px);
        box-shadow: 0 2px 1px rgba(31, 31, 28, 0.32);
      }

      .sheet:nth-child(1) { transform: translate3d(-9px, 20px, 0); }
      .sheet:nth-child(2) { transform: translate3d(-7px, 16px, 8px); }
      .sheet:nth-child(3) { transform: translate3d(-5px, 12px, 16px); }
      .sheet:nth-child(4) { transform: translate3d(-3px, 8px, 24px); }
      .sheet:nth-child(5) { transform: translate3d(-1px, 4px, 32px); }
      .sheet:nth-child(6) { transform: translate3d(1px, 0, 40px); }
      .sheet:nth-child(7) { transform: translate3d(3px, -4px, 48px); }

      .spine {
        position: absolute;
        width: 5.3%;
        height: 33%;
        left: 18.6%;
        bottom: 37%;
        z-index: 3;
        border-radius: 3px;
        background: linear-gradient(90deg, #070809, #3f4242 48%, #050606);
        box-shadow: 6px 9px 12px rgba(0, 0, 0, 0.28);
        transform: rotateX(51deg) rotateZ(8deg) rotateY(-8deg) translateZ(51px);
      }

      .fold {
        position: absolute;
        width: 46%;
        height: 59%;
        right: 5%;
        bottom: 19%;
        transform-style: preserve-3d;
      }

      .fold-base {
        position: absolute;
        width: 100%;
        height: 37%;
        left: -18%;
        bottom: 1%;
        border-radius: 6px 8px 9px 5px;
        background: linear-gradient(132deg, #fbfbf6, #e3e3d9 62%, #aaaa9f);
        box-shadow: 16px 25px 29px rgba(7, 9, 10, 0.17);
        transform: rotateX(58deg) rotateZ(-9deg) rotateY(-8deg) translateZ(16px);
      }

      .fold-upright {
        position: absolute;
        width: 77%;
        height: 88%;
        right: 7%;
        top: 1%;
        border-radius: 4px 10px 5px 4px;
        background:
          linear-gradient(122deg, #fdfdf8 0%, #e5e5dc 58%, #aeaea3 100%),
          repeating-linear-gradient(98deg, transparent 0 8px, rgba(38, 38, 34, 0.028) 8px 9px);
        box-shadow: -20px 20px 30px rgba(7, 9, 10, 0.18), inset -15px -8px 23px rgba(81, 81, 75, 0.12);
        transform: perspective(1150px) rotateY(-27deg) rotateX(4deg) rotateZ(-3deg);
      }

      .fold-upright::after {
        content: '';
        position: absolute;
        left: 8%;
        right: 12%;
        bottom: 7%;
        height: 1px;
        background: rgba(52, 52, 47, 0.14);
        box-shadow: 0 -45px 0 rgba(52, 52, 47, 0.06), 0 -90px 0 rgba(52, 52, 47, 0.04);
      }

      .rail {
        position: absolute;
        width: 5.4%;
        height: 93%;
        right: 1%;
        top: -1%;
        z-index: 4;
        border-radius: 4px;
        background: linear-gradient(90deg, #08090a, var(--carbon-edge) 48%, #050606 100%);
        box-shadow: 11px 15px 19px rgba(0, 0, 0, 0.27), inset 2px 0 0 rgba(255, 255, 255, 0.11);
        transform: perspective(1100px) rotateY(-11deg) rotateZ(-3deg);
      }

      .rail::after {
        content: '';
        position: absolute;
        width: 250%;
        height: 9%;
        right: -20%;
        bottom: 1%;
        border-radius: 5px;
        background: linear-gradient(180deg, #343739, #08090a 68%);
        box-shadow: 10px 9px 11px rgba(0, 0, 0, 0.24);
        transform: skewY(-8deg);
      }

      .authority-tab {
        position: absolute;
        width: 17%;
        height: 7.4%;
        right: 3.8%;
        top: 53%;
        z-index: 5;
        border-radius: 4px 2px 2px 4px;
        background: linear-gradient(135deg, #dec27b, var(--brass) 55%, #765318);
        box-shadow: -2px 5px 8px rgba(39, 26, 5, 0.25), inset 1px 1px 0 rgba(255, 244, 201, 0.55);
        transform: perspective(1000px) rotateY(-18deg) rotateZ(-3deg);
      }

      @media (max-width: 480px) {
        .grid { opacity: 0.28; }
        .stage {
          width: 640px;
          height: 560px;
          right: -165px;
          bottom: -42px;
          perspective: 1280px;
          transform: none;
        }
        .shadow { bottom: 3%; }
        .source { bottom: 6%; }
        .stack { bottom: 32%; }
        .spine { bottom: 29%; }
        .fold { bottom: 9%; }
      }
      body[data-variant='mobile'] .grid { opacity: 0; }
      body[data-variant='mobile'] .stage { width: 640px; height: 560px; right: 120px; bottom: 10px; perspective: 1280px; transform: none; }
      body[data-variant='mobile'] .shadow { bottom: 3%; }
      body[data-variant='mobile'] .source { bottom: 6%; }
      body[data-variant='mobile'] .stack { bottom: 32%; }
      body[data-variant='mobile'] .spine { bottom: 29%; }
      body[data-variant='mobile'] .fold { bottom: 9%; }
    </style>
  </head>
  <body data-variant="">
    <script>document.body.dataset.variant = new URLSearchParams(window.location.search).get("variant") === "mobile" ? "mobile" : "desktop";</script>
    <main class="render" aria-label="Original Paper Decision Gate visual study">
      <div class="grid" aria-hidden="true"></div>
      <div class="stage" aria-hidden="true">
        <div class="shadow"></div>
        <div class="source"></div>
        <div class="stack">
          <i class="sheet"></i><i class="sheet"></i><i class="sheet"></i><i class="sheet"></i>
          <i class="sheet"></i><i class="sheet"></i><i class="sheet"></i>
        </div>
        <div class="spine"></div>
        <div class="fold"><div class="fold-base"></div><div class="fold-upright"></div></div>
        <div class="rail"></div>
        <div class="authority-tab"></div>
      </div>
      <div class="grain" aria-hidden="true"></div>
    </main>
  </body>
</html>
