<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Control system context mobile design</title><desc id="desc">A stacked mobile system-context artifact with authority focus, graph, inspector, and proof receipt.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dbddd7" stroke-opacity=".55"/></pattern><style>text{font-family:Inter,Arial,sans-serif;fill:#101316}.mono{font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:.07em}.meta{font-size:9px}.small{font-size:11px}.label{font-size:12px;font-weight:700}.muted{fill:#666b6d}.panel{fill:#fff;stroke:#ced0ca}.wait{fill:#eef3ff;stroke:#8ea8dd}.stop{fill:#fff0f0;stroke:#d99595}.run{fill:#eaf4ed;stroke:#91b49c}</style></defs>
  <rect width="390" height="844" fill="#efefe9"/><rect x="12" y="12" width="366" height="820" rx="6" fill="#fbfbf7" stroke="#c9cbc5"/><rect x="13" y="13" width="364" height="818" rx="5" fill="url(#grid)" opacity=".55"/>
  <text x="28" y="40" class="mono meta muted">CONTROL / SYSTEM CONTEXT</text><text x="28" y="69" font-size="19" font-weight="700">Template review</text><text x="28" y="90" class="small muted">Evidence can move. Human judgment remains.</text>
  <rect x="28" y="106" width="150" height="25" rx="12" fill="#f0f1ed" stroke="#d3d5cf"/><circle cx="42" cy="118.5" r="3" fill="#23774c"/><text x="51" y="122" class="mono meta">CHECKED JUL 22</text>
  <g transform="translate(28 148)"><rect width="158" height="34" rx="4" class="panel"/><text x="42" y="22" class="label">Dependencies</text><rect x="166" width="158" height="34" rx="4" fill="#101316"/><text x="218" y="22" class="label" fill="#fff" style="fill:#fff">Authority</text><rect y="42" width="158" height="34" rx="4" class="panel"/><text x="58" y="64" class="label">Change</text><rect x="166" y="42" width="158" height="34" rx="4" class="panel"/><text x="229" y="64" class="label">Proof</text></g>
  <rect x="28" y="242" width="334" height="238" rx="4" fill="#f8f8f3" stroke="#cfd1cc"/>
  <g stroke="#777c78" fill="none"><path d="M113 296H146"/><path d="M228 296h27"/><path d="M187 330v37"/><path d="M228 398h30"/></g>
  <g transform="translate(44 270)"><rect width="69" height="52" rx="4" class="panel"/><text x="8" y="18" class="mono meta">SOURCE</text><text x="8" y="36" class="label">Packet</text></g>
  <g transform="translate(146 270)"><rect width="82" height="52" rx="4" class="run"/><text x="8" y="18" class="mono meta">RUN</text><text x="8" y="36" class="label">Checks</text></g>
  <g transform="translate(255 270)"><rect width="90" height="52" rx="4" class="run"/><text x="8" y="18" class="mono meta">RUN</text><text x="8" y="36" class="label">Brief</text></g>
  <g transform="translate(142 367)"><rect width="86" height="58" rx="4" class="wait" stroke-width="2"/><text x="8" y="18" class="mono meta">WAIT</text><text x="8" y="37" class="label">Reviewer</text><text x="8" y="50" class="meta muted">Human decision</text></g>
  <g transform="translate(44 367)"><rect width="78" height="58" rx="4" class="stop"/><text x="8" y="18" class="mono meta">STOP</text><text x="8" y="37" class="label">No guess</text><text x="8" y="50" class="meta muted">Evidence first</text></g>
  <g transform="translate(258 367)"><rect width="87" height="58" rx="4" class="panel"/><text x="8" y="18" class="mono meta">PROOF</text><text x="8" y="37" class="label">Record</text><text x="8" y="50" class="meta muted">Dated</text></g>
  <text x="44" y="461" class="mono meta muted">PUBLIC WORKED EXAMPLE · NO PRODUCTION TOOLS</text>
  <rect x="28" y="495" width="334" height="240" rx="4" class="panel"/>
  <text x="46" y="521" class="mono meta muted">SELECTED RECORD</text><text x="46" y="549" font-size="18" font-weight="700">Reviewer decision</text><rect x="272" y="525" width="65" height="27" rx="13" class="wait"/><text x="289" y="543" class="mono meta" fill="#235fdb" style="fill:#235fdb">WAIT</text>
  <line x1="46" x2="344" y1="566" y2="566" stroke="#d0d2cc"/>
  <text x="46" y="592" class="mono meta muted">OWNER</text><text x="185" y="592" class="label">Human reviewer</text><text x="46" y="621" class="mono meta muted">FRESHNESS</text><text x="185" y="621" class="label">Current</text><text x="46" y="650" class="mono meta muted">EVIDENCE</text><text x="185" y="650" class="label">Dated report</text>
  <text x="46" y="684" class="small muted">A person decides approve, reject, request</text><text x="46" y="701" class="small muted">changes, or escalate policy ambiguity.</text>
  <rect x="28" y="750" width="334" height="58" rx="4" fill="#101316"/><text x="44" y="773" class="mono meta" fill="#bfc4c1" style="fill:#bfc4c1">CHANGED</text><text x="44" y="792" class="small" fill="#fff" style="fill:#fff">Evidence bounded · judgment human · recovery named</text>
</svg>
