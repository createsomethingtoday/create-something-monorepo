<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Map system-context rail design</title><desc id="desc">A compact system-context rail integrated above one editable workflow canvas, avoiding a second graph.</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dcddd8" stroke-opacity=".55"/></pattern><style>text{font-family:Inter,Arial,sans-serif;fill:#111417}.mono{font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:.07em}.meta{font-size:10px}.small{font-size:12px}.label{font-size:13px;font-weight:700}.muted{fill:#666b6d}.panel{fill:#fff;stroke:#ced0ca}</style></defs>
  <rect width="1200" height="420" fill="#efefe9"/><rect x="30" y="26" width="1140" height="368" rx="6" fill="#fbfbf7" stroke="#c9cbc5"/>
  <text x="58" y="58" class="mono meta muted">MAPPING WARMUP / PROSPECT CONTEXT</text><text x="58" y="88" font-size="21" font-weight="700">Map one workflow</text><text x="58" y="110" class="small muted">One editor. Context stays visible without claiming a live connection.</text>
  <rect x="58" y="133" width="1084" height="64" rx="4" class="panel"/>
  <g transform="translate(78 151)"><text class="mono meta muted">BOUNDARY</text><text y="24" class="label">No production tools</text></g>
  <g transform="translate(332 151)"><text class="mono meta muted">DEPENDENCIES</text><text y="24" class="label">Owner · source · approval</text></g>
  <g transform="translate(628 151)"><text class="mono meta muted">FRESHNESS</text><text y="24" class="label">Prospect context · not verified</text></g>
  <g transform="translate(928 151)"><text class="mono meta muted">PROOF</text><text y="24" class="label">Name where evidence lands</text></g>
  <rect x="58" y="215" width="1084" height="146" rx="4" fill="url(#grid)" stroke="#ced0ca"/>
  <text x="78" y="244" class="mono meta muted">ONE EDITABLE WORKFLOW MAP</text>
  <g stroke="#747873" fill="none"><path d="M285 302H392"/><path d="M582 302H688"/><path d="M866 302H966"/></g>
  <g transform="translate(116 270)"><rect width="169" height="64" rx="4" class="panel"/><text x="12" y="22" class="mono meta">OWNER · WAIT</text><text x="12" y="45" class="label">Workflow owner</text></g>
  <g transform="translate(392 270)"><rect width="190" height="64" rx="4" class="panel"/><text x="12" y="22" class="mono meta">SOURCE · UNKNOWN</text><text x="12" y="45" class="label">Workflow to map</text></g>
  <g transform="translate(688 270)"><rect width="178" height="64" rx="4" fill="#eef3ff" stroke="#94abe0"/><text x="12" y="22" class="mono meta">DECISION · WAIT</text><text x="12" y="45" class="label">Approval boundary</text></g>
  <g transform="translate(966 270)"><rect width="142" height="64" rx="4" fill="#fff0f0" stroke="#d99a9a"/><text x="12" y="22" class="mono meta">PROOF · MISSING</text><text x="12" y="45" class="label">Add evidence</text></g>
  <rect x="970" y="65" width="172" height="38" rx="4" fill="#101316"/><text x="998" y="89" class="label" fill="#fff" style="fill:#fff">Load worked example</text>
</svg>
