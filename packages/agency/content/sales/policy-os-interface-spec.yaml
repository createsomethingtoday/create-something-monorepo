version: "1.0"
name: "Policy OS Commercial Interface"
owner: "CREATE SOMETHING .agency"
updated_at: "2026-03-13"

message_taxonomy:
  core_phrase: "Production-safe workflow infrastructure."
  client_facing_delivery_vector: "Skills + MCP"
  technical_proof_vector: "MCP + Skills"

offer_ladder:
  - name: "Workflow Infrastructure"
    purpose: "Build trusted workflow substrate and deterministic execution paths."
  - name: "Policy OS"
    purpose: "Add policy controls, release gates, approval rules, blocked-state UX, and incident loops."
  - name: "Enterprise Extension"
    purpose: "Handle high-stakes cross-system governance and custom trust boundaries."

one_pager_interface:
  input:
    - buyer_context
    - business_objective
    - workflow_pain
    - current_failure_cost
    - risk_profile
  output:
    - concise_narrative
    - offer_ladder_mapping
    - trust_artifacts
    - cta
  trust_artifacts:
    - "mcp_contract.yaml"
    - "agent_contract.yaml"
    - "outcome_contract.md"
    - "golden_tasks.yaml + runbook"
  cta:
    name: "Workflow Mapping Session"
    expected_output:
      - pilot_scope
      - policy_boundary
      - thirty_day_plan

call_script_interface:
  input:
    - call_stage
    - buyer_responses
    - objection_type
  output:
    - next_question
    - pitch_block
    - close_path
  stages:
    - "0-3: context and intent"
    - "3-10: qualification"
    - "10-15: diagnosis playback"
    - "15-22: solution mapping"
    - "22-26: objection handling"
    - "26-30: close"
  required_capture:
    - workflow_candidate
    - business_objective
    - current_failure_cost
    - workflow_owner
    - systems_in_scope
    - policy_boundary
    - recommended_tier
    - next_step_owner
    - next_step_date
  close_paths:
    high_fit: "Schedule paid Workflow Mapping Session"
    medium_fit: "Run MCP-only wedge with explicit Policy OS trigger"
    low_fit: "Park or refer with re-entry condition"

operating_model:
  - "Auto-allow safe actions"
  - "Route risky actions to approval inbox"
  - "Block disallowed actions with reason and audit trail"

policy_boundary:
  required_classes:
    - auto_allow
    - approval_required
    - block
  required_supporting_fields:
    - escalation_triggers
    - fallback_manual_path
    - ownership_boundary
    - release_gate_conditions

reliability_kpis:
  - unreviewed_risky_actions_prevented
  - approval_turnaround
  - incident_rate_trend
  - governed_workflow_coverage

discovery_note_required_fields:
  - workflow_candidate
  - business_objective
  - current_failure_cost
  - risk_class
  - required_approvals
  - integration_systems
  - workflow_owner
  - policy_boundary
  - recommended_package_tier
  - next_step_owner
  - next_step_date

langfuse_positioning:
  role: "observability_and_evals"
  not_role: "policy_control_plane"
