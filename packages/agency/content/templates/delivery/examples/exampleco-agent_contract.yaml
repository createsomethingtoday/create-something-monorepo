version: "0.1"
artifact: "agent_contract"
status: "example"

client:
  name: "ExampleCo"
  workflow_name: "quote_to_confirmation"
  workflow_owner: "RevOps Director"

commercial_guardrails:
  service_tier: "policy_os_trial"
  monthly_recurring_revenue: "$12,500"
  gross_margin_floor_percent: 70
  owner_compensation_fit: "fits"
  operator_load_budget:
    max_live_review_meetings_per_month: 1
    async_review_frequency: "weekly"
    covered_workflow_count: 1
    covered_downstream_systems: 3
    monthly_policy_tuning_limit: "pilot-bounded"
    expansion_triggers:
      - "new workflow"
      - "extra downstream system"
      - "custom UI"
      - "higher meeting cadence"

purpose:
  business_objective: "Reduce manual reconciliation and prevent incorrect quote confirmations from being sent."
  operator_outcome: "Ops reviews only exceptions and approvals instead of checking every order manually."

runtime_profile:
  delivery_vector: "Skills + MCP"
  execution_mode: "approval_gated"
  environment: "production"

action_policy:
  auto_allow:
    - action: "Read HubSpot, order database, and Stripe state for workflow comparison."
      rationale: "This is required for diagnosis and does not change customer-facing state."
    - action: "Generate draft confirmation email for internal review."
      rationale: "Draft generation is reversible and supports faster human review."
  approval_required:
    - action: "Create or update pricing exception record."
      rationale: "This changes operational state and can redirect downstream work."
      approval_inbox: "RevOps shared approval inbox"
    - action: "Send customer confirmation email."
      rationale: "This is the primary customer-facing write action and requires explicit approval."
      approval_inbox: "RevOps shared approval inbox"
  block:
    - action: "Issue refund through billing system."
      rationale: "Refunds are outside pilot scope and financially destructive."
    - action: "Delete customer or order records."
      rationale: "Destructive data actions are prohibited in this workflow."
    - action: "Overwrite approved pricing without explicit human approval."
      rationale: "This would bypass the client’s trust boundary."

escalation:
  triggers:
    - "POLICY_AMBIGUITY"
    - "MISSING_REQUIRED_CONTEXT"
    - "PRICING_MISMATCH"
    - "SOURCE_STATE_MISMATCH"
    - "DUPLICATE_SEND_ATTEMPT"
  behavior:
    - "STOP AND REQUEST HUMAN REVIEW"
    - "EMIT STRUCTURED REASON TO APPROVAL INBOX"
  escalation_owner: "RevOps Director"

guardrails:
  budget:
    max_tool_calls_per_run: 12
    max_duration_minutes: 20
  latency:
    soft_limit_ms: 10000
  data_handling:
    pii_allowed: true
    redact_before_output: true
  unsafe_defaults:
    - "NO SEND ACTION WITHOUT EXPLICIT APPROVAL"
    - "NO WRITE ACTION WHEN CRM, ORDER, AND BILLING STATE DO NOT MATCH"
    - "NO ACTION ON RECORDS WITH MISSING APPROVAL OWNER"

decision_rules:
  use_latest_source_of_truth: true
  require_human_review_on_write: true
  require_human_review_when_introspection_fails: true
  fallback_decision: "approval_required"

inputs_required:
  - "deal_id"
  - "order_id"
  - "current workflow state"
  - "approval owner"

outputs_expected:
  - "DECISION"
  - "RATIONALE"
  - "AUDIT_FIELDS"
  - "NEXT_ACTION"

manual_fallback:
  path: "Ops team reviews the mismatch in the shared inbox, corrects source systems manually, and sends the approved confirmation by hand."
  owner: "Ops lead"
  success_condition: "Confirmation is sent only after systems are aligned and the exception is resolved."

observability:
  traces_enabled: true
  evals_enabled: true
  providers:
    - name: "Braintrust"
      role: "observability_and_evals"
  required_audit_fields:
    - "decision"
    - "matched_policy_class"
    - "approver_id"
    - "order_id"
    - "correlation_id"

release_gates:
  pre_prod:
    - "Golden tasks pass for aligned-state approval flow"
    - "Golden tasks pass for mismatch escalation flow"
    - "Blocked actions tested successfully"
  production:
    - "RevOps Director signoff"
    - "Manual fallback confirmed with ops lead"
    - "Trace visibility confirmed for approval-required and blocked actions"

ownership:
  policy_owner: "RevOps Director"
  workflow_owner: "RevOps Director"
  technical_owner: "Engineering Manager"
