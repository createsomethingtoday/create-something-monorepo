version: "0.1"
artifact: "mcp_contract"
status: "example"

client:
  name: "ExampleCo"
  owner: "Jordan Lee"
  workflow_name: "quote_to_confirmation"
  workflow_owner: "RevOps Director"

scope:
  objective: "Prevent incorrect order confirmations and reduce manual reconciliation in the quote-to-confirmation workflow."
  workflow_boundary: "Starts when a quote is marked ready for confirmation and ends when the approved confirmation is sent and recorded."
  out_of_scope:
    - "Refund issuance"
    - "Customer record deletion"
    - "General CRM data cleanup outside the pilot workflow"

systems:
  source_systems:
    - name: "HubSpot"
      role: "database"
      notes: "Primary CRM state for quotes, contacts, and sales context."
    - name: "Internal Order Database"
      role: "database"
      notes: "Source of truth for order state, pricing approval, and confirmation readiness."
  connected_systems:
    - name: "Stripe"
      role: "integration"
      notes: "Billing state and pricing verification."
    - name: "Gmail"
      role: "integration"
      notes: "Confirmation send destination for approved communications."

resources:
  - uri: "hubspot://deals/{id}"
    name: "crm_deal"
    description: "Read the deal, contact, and workflow status associated with the confirmation candidate."
    source_system: "HubSpot"
    freshness_requirement: "near_realtime"
    access: "read"
    pii: true
  - uri: "orders://orders/{id}"
    name: "order_record"
    description: "Read the internal order state, approval flags, and pricing status."
    source_system: "Internal Order Database"
    freshness_requirement: "realtime"
    access: "read"
    pii: true
  - uri: "stripe://invoices/{id}"
    name: "billing_record"
    description: "Read invoice and billing state needed for pricing discrepancy checks."
    source_system: "Stripe"
    freshness_requirement: "near_realtime"
    access: "read"
    pii: true

tools:
  - name: "compare_order_state"
    description: "Compare HubSpot, internal order data, and Stripe billing state before confirmation."
    action_type: "read"
    systems_touched:
      - "HubSpot"
      - "Internal Order Database"
      - "Stripe"
    approval_mode: "auto_allow"
    auth_scopes:
      - "crm.objects.deals.read"
      - "orders.read"
      - "billing.read"
    input_schema_summary:
      required:
        - "deal_id"
        - "order_id"
      optional:
        - "invoice_id"
    output_contract:
      success_shape: "Returns normalized workflow state, mismatch flags, and recommended next action."
      error_shape: "Returns structured validation or source-state error with correlation id."
    idempotency_expectation: "Pure read operation."
    fallback_behavior: "Escalate to manual review if any required source is unavailable or stale."

  - name: "draft_confirmation_email"
    description: "Generate a draft customer confirmation based on approved state."
    action_type: "create"
    systems_touched:
      - "Gmail"
    approval_mode: "auto_allow"
    auth_scopes:
      - "gmail.compose"
    input_schema_summary:
      required:
        - "recipient_email"
        - "order_summary"
      optional:
        - "pricing_notes"
    output_contract:
      success_shape: "Returns draft id, preview text, and audit metadata."
      error_shape: "Returns draft failure reason and safe manual fallback recommendation."
    idempotency_expectation: "Creates at most one active draft per correlation id."
    fallback_behavior: "Allow ops to compose manually if draft creation fails."

  - name: "write_pricing_exception"
    description: "Create an exception record when pricing mismatch or approval discrepancy is detected."
    action_type: "create"
    systems_touched:
      - "Internal Order Database"
    approval_mode: "approval_required"
    auth_scopes:
      - "orders.write"
    input_schema_summary:
      required:
        - "order_id"
        - "exception_reason"
      optional:
        - "supporting_details"
    output_contract:
      success_shape: "Returns exception id and assigned review owner."
      error_shape: "Returns write failure and manual logging fallback."
    idempotency_expectation: "Upserts one open exception per order and exception type."
    fallback_behavior: "If write fails, route to ops inbox with structured exception payload."

  - name: "send_confirmation_email"
    description: "Send an approved confirmation email to the customer."
    action_type: "send"
    systems_touched:
      - "Gmail"
    approval_mode: "approval_required"
    auth_scopes:
      - "gmail.send"
    input_schema_summary:
      required:
        - "draft_id"
        - "approved_by"
      optional:
        - "approval_note"
    output_contract:
      success_shape: "Returns sent message id, timestamp, and audit fields."
      error_shape: "Returns send failure with manual-send instructions."
    idempotency_expectation: "Must reject duplicate send attempts for the same approved confirmation."
    fallback_behavior: "Human owner sends manually from shared inbox."

prompts:
  - name: "quote_to_confirmation_review"
    purpose: "Guide the agent to compare source state conservatively and escalate on mismatch."
    usage: "Selected for comparison, draft generation, and approval-routing within this workflow."

auth:
  identity_source: "CLIENT_OAUTH"
  account_model: "per_team"
  production_write_access: true
  auth_notes:
    - "Production send and write scopes require separate approval from client security review."
    - "Read scopes may be enabled before send scopes for staged rollout."

policy_integration:
  control_surface: "agent_contract.yaml"
  observability_surface:
    - "Langfuse"
  release_gate_dependency: "Golden tasks must prove correct mismatch handling, approval routing, and blocked destructive actions."

error_model:
  expected_failures:
    - "STALE_STATE"
    - "AUTH_EXPIRED"
    - "PRICING_MISMATCH"
    - "DUPLICATE_SEND_ATTEMPT"
  operator_visible_errors:
    - "Pricing discrepancy detected; approval required before send."
    - "Confirmation send blocked because source systems are not aligned."
  audit_fields:
    - "workflow_id"
    - "order_id"
    - "deal_id"
    - "tool_name"
    - "decision"
    - "correlation_id"

non_functional_requirements:
  latency_budget_ms: 7000
  retry_policy: "bounded_retry"
  logging_requirement: "All approval-required and blocked actions must emit structured audit events."
  data_retention_notes:
    - "Customer-facing text must exclude unnecessary billing detail."
    - "PII in logs must be redacted to the minimum fields needed for ops review."

acceptance:
  required_before_build:
    - "HubSpot, order database, Stripe, and Gmail access paths confirmed"
    - "Quote-to-confirmation workflow boundary approved by RevOps Director"
  required_before_production:
    - "Send and write auth scopes approved"
    - "Golden tasks pass for mismatch, send approval, and duplicate-send prevention"
    - "Manual fallback through ops inbox verified"
