version: "0.1"
artifact: "mcp_contract"
status: "draft"

client:
  name: "CLIENT_NAME"
  owner: "DECISION_OWNER"
  workflow_name: "PRIMARY_WORKFLOW_NAME"
  workflow_owner: "WORKFLOW_OWNER"

scope:
  objective: "WHAT BUSINESS OUTCOME THIS MCP SURFACE ENABLES"
  workflow_boundary: "START AND END OF THE PILOT WORKFLOW"
  out_of_scope:
    - "OUT_OF_SCOPE_ITEM"

systems:
  source_systems:
    - name: "SYSTEM_OF_RECORD"
      role: "database"
      notes: "PRIMARY STATE OR RECORD SOURCE"
  connected_systems:
    - name: "CONNECTED_APP"
      role: "integration"
      notes: "SECONDARY SYSTEM OR ACTION DESTINATION"

resources:
  - uri: "domain://entity/{id}"
    name: "RESOURCE_NAME"
    description: "WHAT THE AGENT CAN READ"
    source_system: "SYSTEM_OF_RECORD"
    freshness_requirement: "realtime|near_realtime|daily|manual"
    access: "read"
    pii: false

tools:
  - name: "tool_name"
    description: "WHAT THE TOOL DOES"
    action_type: "read|write|send|create|update|delete"
    systems_touched:
      - "SYSTEM_NAME"
    approval_mode: "auto_allow|approval_required|block"
    auth_scopes:
      - "oauth:scope"
    input_schema_summary:
      required:
        - "field_name"
      optional:
        - "optional_field_name"
    output_contract:
      success_shape: "BRIEF DESCRIPTION OF SUCCESS RESULT"
      error_shape: "BRIEF DESCRIPTION OF ERROR RESULT"
    idempotency_expectation: "HOW DUPLICATE CALLS ARE HANDLED"
    fallback_behavior: "WHAT HAPPENS IF TOOL EXECUTION FAILS"

prompts:
  - name: "prompt_name"
    purpose: "OPTIONAL MCP PROMPT OR SKILL SURFACE"
    usage: "WHEN THIS SHOULD BE SELECTED"

auth:
  identity_source: "AUTH0|CLIENT_OAUTH|SERVICE_ACCOUNT|OTHER"
  account_model: "shared|per_user|per_team"
  production_write_access: true
  auth_notes:
    - "AUTH OR ENTITLEMENT CONSTRAINT"

policy_integration:
  control_surface: "agent_contract.yaml"
  observability_surface:
    - "Braintrust"
  release_gate_dependency: "REFERENCE TO RELEASE GATES OR GOLDEN TASKS"

error_model:
  expected_failures:
    - "STALE_STATE"
    - "AUTH_EXPIRED"
    - "VALIDATION_FAILURE"
  operator_visible_errors:
    - "ERROR THE USER/OPERATOR SHOULD SEE"
  audit_fields:
    - "workflow_id"
    - "tool_name"
    - "decision"
    - "correlation_id"

non_functional_requirements:
  latency_budget_ms: 5000
  retry_policy: "none|bounded_retry|queue_retry"
  logging_requirement: "WHAT MUST BE LOGGED"
  data_retention_notes:
    - "RETENTION OR REDACTION REQUIREMENT"

acceptance:
  required_before_build:
    - "SYSTEM ACCESS CONFIRMED"
    - "WORKFLOW BOUNDARY APPROVED"
  required_before_production:
    - "AUTH SCOPES APPROVED"
    - "GOLDEN TASKS PASS"
    - "MANUAL FALLBACK VERIFIED"
