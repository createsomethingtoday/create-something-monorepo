version: "1.0"
contract_type: "mcp_contract"

metadata:
  client_name: "<client-name>"
  engagement_id: "<engagement-id>"
  package_name: "policy-os" # policy-os | mcp-only
  status: "draft" # draft | active | deprecated
  approved_workflows:
    - "<workflow-name>"
  approval_mode: "hybrid" # none | human-in-the-loop | hybrid
  escalation_policy: "<policy-id-or-runbook-section>"
  review_cadence: "weekly-review-monthly-tuning"
  billing_and_entitlement_assumptions:
    service_tier: "policy_os_trial" # mcp_only | policy_os_trial | policy_os_core
    monthly_recurring_revenue: "<amount>"
    gross_margin_floor_percent: 70
    owner_compensation_fit: "fits" # fits | watch | does_not_fit
    service_entitled: true
    policy_accepted: true
    contract_active: true
    billing_active: true
  operator_load_budget:
    max_live_review_meetings_per_month: 1
    async_review_frequency: "weekly"
    covered_workflow_count: 1
    covered_downstream_systems: 3
    monthly_policy_tuning_limit: "<limit>"
    expansion_triggers:
      - "new workflow"
      - "extra downstream system"
      - "custom UI"
      - "higher meeting cadence"
  owners:
    technical_owner: "<name>"
    client_owner: "<name>"
  codex_vector:
    primary_client: "codex"
    portability_target_clients:
      - "claude"
      - "cursor"

mcp_server:
  name: "<server-name>"
  version: "<semver>"
  transport: "sse" # sse | stdio | remote
  endpoints:
    production: "<https-endpoint>"
    staging: "<https-endpoint>"
  runtime:
    framework: "@create-something/mcp-core"
    hosting: "cloudflare-workers"

auth:
  strategy: "oauth" # oauth | api-key | service-account | mixed
  provider: "<provider-name>"
  scopes:
    required: []
    optional: []
  token_lifecycle:
    refresh_policy: "<policy>"
    revocation_policy: "<policy>"
  secrets:
    owner: "<team-or-person>"
    rotation_window_days: 90

resources:
  - id: "<resource-id>"
    uri: "<resource-uri>"
    schema_ref: "<schema-url-or-path>"
    data_classification: "internal" # public | internal | confidential | restricted
    freshness_sla_minutes: 15

tools:
  - name: "<tool-name>"
    description: "<what-it-does>"
    schema_ref: "<schema-url-or-path>"
    side_effect_level: "read" # read | write | destructive
    approval_required: "policy" # never | policy | always
    latency_budget_ms: 5000
    idempotent: true

prompts:
  - id: "<prompt-id>"
    purpose: "<why-this-prompt-exists>"
    owner: "<name>"
    version: "<prompt-version>"

error_model:
  retry_policy:
    max_retries: 2
    backoff_ms: 500
  codes:
    - code: "AUTH_EXPIRED"
      meaning: "Access token expired or revoked."
      user_action: "Reconnect account."
    - code: "SCOPE_MISSING"
      meaning: "Required OAuth scope is missing."
      user_action: "Grant required scope and retry."
    - code: "RATE_LIMITED"
      meaning: "Provider throttled requests."
      user_action: "Retry after cooldown."
    - code: "UPSTREAM_UNAVAILABLE"
      meaning: "Dependency is unavailable."
      user_action: "Use fallback/manual path."

handoff_bundle:
  required_artifacts:
    - "mcp_contract.yaml"
    - "agent_contract.yaml"
    - "outcome_contract.md"
    - "golden_tasks.yaml"
    - "runbook.md"
  operational_assets:
    - "endpoint inventory"
    - "auth scope matrix"
    - "tool/resource/prompt registry"
    - "incident + rollback runbook"
