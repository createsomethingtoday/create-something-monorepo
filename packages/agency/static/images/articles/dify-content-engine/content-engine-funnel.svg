<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dify content engine funnel</title>
  <desc id="desc">Original CREATE SOMETHING diagram showing canonical content feeding Substack, social, analytics, and lead routing.</desc>
  <rect width="1280" height="720" fill="#060607"/>
  <g stroke="#202127" stroke-width="1">
    <path d="M80 170h1120M80 290h1120M80 410h1120M80 530h1120M80 650h1120"/>
    <path d="M200 145v525M400 145v525M600 145v525M800 145v525M1000 145v525"/>
  </g>
  <text x="90" y="72" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Custom-domain content owns the funnel</text>
  <text x="90" y="110" fill="#a8a29e" font-family="Inter, Arial, sans-serif" font-size="18">Substack distributes. The website measures. The ledger decides what converts.</text>
  <g fill="none" stroke="#78716c" stroke-width="3" stroke-linecap="round">
    <path d="M320 395h180"/>
    <path d="M780 395h180"/>
    <path d="M640 270v30"/>
    <path d="M640 470v60"/>
  </g>
  <g>
    <rect x="500" y="300" width="280" height="170" rx="18" fill="#111114" stroke="#f5f5f4" stroke-opacity=".25"/>
    <text x="536" y="348" fill="#a8a29e" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">CANONICAL</text>
    <text x="536" y="389" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Agency article</text>
    <text x="536" y="425" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="18">Proof, disclosures, CTA,</text>
    <text x="536" y="451" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="18">analytics and lead routing.</text>
  </g>
  <g>
    <rect x="95" y="330" width="225" height="130" rx="16" fill="#111114" stroke="#60a5fa" stroke-opacity=".65"/>
    <text x="127" y="376" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">DISPATCH</text>
    <text x="127" y="414" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Substack</text>
    <text x="127" y="444" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="16">Short idea, one link back.</text>
  </g>
  <g>
    <rect x="505" y="150" width="270" height="120" rx="16" fill="#111114" stroke="#34d399" stroke-opacity=".65"/>
    <text x="537" y="193" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">DISCOVERY</text>
    <text x="537" y="229" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Social + video</text>
    <text x="537" y="255" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="16">Native snippets.</text>
  </g>
  <g>
    <rect x="960" y="330" width="225" height="130" rx="16" fill="#111114" stroke="#fbbf24" stroke-opacity=".75"/>
    <text x="992" y="376" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">MEASURE</text>
    <text x="992" y="414" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Tracker</text>
    <text x="992" y="444" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="16">Sessions, leads, revenue.</text>
  </g>
  <g>
    <rect x="510" y="530" width="260" height="110" rx="16" fill="#111114" stroke="#fb7185" stroke-opacity=".75"/>
    <text x="542" y="572" fill="#fda4af" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">ROUTE</text>
    <text x="542" y="608" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Lead split</text>
    <text x="542" y="633" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="16">Affiliate vs implementation.</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#d6d3d1">
    <rect x="95" y="635" width="125" height="38" rx="19" fill="#111114" stroke="#44403c"/>
    <text x="124" y="660">UTM</text>
    <rect x="235" y="635" width="150" height="38" rx="19" fill="#111114" stroke="#44403c"/>
    <text x="259" y="660">Disclosure</text>
    <rect x="400" y="635" width="142" height="38" rx="19" fill="#111114" stroke="#44403c"/>
    <text x="426" y="660">Source note</text>
  </g>
</svg>
