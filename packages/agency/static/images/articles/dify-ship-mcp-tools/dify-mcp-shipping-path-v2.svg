<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" style="max-width:100%;height:auto" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">The governed Dify shipping path</title>
  <desc id="svg-desc">A four-stage education diagram showing Dify as the surface, MCP as the boundary, Policy OS as the control, and a receipt as proof. A gate band and evidence rail make the release decision inspectable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#636363"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f9f9f9"/>
  <text id="diagram-title" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0a0e19">
    <tspan x="72" y="66">Ship one governed path.</tspan>
  </text>
  <text id="diagram-subtitle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#636363">
    <tspan x="72" y="106">Surface → boundary → control → proof</tspan>
  </text>
  <rect id="surface-card" x="72" y="140" width="246" height="210" rx="8" fill="#ffffff" stroke="#e1e1e1"/>
  <text id="surface-step" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0048ff">
    <tspan x="94" y="173">01 · SURFACE</tspan>
  </text>
  <text id="surface-title" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#0a0e19">
    <tspan x="94" y="223">Dify app</tspan>
  </text>
  <text id="surface-detail" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#636363">
    <tspan x="94" y="262">Captures the request</tspan>
    <tspan x="94" y="286">and visible response.</tspan>
  </text>
  <text id="surface-state" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0048ff">
    <tspan x="94" y="328">STATE · REQUESTED</tspan>
  </text>
  <line id="surface-to-boundary" x1="318" y1="245" x2="342" y2="245" stroke="#636363" stroke-width="2" marker-end="url(#arrow)"/>
  <rect id="boundary-card" x="342" y="140" width="246" height="210" rx="8" fill="#ffffff" stroke="#e1e1e1"/>
  <text id="boundary-step" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3c2c">
    <tspan x="364" y="173">02 · BOUNDARY</tspan>
  </text>
  <text id="boundary-title" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#0a0e19">
    <tspan x="364" y="223">MCP tools</tspan>
  </text>
  <text id="boundary-detail" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#636363">
    <tspan x="364" y="262">Limits capability to</tspan>
    <tspan x="364" y="286">named, allowed tools.</tspan>
  </text>
  <text id="boundary-state" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3c2c">
    <tspan x="364" y="328">STATE · SCOPED</tspan>
  </text>
  <line id="boundary-to-control" x1="588" y1="245" x2="612" y2="245" stroke="#636363" stroke-width="2" marker-end="url(#arrow)"/>
  <rect id="control-card" x="612" y="140" width="246" height="210" rx="8" fill="#ffffff" stroke="#e1e1e1"/>
  <text id="control-step" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3c2c">
    <tspan x="634" y="173">03 · CONTROL</tspan>
  </text>
  <text id="control-title" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#0a0e19">
    <tspan x="634" y="223">Policy OS</tspan>
  </text>
  <text id="control-detail" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#636363">
    <tspan x="634" y="262">Evaluates identity,</tspan>
    <tspan x="634" y="286">intent, and limits.</tspan>
  </text>
  <text id="control-state" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3c2c">
    <tspan x="634" y="328">STATE · ALLOWED</tspan>
  </text>
  <line id="control-to-proof" x1="858" y1="245" x2="882" y2="245" stroke="#636363" stroke-width="2" marker-end="url(#arrow)"/>
  <rect id="proof-card" x="882" y="140" width="246" height="210" rx="8" fill="#ffffff" stroke="#e1e1e1"/>
  <text id="proof-step" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0048ff">
    <tspan x="904" y="173">04 · PROOF</tspan>
  </text>
  <text id="proof-title" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#0a0e19">
    <tspan x="904" y="223">Receipt</tspan>
  </text>
  <text id="proof-detail" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#636363">
    <tspan x="904" y="262">Records the result,</tspan>
    <tspan x="904" y="286">owner, and evidence.</tspan>
  </text>
  <text id="proof-state" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0048ff">
    <tspan x="904" y="328">STATE · ATTESTED</tspan>
  </text>
  <rect id="gate-band" x="72" y="382" width="1056" height="78" rx="8" fill="#ffffff" stroke="#e1e1e1"/>
  <text id="gate-title" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0a0e19">
    <tspan x="96" y="410">RELEASE GATES</tspan>
  </text>
  <text id="gate-identity" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3c2c">
    <tspan x="300" y="438">✓ Identity</tspan>
  </text>
  <text id="gate-data" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3c2c">
    <tspan x="458" y="438">✓ Data</tspan>
  </text>
  <text id="gate-action" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3c2c">
    <tspan x="616" y="438">✓ Action</tspan>
  </text>
  <text id="gate-output" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3c2c">
    <tspan x="774" y="438">✓ Output</tspan>
  </text>
  <text id="gate-cost" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3c2c">
    <tspan x="932" y="438">✓ Cost</tspan>
  </text>
  <rect id="receipt-rail" x="72" y="492" width="1056" height="130" rx="8" fill="#ffffff" stroke="#e1e1e1"/>
  <text id="receipt-title" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0a0e19">
    <tspan x="96" y="521">PROOF RECEIPT</tspan>
  </text>
  <text id="receipt-meta" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#636363">
    <tspan x="330" y="521">Owner: Platform team  •  Decision: Allowed  •  Evidence: Recorded</tspan>
  </text>
  <text id="receipt-surface" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a0e19">
    <tspan x="96" y="581">Request accepted</tspan>
  </text>
  <text id="receipt-boundary" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a0e19">
    <tspan x="364" y="581">Tool executed</tspan>
  </text>
  <text id="receipt-control" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a0e19">
    <tspan x="632" y="581">Policy allowed</tspan>
  </text>
  <text id="receipt-proof" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0048ff">
    <tspan x="900" y="581">Evidence recorded</tspan>
  </text>
  <line id="receipt-surface-to-boundary" x1="286" y1="583" x2="350" y2="583" stroke="#636363" stroke-width="2" marker-end="url(#arrow)"/>
  <line id="receipt-boundary-to-control" x1="554" y1="583" x2="618" y2="583" stroke="#636363" stroke-width="2" marker-end="url(#arrow)"/>
  <line id="receipt-control-to-proof" x1="822" y1="583" x2="886" y2="583" stroke="#636363" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
