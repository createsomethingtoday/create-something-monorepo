<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dify n8n Cloudflare layer map</title>
  <desc id="desc">Original CREATE SOMETHING diagram comparing internal automation, runtime ownership, and agent app layers.</desc>
  <rect width="1280" height="720" fill="#060607"/>
  <text x="86" y="92" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">Pick the layer before picking the tool.</text>
  <text x="86" y="130" fill="#a8a29e" font-family="Inter, Arial, sans-serif" font-size="18">n8n, Cloudflare, and Dify are not interchangeable. Each owns a different operating surface.</text>
  <g transform="translate(110 205)">
    <rect width="1060" height="125" rx="20" fill="#111114" stroke="#60a5fa" stroke-opacity=".65"/>
    <text x="34" y="48" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">INTERNAL AUTOMATION</text>
    <text x="34" y="91" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">n8n</text>
    <text x="240" y="58" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="20">Triggers, syncs, notifications, and operator-owned workflow logic.</text>
    <text x="240" y="91" fill="#a8a29e" font-family="Inter, Arial, sans-serif" font-size="17">Best when the workflow is useful but not yet infrastructure.</text>
  </g>
  <g transform="translate(110 355)">
    <rect width="1060" height="125" rx="20" fill="#111114" stroke="#fbbf24" stroke-opacity=".75"/>
    <text x="34" y="48" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">RUNTIME OWNERSHIP</text>
    <text x="34" y="91" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Cloudflare</text>
    <text x="240" y="58" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="20">Auth, queues, state, endpoints, tenant boundaries, and recovery.</text>
    <text x="240" y="91" fill="#a8a29e" font-family="Inter, Arial, sans-serif" font-size="17">Best when the workflow needs production behavior and rollback.</text>
  </g>
  <g transform="translate(110 505)">
    <rect width="1060" height="125" rx="20" fill="#111114" stroke="#34d399" stroke-opacity=".75"/>
    <text x="34" y="48" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">AGENT SURFACE</text>
    <text x="34" y="91" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Dify</text>
    <text x="240" y="58" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="20">Client-facing app, MCP tools, eval proof, and usable agent access.</text>
    <text x="240" y="91" fill="#a8a29e" font-family="Inter, Arial, sans-serif" font-size="17">Best when a human needs a productized agent interface.</text>
  </g>
  <g fill="none" stroke="#44403c" stroke-width="3" stroke-linecap="round">
    <path d="M1010 330v25"/>
    <path d="M1010 480v25"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#d6d3d1">
    <rect x="895" y="155" width="275" height="38" rx="19" fill="#111114" stroke="#44403c"/>
    <text x="926" y="180">Decision is architectural, not tribal.</text>
  </g>
</svg>
