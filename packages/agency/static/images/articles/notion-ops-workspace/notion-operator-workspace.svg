<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Notion operator workspace map</title>
  <desc id="desc">Original CREATE SOMETHING diagram showing Notion as an operator layer connected to Linear, MCP fleet, Policy OS, and canonical systems.</desc>
  <rect width="1280" height="720" fill="#060607"/>
  <text x="84" y="92" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">Notion is the operator layer, not the whole source of truth.</text>
  <text x="84" y="130" fill="#a8a29e" font-family="Inter, Arial, sans-serif" font-size="18">The workspace makes work reviewable while canonical systems keep authority.</text>
  <g stroke="#292524" stroke-width="1" fill="none">
    <path d="M110 190h1060M110 590h1060"/>
    <path d="M110 190v400M1170 190v400"/>
  </g>
  <g>
    <rect x="470" y="250" width="340" height="220" rx="22" fill="#111114" stroke="#f5f5f4" stroke-opacity=".3"/>
    <text x="510" y="315" fill="#a8a29e" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">OPERATOR VIEW</text>
    <text x="510" y="365" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Notion</text>
    <text x="510" y="410" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="20">PM cockpit, evidence index,</text>
    <text x="510" y="442" fill="#d6d3d1" font-family="Inter, Arial, sans-serif" font-size="20">client-readable review layer.</text>
  </g>
  <g fill="none" stroke="#78716c" stroke-width="3" stroke-linecap="round">
    <path d="M470 332H310"/>
    <path d="M810 332h160"/>
    <path d="M530 470l-145 72"/>
    <path d="M750 470l145 72"/>
  </g>
  <g>
    <rect x="110" y="270" width="230" height="125" rx="18" fill="#111114" stroke="#60a5fa" stroke-opacity=".7"/>
    <text x="142" y="317" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2">TRACKED WORK</text>
    <text x="142" y="360" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Linear</text>
  </g>
  <g>
    <rect x="940" y="270" width="230" height="125" rx="18" fill="#111114" stroke="#34d399" stroke-opacity=".7"/>
    <text x="972" y="317" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2">TOOL ACCESS</text>
    <text x="972" y="360" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">MCP fleet</text>
  </g>
  <g>
    <rect x="205" y="505" width="260" height="125" rx="18" fill="#111114" stroke="#fbbf24" stroke-opacity=".75"/>
    <text x="237" y="552" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2">DECISION RULES</text>
    <text x="237" y="594" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Policy OS</text>
  </g>
  <g>
    <rect x="815" y="505" width="260" height="125" rx="18" fill="#111114" stroke="#fb7185" stroke-opacity=".75"/>
    <text x="847" y="552" fill="#fda4af" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2">AUTHORITY</text>
    <text x="847" y="594" fill="#f5f5f4" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Systems</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="17" fill="#d6d3d1">
    <rect x="418" y="168" width="445" height="42" rx="21" fill="#111114" stroke="#44403c"/>
    <text x="462" y="195">Readable state without leaking private records.</text>
  </g>
</svg>
