<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Product system map</title>
  <desc id="desc">A CREATE SOMETHING diagram showing Atlas connected to Signal, Decision, Proof, and a receipt rail.</desc>
  <rect width="1200" height="720" fill="#f7f7f7"/>
  <rect x="72" y="68" width="1056" height="584" rx="18" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
  <text x="112" y="128" fill="#0a0e19" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="650">One map. Three operating surfaces.</text>
  <text x="112" y="172" fill="#636363" font-family="Inter, Arial, sans-serif" font-size="22">Atlas shows where the work lives; Signal, Decision, and Proof keep it inspectable.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="426" y="238" width="348" height="166" rx="14" fill="#f8fbff" stroke="#b8c7ff"/>
    <text x="460" y="296" fill="#0a0e19" font-size="32" font-weight="650">Atlas</text>
    <text x="460" y="336" fill="#3553a6" font-size="20">Workflow map</text>
    <text x="460" y="366" fill="#3553a6" font-size="20">Systems, owners, approvals, stops.</text>
    <rect x="112" y="472" width="246" height="108" rx="12" fill="#f2f2f2" stroke="#cfcfcf"/>
    <text x="138" y="516" fill="#0a0e19" font-size="26" font-weight="650">Signal</text>
    <text x="138" y="548" fill="#636363" font-size="18">Source change enters queue.</text>
    <rect x="477" y="472" width="246" height="108" rx="12" fill="#fff9ec" stroke="#ead4a2"/>
    <text x="503" y="516" fill="#0a0e19" font-size="26" font-weight="650">Decision</text>
    <text x="503" y="548" fill="#806224" font-size="18">Judgment routes action.</text>
    <rect x="842" y="472" width="246" height="108" rx="12" fill="#eef5ef" stroke="#b8cbbb"/>
    <text x="868" y="516" fill="#0a0e19" font-size="26" font-weight="650">Proof</text>
    <text x="868" y="548" fill="#4e6f55" font-size="18">Receipt preserves state.</text>
    <path d="M515 416l-216 44" stroke="#2251ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M600 416v44" stroke="#2251ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M685 416l216 44" stroke="#2251ff" stroke-width="4" stroke-linecap="round"/>
    <rect x="176" y="246" width="136" height="44" rx="22" fill="#eef5ef"/>
    <text x="244" y="275" fill="#4e6f55" font-size="18" font-weight="650" text-anchor="middle">Run</text>
    <rect x="176" y="310" width="136" height="44" rx="22" fill="#fff9ec"/>
    <text x="244" y="339" fill="#806224" font-size="18" font-weight="650" text-anchor="middle">Wait</text>
    <rect x="888" y="246" width="136" height="44" rx="22" fill="#fff2f2"/>
    <text x="956" y="275" fill="#9b2c2c" font-size="18" font-weight="650" text-anchor="middle">Stop</text>
    <rect x="888" y="310" width="136" height="44" rx="22" fill="#0a0e19"/>
    <text x="956" y="339" fill="#ffffff" font-size="18" font-weight="650" text-anchor="middle">Receipt</text>
  </g>
</svg>
