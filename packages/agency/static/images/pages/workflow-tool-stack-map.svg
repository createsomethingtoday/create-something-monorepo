<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Workflow tool stack map</title>
  <desc id="desc">A CREATE SOMETHING map showing one workflow routed to app surface, runtime, workspace, reasoning, and proof receipt.</desc>
  <rect width="1200" height="720" fill="#f7f7f7"/>
  <rect x="72" y="68" width="1056" height="584" rx="18" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
  <text x="112" y="128" fill="#0a0e19" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="650">The workflow chooses the tool path.</text>
  <text x="112" y="172" fill="#636363" font-family="Inter, Arial, sans-serif" font-size="22">Start with one handoff, then assign each tool a narrow job and evidence requirement.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="112" y="302" width="190" height="116" rx="12" fill="#0a0e19"/>
    <text x="140" y="352" fill="#ffffff" font-size="26" font-weight="650">Workflow</text>
    <text x="140" y="386" fill="#d9d9d9" font-size="18">One real handoff</text>
    <rect x="398" y="226" width="214" height="88" rx="12" fill="#f8fbff" stroke="#b8c7ff"/>
    <text x="424" y="280" fill="#0a0e19" font-size="23" font-weight="650">Visible app</text>
    <rect x="398" y="354" width="214" height="88" rx="12" fill="#eef5ef" stroke="#b8cbbb"/>
    <text x="424" y="408" fill="#0a0e19" font-size="23" font-weight="650">Owned runtime</text>
    <rect x="668" y="226" width="214" height="88" rx="12" fill="#fff9ec" stroke="#ead4a2"/>
    <text x="694" y="280" fill="#0a0e19" font-size="23" font-weight="650">Workspace</text>
    <rect x="668" y="354" width="214" height="88" rx="12" fill="#f2f2f2" stroke="#cfcfcf"/>
    <text x="694" y="408" fill="#0a0e19" font-size="23" font-weight="650">Reasoning layer</text>
    <rect x="934" y="302" width="154" height="116" rx="12" fill="#f2f2f2" stroke="#cfcfcf"/>
    <text x="966" y="352" fill="#0a0e19" font-size="26" font-weight="650">Proof</text>
    <text x="966" y="386" fill="#636363" font-size="18">Receipt rail</text>
    <path d="M302 360h72M612 270h32M612 398h32M882 270h52M882 398h52" stroke="#2251ff" stroke-width="4" stroke-linecap="round"/>
    <rect x="232" y="526" width="736" height="54" rx="27" fill="#f8fbff" stroke="#b8c7ff"/>
    <text x="600" y="561" fill="#3553a6" font-size="20" font-weight="650" text-anchor="middle">Owner · stop point · next action · evidence</text>
  </g>
</svg>
