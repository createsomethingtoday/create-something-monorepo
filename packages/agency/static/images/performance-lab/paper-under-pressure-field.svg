<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Paper workflow field</title>
  <desc id="desc">A warm tactile paper field with a single folded edge behind the interactive workflow artifact.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#d7d7d2" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#f3f3f0"/>
  <rect width="1280" height="720" filter="url(#grain)" opacity=".32"/>
  <path d="M1006 0h274v274z" fill="url(#fold)"/>
  <path d="M1006 0 1280 274" fill="none" stroke="#a9aaa5" stroke-opacity=".28"/>
  <path d="M1118 0v112h162" fill="none" stroke="#a9aaa5" stroke-opacity=".14"/>
</svg>
