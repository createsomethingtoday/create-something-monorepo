<!DOCTYPE html>

<head>

<script src="assets/gsap.min.js"></script>
<style>
:root { --ink:#171715; --paper:#f3f3f0; --panel:#252522; --rule:#65655f; --signal:#89bfff; --boundary:#e1a778; --proof:#b3ddbd; }
* { box-sizing:border-box; } html,body { margin:0; width:100%; height:100%; background:var(--ink); color:var(--paper); }

text { fill:var(--paper); font-family:sans-serif; } .notation { font-family:monospace; font-size:26px; } .label { font-size:38px; font-weight:600; }
#packet { opacity:0; }
.route { fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; } .track { stroke:var(--rule); stroke-width:2; fill:none; } .signal { stroke:var(--signal); } .boundary { stroke:var(--boundary); } .proof { stroke:var(--proof); }
</style>
</head>
<body>
<div data-hf-id="hf-ireq" id="root" data-composition-id="dfw-support" data-start="0" data-width="960" data-height="720" data-duration="12">

<title data-hf-id="hf-gzh0" id="study-title">A scoped software recovery path</title><desc data-hf-id="hf-sgwp" id="study-description">A form handoff stops at a failure. An owner approves the scoped change. The repair reaches the CRM and leaves an acceptance receipt.</desc>

<text data-hf-id="hf-03hx" x="105" y="82" font-size="36" font-weight="700">CREATE SOMETHING</text>
<text data-hf-id="hf-h20u" x="48" y="175" font-size="44">A failed handoff. A clear owner.</text>

</div>
<script>
// The measured-stroke mechanism adapts Hyperframes svg-stroke-trace.
const tl = gsap.timeline({paused:true});
tl.set('#packet', {x:0,y:0}, 0);
for (const [id,start,duration] of [['read-route',0.6,1.6],['owner-route',2.6,1.2],['repair-route',5.1,1.7],['receipt-route',7.3,1.5]]) {
 const path=document.getElementById(id); const length=path.getTotalLength();
 tl.fromTo(path,{strokeDasharray:length,strokeDashoffset:length},{strokeDashoffset:0,duration,ease:'power2.out'},start);
}
tl.fromTo('#packet',{x:0,y:0,opacity:0},{opacity:1,duration:.35,ease:'power1.out'},.3);
tl.fromTo('#packet',{x:0,y:0},{x:275,y:0,duration:1.6,ease:'power2.inOut'},.6);
tl.fromTo('#packet',{x:275,y:0},{x:275,y:175,duration:1.2,ease:'power2.inOut',immediateRender:false},2.6);
tl.fromTo('#owner-node',{scale:1},{scale:1.08,transformOrigin:'50% 50%',duration:.4,yoyo:true,repeat:1,ease:'sine.inOut'},4);
tl.fromTo('#failure-mark',{opacity:1},{opacity:0,duration:.45,ease:'power1.out'},4.8);
tl.fromTo('#packet',{x:275,y:175},{x:275,y:0,duration:.6,ease:'power2.inOut',immediateRender:false},4.5);
tl.fromTo('#packet',{x:275,y:0},{x:560,y:0,duration:1.7,ease:'power2.inOut',immediateRender:false},5.1);
tl.fromTo('#packet',{x:560,y:0},{x:560,y:295,duration:1.5,ease:'power2.inOut',immediateRender:false},7.3);
tl.fromTo('#packet',{opacity:1},{opacity:0,duration:.3,ease:'power1.out'},8.8);
tl.fromTo('#receipt-node',{opacity:.4},{opacity:1,duration:.6,ease:'power1.out'},8.6);
// Hold the final receipt so the declared sequence lasts exactly 12 seconds.
tl.set('#packet',{opacity:0},12);
window.__timelines=window.__timelines||{};
window.__timelines['dfw-support']=tl;
</script>
