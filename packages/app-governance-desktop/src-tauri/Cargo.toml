[package]
name = "app-governance-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri operator shell for the app-governance surfaces (Phase 2)"
license = "UNLICENSED"
publish = false

# Standalone crate — the monorepo has no root cargo workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "time", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Disk is tight on this machine: keep debug artifacts minimal.
[profile.dev]
debug = 0
incremental = false
