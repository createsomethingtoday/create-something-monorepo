    "action": "Follow up with Grant. Resend the meeting URL or propose a specific time for a quick workflow audit conversation.",
    "channels": ["gmail", "ink"],
    "notion_url": "https://www.notion.so/30afa8740b15814ba487eb770c2911e8",
    "linear_issue": "CRE-189",
    "ttl_ms": 86400000
