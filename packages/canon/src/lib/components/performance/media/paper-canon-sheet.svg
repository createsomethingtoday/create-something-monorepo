<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Canon source sheet</title>
  <desc id="desc">A large folded paper standard with a measured spine, margin rules, and a registered source mark.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#090909" flood-opacity=".16"/>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7 .12" numOctaves="3" seed="17"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    </filter>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".68" stop-color="#f6f5ef"/>
      <stop offset="1" stop-color="#deded7"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecece5"/>
      <stop offset="1" stop-color="#c9c9c1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#f3f3f0"/>
  <path d="M0 190h1600M0 500h1600M0 810h1600M400 0v1000M800 0v1000M1200 0v1000" stroke="#090909" stroke-opacity=".045"/>
  <g filter="url(#shadow)">
    <path d="M870 118h520l118 118v646H870z" fill="url(#sheet)" stroke="#9c9c96" stroke-width="2"/>
    <path d="M1390 118v118h118" fill="url(#fold)" stroke="#9c9c96" stroke-width="2"/>
    <path d="M1012 118v764" stroke="#090909" stroke-opacity=".28" stroke-width="2"/>
    <path d="M1028 118v764" stroke="#fff" stroke-opacity=".75"/>
    <path d="M1092 304h264M1092 360h324M1092 416h286M1092 544h322M1092 600h250M1092 656h292" stroke="#090909" stroke-opacity=".28" stroke-width="3"/>
    <path d="M1092 742h198" stroke="#0057b8" stroke-width="8"/>
    <circle cx="1327" cy="741" r="46" fill="none" stroke="#090909" stroke-width="2"/>
    <path d="M1308 741h38M1327 722v38" stroke="#090909" stroke-width="2"/>
    <rect x="870" y="118" width="638" height="764" filter="url(#fiber)" opacity=".55"/>
  </g>
  <path d="M820 118h24v764h-24M786 118h58M786 882h58" fill="none" stroke="#0057b8" stroke-width="3"/>
  <circle cx="832" cy="500" r="8" fill="#0057b8"/>
