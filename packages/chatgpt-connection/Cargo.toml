[package]
name = "create-something-chatgpt-connection"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[dependencies]
base64 = "0.23"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
rand = "0.9"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
