# Check Asset Name Worker
# Template and library name validation + creator lookup APIs.
# Replaces check-asset-name.vercel.app with Cloudflare Workers.

name = "check-asset-name"
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[[routes]]
pattern = "check-asset-name.mcp.createsomething.agency"
custom_domain = true

[vars]
# Legacy asset defaults kept for backward compatibility.
AIRTABLE_BASE_ID = "appMoIgXMTTTNIc3p"
AIRTABLE_TABLE_ID = "tblRwzpWoLgE9MrUm"
AIRTABLE_VIEW_ID = "viwHnsM1aqC0UvxUG"
AIRTABLE_ASSETS_TABLE_ID = "tblRwzpWoLgE9MrUm"
AIRTABLE_ASSETS_VIEW_ID = "viwHnsM1aqC0UvxUG"
AIRTABLE_CREATORS_TABLE_ID = "tbljt0plqxdMARZXb"
# Optional Library intake overrides. Configure these before routing
# /api/checkLibraryuser traffic to this Worker in production.
# AIRTABLE_LIBRARY_USERS_TABLE_ID = ""
# AIRTABLE_LIBRARY_USERS_VIEW_ID = ""
# AIRTABLE_LIBRARY_USER_EMAIL_FIELDS = "fldFNavkQ2JJ6Kxt2"
# AIRTABLE_LIBRARY_PERMISSION_TABLE_ID = ""
# AIRTABLE_LIBRARY_PERMISSION_VIEW_ID = ""
# AIRTABLE_LIBRARY_PERMISSION_EMAIL_FIELDS = "fldhvneqrRuoF5grB"
# AIRTABLE_LIBRARY_PERMISSION_FIELD = "⚙️Can submit Libraries?"
# AIRTABLE_LIBRARY_PERMISSION_ALLOWED_VALUES = "1,true,yes,approved,allowed"
AIRTABLE_LIBRARY_ASSET_TYPE = "Library📚"
ALLOWED_ORIGINS = "https://wf-form-validation-with-airtable-databa.webflow.io,https://template-marketplace.webflow.io,https://template-marketplace.design.webflow.com,https://webflow.com,https://marketing-main.webflow.io,https://analyzer.mcp.createsomething.agency,https://webflow-site-analyzer-mcp.createsomething.workers.dev"

