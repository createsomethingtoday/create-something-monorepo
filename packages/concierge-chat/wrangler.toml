name = "abundance-concierge-chat"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".svelte-kit/cloudflare"

[vars]
ENVIRONMENT = "production"
ALLOW_AGENCY_ACCESS_PREVIEW = "false"
ABUNDANCE_REQUIRE_SIGNED_INTAKE = "true"
AGENCY_BASE_URL = "https://createsomething.agency"
ABUNDANCE_JOBS_MCP_URL = "https://abundance-jobs-mcp.createsomething.workers.dev/chatgpt/mcp"
# Set `ABUNDANCE_INTAKE_SIGNING_SECRET` and `RESEND_API_KEY` with `wrangler pages secret put`
# before enabling self-serve verification email in production.
# Set `INDEED_MCP_BASE_URL` and `INDEED_MCP_API_KEY` with `wrangler pages secret put`
# to enable terminal Indeed disposition writeback for linked imported applicants.
# Set `ABUNDANCE_GEO_MAPBOX_ACCESS_TOKEN` with `wrangler pages secret put` to enable
# external preferred-location recovery when the internal nurse-market catalog cannot normalize
# a nurse's location message confidently. Results are stored in-thread, so the runtime uses
# Mapbox permanent geocoding.
# Optionally set `ABUNDANCE_INTAKE_EMAIL_FROM` if the sender should differ from the runtime default.
# Set Dify Service API keys with `wrangler pages secret put` before enabling
# `/agents` production calls. Secret names must match the Dify inventory:
# DIFY_CREATE_SOMETHING_GUIDE_AGENT_API_KEY, DIFY_YOUTUBE_TRANSCRIPT_NOTION_AGENT_API_KEY,
# DIFY_BLONDISH_HUB_API_KEY, DIFY_MORGAN_HUB_API_KEY, DIFY_VIV_HUB_API_KEY,
# DIFY_C3_HUB_API_KEY, DIFY_AARON_HUB_API_KEY, DIFY_ABUNDANCE_HUB_API_KEY,
# DIFY_SHEA_HUB_API_KEY, DIFY_PABLO_HUB_API_KEY, DIFY_ERIC_HUB_API_KEY,
# DIFY_NATALIA_HUB_API_KEY, DIFY_MARIANA_HUB_API_KEY, DIFY_VICKI_HUB_API_KEY,
# and DIFY_TEMPLATE_REVIEW_HUB_API_KEY.

[[d1_databases]]
binding = "DB"
database_name = "abundance-concierge-chat-db"
database_id = "5712fa83-d823-46ba-805b-7b929d045423"

[[d1_databases]]
binding = "JOBS_DB"
database_name = "create-something-db"
database_id = "a74e70ae-6a94-43da-905e-b90719c8dfd2"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "abundance-concierge-chat-uploads"
