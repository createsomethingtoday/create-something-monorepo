name = "create-something-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

# Production URL: https://mcp.createsomething.ltd
[[routes]]
pattern = "mcp.createsomething.ltd"
custom_domain = true

# Durable Object for MCP session state
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "CreateSomethingMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CreateSomethingMCP"]

# Shared telemetry (fleet observability)
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"
migrations_dir = "migrations"
