name = "createsomething-gmail-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# CREATE SOMETHING account:
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

[observability]
enabled = true

# KV for storing Gmail refresh token (per authorized email).
# Create with: wrangler kv namespace create GMAIL_TOKENS
[[kv_namespaces]]
binding = "GMAIL_TOKENS"
id = "REPLACE_ME"

# Optional fleet telemetry (recommended)
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

# Secrets (set via `wrangler secret put`):
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# AUTHORIZED_EMAIL         — the single Gmail account this MCP serves (e.g. micah@createsomething.io)
# MCP_API_KEY              — required to call /mcp from ChatGPT (Authorization: Bearer ...)

