name = "cs-mcp-hub-remote"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

[observability]
enabled = true

[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

[[kv_namespaces]]
binding = "HUB_STATE_KV"
id = "f77e7c97087041d29fbf0d12e5a831ee"
preview_id = "6356c7663c334a4195243971e117565c"

[[services]]
binding = "IDENTITY_WORKER"
service = "identity-worker"

[vars]
# Discovery defaults (used when per-account discovery prefs are not persisted in KV)
HUB_DISCOVERY_MODE = "compact"
HUB_DISCOVERY_SHARED_PACK = "shared-auth-core"
# Identity resolution mode:
# - "session_required" (default): requires X-MCP-Session-Token + resolver config
# - "compat": keeps legacy header/bearer fallback identity behavior
# HUB_IDENTITY_MODE = "session_required"
# Optional Langfuse project name (falls back to "CREATE SOMETHING")
# LANGFUSE_PROJECT_NAME = "CREATE SOMETHING"
# Optional Langfuse public key; required with LANGFUSE_SECRET_KEY for trace export.
# LANGFUSE_PUBLIC_KEY = ""
# Optional explicit switch; set to "false" to disable Langfuse emission
# LANGFUSE_ENABLED = "true"
# Set secret at deploy-time:
# wrangler secret put LANGFUSE_SECRET_KEY
# wrangler secret put LANGFUSE_PUBLIC_KEY

# Optional. If set, /mcp requires Authorization: Bearer <token>
# HUB_API_TOKEN = ""

# Comma-separated or JSON array strings.
# Defaults to registry defaults when unset.
# HUB_ENABLED_BUNDLES = "core,observability"
# HUB_ENABLED_SERVERS = ""
# HUB_DISABLED_SERVERS = ""
# HUB_DISCOVERY_DEFAULT_SERVERS = "composio-toolkit-gmail,composio-toolkit-googledrive"
# HUB_DISCOVERY_MAX_PROXY_TOOLS = "200"
# HUB_ACCOUNT_ID = "operator"
# HUB_SESSION_RESOLVE_URL = "https://id.createsomething.space/v1/mcp/sessions/resolve"
# HUB_SESSION_RESOLVE_TOKEN = ""
# HUB_SESSION_RESOLVE_TIMEOUT_MS = "5000"
HUB_CONNECT_TIMEOUT_MS = "20000"
HUB_LIST_TOOLS_TIMEOUT_MS = "20000"
HUB_CONNECT_CONCURRENCY = "1"

# Runtime cache controls.
# HUB_REFRESH_SECONDS = "300"
# HUB_CACHE_BUST = ""
