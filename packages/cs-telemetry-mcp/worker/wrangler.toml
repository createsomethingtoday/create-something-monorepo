name = "cs-telemetry-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

[observability]
enabled = true

# Secret required at deploy time:
# - OPERATOR_API_TOKEN (for /mcp and /sse operator endpoints)
# Optional second operator token for hub/service access:
# - HUB_OPERATOR_API_TOKEN
# Optional secret for unified cross-account view:
# - WORKWAY_D1_API_TOKEN (Cloudflare API token with D1 read access to WORKWAY telemetry DB)

# Durable Object for MCP sessions
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "CSTelemetryMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CSTelemetryMCP"]

# Shared telemetry database (all CS-account MCPs write here)
[[d1_databases]]
binding = "DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

# Gateway control database for runtime-key tenant scoping in client SQL tools.
[[d1_databases]]
binding = "CONTROL_DB"
database_name = "cs-gateway"
database_id = "e6a63efe-8e86-41da-b6ed-e5aa85ba7443"

[vars]
# Optional WORKWAY source config for unified telemetry queries.
WORKWAY_ACCOUNT_ID = "5c3e9cf4d55ce171b844fad0931607f9"
WORKWAY_TELEMETRY_DB_ID = "4eb35a0f-6ee2-4d0c-8c0a-9a2ab4049b97"
BRAINTRUST_PROJECT_NAME = "cs-telemetry"
BRAINTRUST_ENABLED = "true"

# Optional secret:
# wrangler secret put BRAINTRUST_API_KEY
