# CREATE SOMETHING Herdr configuration
#
# Ghostty renders the terminal. Herdr owns AI-agent sessions and the
# scriptable control surface around those sessions.

onboarding = false

[theme]
name = "terminal"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+b"
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"

[ui]
sidebar_width = 28
sidebar_min_width = 18
sidebar_max_width = 40
sidebar_collapsed_mode = "compact"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = false

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = true
