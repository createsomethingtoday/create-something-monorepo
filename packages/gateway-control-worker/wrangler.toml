name = "gateway-control-worker"
main = "src/index.ts"
compatibility_date = "2026-02-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Bind cs-gateway config DB
[[d1_databases]]
binding = "DB"
database_name = "cs-gateway"
database_id = "REPLACE_WITH_DATABASE_ID"

# Bind shared telemetry DB
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "REPLACE_WITH_TELEMETRY_DATABASE_ID"

[vars]
DEFAULT_PROVIDER_SLUG = "openai"
PORTKEY_GATEWAY_URL = ""
MODEL_PRICING_JSON = "{\"gpt-4o\":{\"input\":0.005,\"output\":0.015},\"gpt-4.1\":{\"input\":0.01,\"output\":0.03},\"gpt-4.1-mini\":{\"input\":0.002,\"output\":0.008}}"
