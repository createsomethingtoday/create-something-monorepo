name = "gateway-control-worker"
main = "src/index.ts"
compatibility_date = "2026-02-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

[observability]
enabled = true

# Bind cs-gateway config DB
[[d1_databases]]
binding = "DB"
database_name = "cs-gateway"
database_id = "e6a63efe-8e86-41da-b6ed-e5aa85ba7443"

# Bind shared telemetry DB
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

[[services]]
binding = "PORTKEY_GATEWAY"
service = "portkey-gateway-worker"

[vars]
DEFAULT_PROVIDER_SLUG = "openai"
PORTKEY_GATEWAY_URL = "https://portkey-gateway-worker.createsomething.workers.dev"
MODEL_PRICING_JSON = "{\"gpt-4o\":{\"input\":0.005,\"output\":0.015},\"gpt-4.1\":{\"input\":0.01,\"output\":0.03},\"gpt-4.1-mini\":{\"input\":0.002,\"output\":0.008}}"
