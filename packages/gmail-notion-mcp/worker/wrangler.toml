name = "gmail-notion-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

# Optional: set account_id and routes for production
# account_id = "..."
# [[routes]]
# pattern = "gmail-notion.mcp.example.com"
# custom_domain = true

[observability]
enabled = true

# D1 for run metering (100 free runs, then 1¢/run). Create DB: wrangler d1 create gmail-notion-mcp-runs
[[d1_databases]]
binding = "RUNS_DB"
database_name = "gmail-notion-mcp-runs"
database_id = "6791208a-0fc4-4815-8965-6b6584c9af42"
migrations_dir = "migrations"

[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "GmailNotionMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GmailNotionMCP"]

# Secrets (set via wrangler secret put):
# COMPOSIO_API_KEY — required for Composio tools
# COMPOSIO_GMAIL_AUTH_CONFIG_ID — optional; for gmail_get_connect_link
# COMPOSIO_NOTION_AUTH_CONFIG_ID — optional; for notion_get_connect_link
