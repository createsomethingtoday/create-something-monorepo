name = "halfdozen-youtube-sync-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5c3e9cf4d55ce171b844fad0931607f9"  # WORKWAY

# Production URL: https://youtube.mcp.workway.co
[[routes]]
pattern = "youtube.mcp.workway.co"
custom_domain = true

# Durable Object for MCP sessions
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "YouTubeSyncMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["YouTubeSyncMCP"]

# Cron: daily playlist sync (6 AM UTC)
[triggers]
crons = ["0 6 * * *"]

# Shared feedback database (all Half Dozen MCPs)
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "halfdozen-feedback"
database_id = "4eb35a0f-6ee2-4d0c-8c0a-9a2ab4049b97"

# Secrets (set via `wrangler secret put`)
# NOTION_API_KEY
# NOTION_DATABASE_ID
# RESEND_API_KEY          (optional — email notifications)
# SYNC_PLAYLIST_URLS      (optional — comma-separated playlist URLs for cron)
# ALERT_EMAIL             (optional — defaults to micah@createsomething.io)

[vars]
# Non-sensitive config can go here
