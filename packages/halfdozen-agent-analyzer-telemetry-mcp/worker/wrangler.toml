name = "halfdozen-agent-analyzer-telemetry-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5c3e9cf4d55ce171b844fad0931607f9" # Half Dozen

[observability]
enabled = true

# Required secret:
# - MCP_API_KEY: bearer token configured on the Notion Custom Agent MCP connection.
# Optional operator fallback:
# - OPERATOR_API_TOKEN
# Optional Braintrust dual-write:
# - BRAINTRUST_API_KEY
# Optional Braintrust vars:
# - BRAINTRUST_PROJECT_NAME
# - BRAINTRUST_PROJECT_ID

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "AgentAnalyzerTelemetryMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentAnalyzerTelemetryMCP"]

[[d1_databases]]
binding = "DB"
database_name = "halfdozen-feedback"
database_id = "4eb35a0f-6ee2-4d0c-8c0a-9a2ab4049b97"
