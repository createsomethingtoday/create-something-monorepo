name = "halfdozen-dm-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5c3e9cf4d55ce171b844fad0931607f9"  # WORKWAY

# Production URL: https://dm.mcp.workway.co
[[routes]]
pattern = "dm.mcp.workway.co"
custom_domain = true

[observability]
enabled = true

# Durable Object for MCP sessions
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "HalfDozenDmMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HalfDozenDmMcp"]

# Shared feedback database (all Half Dozen MCPs)
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "halfdozen-feedback"
database_id = "4eb35a0f-6ee2-4d0c-8c0a-9a2ab4049b97"

[vars]
WORKSPACE_CLIENT_LABEL = "DM"
WORKSPACE_CLIENT_DESCRIPTION = "DM Notion workspace"
MCP_DISPLAY_NAME = "Half Dozen DM MCP"
MCP_DESCRIPTION = "Half Dozen DM MCP. Notion tools plus DM-namespaced Composio proxy tools."
ENABLED_TOOLSETS = "notion,composio"
COMPOSIO_ENTITY_ID = "dm"
COMPOSIO_PROXY_MODE = "allowlist"
COMPOSIO_ALLOWED_TOOLKITS = "googledrive,zoom,slack,quickbooks"
COMPOSIO_ALLOWED_TOOLKITS_BY_ENTITY = "{\"dm\":\"googledrive,zoom,slack,quickbooks\"}"
COMPOSIO_TOOL_NAME_PREFIX = "dm_composio"
COMPOSIO_TOOL_CACHE_SECONDS = "300"
# Keep empty in source; inject real mapping per environment (toolkit -> auth config id).
COMPOSIO_AUTH_CONFIG_MAP = "{}"

# Secrets (set via wrangler secret put)
# MCP_API_KEY — required for DM MCP transport auth (Bearer or X-API-Key)
# NOTION_API_KEY — DM client Notion workspace
# COMPOSIO_API_KEY — required for Composio proxy tools
