# BLOND:ISH × HD Client — Notion MCP instance (same code, different secrets/URL)
name = "blondish-notion-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"  # CREATE SOMETHING

# Production URL: https://blondish-notion.mcp.createsomething.agency
[[routes]]
pattern = "blondish-notion.mcp.createsomething.agency"
custom_domain = true

[observability]
enabled = true

[triggers]
crons = ["0 13 * * *"]

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "NotionHalfDozenMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotionHalfDozenMcp"]

[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "halfdozen-feedback"
database_id = "52da87a4-a926-4f59-b011-1e2b09575a0c"  # halfdozen-feedback on CREATE SOMETHING account

# Workspace labels: halfdozen = HD internal, client = BLOND:ISH
[vars]
WORKSPACE_HALFDOZEN_LABEL = "Half Dozen"
WORKSPACE_HALFDOZEN_DESCRIPTION = "Half Dozen internal — Meeting Capture, transcripts, training, etc."
WORKSPACE_CLIENT_LABEL = "BLOND:ISH"
WORKSPACE_CLIENT_DESCRIPTION = "BLOND:ISH Notion workspace"
MCP_DISPLAY_NAME = "Notion Half Dozen × BLOND:ISH"
MCP_DESCRIPTION = "Half Dozen internal and BLOND:ISH Notion. Full Notion tools; no Composio."
BLONDISH_TICKET_SYNC_ENABLED = "false"
BLONDISH_SUPPORT_TICKETS_DATA_SOURCE_ID = "fda87fb8-b156-820b-9542-8774717a42f6"
BLONDISH_HD_TICKETS_DATABASE_ID = "368019187ac58071a25af2bed93a8abb"
BLONDISH_HD_TICKETS_DATA_SOURCE_TITLE = "Tickets [HD]"
BLONDISH_DELIVERY_REVERSE_SYNC_ENABLED = "true"
BLONDISH_DELIVERY_REVERSE_SYNC_DRY_RUN = "false"
BLONDISH_DELIVERY_MIRROR_DATA_SOURCE_ID = "561b555e-b8d7-4516-b374-31a253f88c29"
BLONDISH_DELIVERY_MIRROR_DATA_SOURCE_TITLE = "BLOND:ISH Support Tickets [HD Delivery]"

# Secrets (set via wrangler secret put --config wrangler.blondish.toml)
# NOTION_API_KEY        — Half Dozen (used for workspace "halfdozen")
# NOTION_CLIENT_API_KEY — BLOND:ISH (used for workspace "client")
# NOTION_CREATE_SOMETHING_API_KEY — CREATE SOMETHING mirror database
# BLONDISH_TICKET_SYNC_WEBHOOK_SECRET — optional; falls back to MCP_BEARER_TOKEN
