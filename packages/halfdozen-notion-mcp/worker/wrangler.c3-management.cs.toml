# C3 Management × HD Client — Notion MCP instance (same code, different secrets/URL)
name = "c3-management-notion-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"  # CREATE SOMETHING

# Production URL: https://c3-management-notion.mcp.createsomething.agency
[[routes]]
pattern = "c3-management-notion.mcp.createsomething.agency"
custom_domain = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "NotionHalfDozenMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotionHalfDozenMcp"]

[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "halfdozen-feedback"
database_id = "TODO_CS_D1_UUID"  # TODO: create `halfdozen-feedback` D1 on CREATE SOMETHING account, paste ID here

# Workspace labels: halfdozen = HD internal, client = C3 Management
[vars]
WORKSPACE_HALFDOZEN_LABEL = "Half Dozen"
WORKSPACE_HALFDOZEN_DESCRIPTION = "Half Dozen internal — Meeting Capture, transcripts, training, etc."
WORKSPACE_CLIENT_LABEL = "C3 Management"
WORKSPACE_CLIENT_DESCRIPTION = "C3 Management Notion workspace"
MCP_DISPLAY_NAME = "Notion Half Dozen × C3 Management"
MCP_DESCRIPTION = "Half Dozen internal and C3 Management Notion. Full Notion tools; no Composio."

# Secrets (set via wrangler secret put --config wrangler.c3-management.toml)
# NOTION_API_KEY        — Half Dozen (used for workspace "halfdozen")
# NOTION_CLIENT_API_KEY — C3 Management (used for workspace "client")

