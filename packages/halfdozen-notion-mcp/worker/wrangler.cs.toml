name = "halfdozen-notion-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"  # CREATE SOMETHING

# Production URL: https://createsomething-notion.mcp.createsomething.agency
[[routes]]
pattern = "createsomething-notion.mcp.createsomething.agency"
custom_domain = true

[observability]
enabled = true

# Durable Object for MCP sessions
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "NotionHalfDozenMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotionHalfDozenMcp"]

# Shared feedback database (all Half Dozen MCPs)
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "halfdozen-feedback"
database_id = "TODO_CS_D1_UUID"  # TODO: create `halfdozen-feedback` D1 on CREATE SOMETHING account, paste ID here

[vars]
BRAINTRUST_PROJECT_NAME = "HALF DOZEN"

# Secrets (set via wrangler secret put)
# NOTION_API_KEY       — Half Dozen internal workspace (Meeting Capture, transcripts)
# NOTION_CLIENT_API_KEY — Client workspace
