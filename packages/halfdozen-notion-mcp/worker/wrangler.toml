name = "halfdozen-notion-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5c3e9cf4d55ce171b844fad0931607f9"  # WORKWAY

# Production URL: https://createsomething-notion.mcp.workway.co
[[routes]]
pattern = "createsomething-notion.mcp.workway.co"
custom_domain = true

[observability]
enabled = true

# Durable Object for MCP sessions
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "NotionHalfDozenMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotionHalfDozenMcp"]

# Shared feedback database (all Half Dozen MCPs)
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "halfdozen-feedback"
database_id = "4eb35a0f-6ee2-4d0c-8c0a-9a2ab4049b97"

[vars]
LANGFUSE_PROJECT_NAME = "HALF DOZEN"

# Secrets (set via wrangler secret put)
# NOTION_API_KEY       — Half Dozen internal workspace (Meeting Capture, transcripts)
# NOTION_CLIENT_API_KEY — Client workspace
