name = "halfdozen-operator-notion-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

[observability]
enabled = true

[vars]
PARTNER_KEY = "half-dozen"
PARTNER_CLIENT_SLUG = "blondish"
MCP_DISPLAY_NAME = "Half Dozen Operator Notion MCP"
MCP_DESCRIPTION = "Operator-managed Notion accounts via Composio with pinned workspace tools, deterministic sync contracts, and Codex automation-friendly run primitives."
LANGFUSE_PROJECT_NAME = "CREATE SOMETHING"
COMPOSIO_NOTION_AUTH_CONFIG_ID = "ac_1fYSxzK38XeT"
PINNED_HALFDOZEN_TOOL_NAME = "halfdozen_notion"
PINNED_CLIENT_TOOL_NAME = "blondish_notion"
ROUTER_OPENAI_MODEL = "gpt-5.5"
ROUTER_OPENAI_TIMEOUT_MS = "3000"
ROUTER_OPENAI_CACHE_TTL_MS = "120000"

[[d1_databases]]
binding = "CONFIG_DB"
database_name = "create-something-db"
database_id = "a74e70ae-6a94-43da-905e-b90719c8dfd2"

[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "OperatorNotionMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OperatorNotionMcp"]

# Secrets set via vault / wrangler secret put:
# COMPOSIO_API_KEY
# COMPOSIO_NOTION_AUTH_CONFIG_ID
# MCP_API_KEY
# OPENAI_API_KEY
# LANGFUSE_SECRET_KEY
# LANGFUSE_PUBLIC_KEY
