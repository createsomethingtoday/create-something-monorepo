name = "halfdozen-telemetry-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5c3e9cf4d55ce171b844fad0931607f9"  # WORKWAY

# TODO: Set up custom domain telemetry.mcp.workway.co once DNS is configured
# [[routes]]
# pattern = "telemetry.mcp.workway.co"
# custom_domain = true

[observability]
enabled = true

# Durable Object for MCP sessions
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "TelemetryMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TelemetryMCP"]

# Shared telemetry + feedback database (all Half Dozen MCPs write here)
[[d1_databases]]
binding = "DB"
database_name = "halfdozen-feedback"
database_id = "4eb35a0f-6ee2-4d0c-8c0a-9a2ab4049b97"

[vars]
BRAINTRUST_PROJECT_NAME = "halfdozen-telemetry"
BRAINTRUST_ENABLED = "true"

# Optional secret:
# wrangler secret put BRAINTRUST_API_KEY
