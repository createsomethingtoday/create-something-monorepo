name = "halfdozen-zoom-transcript-sync"
main = "src/index.ts"
compatibility_date = "2026-03-10"
compatibility_flags = ["nodejs_compat"]
account_id = "5c3e9cf4d55ce171b844fad0931607f9"
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "halfdozen-zoom-transcript-sync"
database_id = "685613a0-05da-4d0c-a932-579d51db7fb8"

[[queues.producers]]
queue = "halfdozen-zoom-transcript-sync"
binding = "SYNC_QUEUE"

[[queues.consumers]]
queue = "halfdozen-zoom-transcript-sync"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "halfdozen-zoom-transcript-sync-dlq"

[triggers]
crons = ["0 * * * *"]

[vars]
NOTION_DATABASE_ID = "27a01918-7ac5-80b7-97fe-c563c98afbbc"
NOTION_WRITE_MODE = "hub"
NOTION_HUB_URL = "https://danny.mcp.createsomething.agency/mcp"
NOTION_HUB_PROXY_TOOL = "halfdozen-operator-notion-mcp__halfdozen_notion"
NOTION_DEFAULT_STATUS = "Active"
NOTION_DEFAULT_SOURCE = "Zoom"
NOTION_DEFAULT_TYPE = "Meeting"
ZOOM_LOOKBACK_DAYS = "14"
ZOOM_PAGE_SIZE = "100"

# Secrets / vars to configure before deploy:
# SYNC_API_KEY
# ZOOM_ACCESS_TOKEN
# or: ZOOM_CLIENT_ID / ZOOM_CLIENT_SECRET / ZOOM_ACCOUNT_ID
# or: ZOOM_CLIENT_ID / ZOOM_CLIENT_SECRET / ZOOM_REFRESH_TOKEN / ZOOM_REDIRECT_URI
# Optional per-user override for non-account discovery:
# ZOOM_USER_ID
# NOTION_DATABASE_ID
# For direct Notion writes:
# NOTION_API_KEY
# For Hub-backed Notion writes:
# NOTION_HUB_URL
# NOTION_HUB_API_TOKEN
# NOTION_HUB_PROXY_TOOL
# Optional governance metadata set as a secret if needed:
# NOTION_RUNTIME_CONNECTION_REF
