<svg width="1520" height="900" viewBox="0 0 1520 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1520" height="900" rx="28" fill="#0D0F12"/>
  <rect x="36" y="36" width="1448" height="828" rx="24" stroke="#2B3138" stroke-width="2"/>

  <text x="80" y="102" fill="#F3F4F6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="36" font-weight="700">Execution Path: Where Policy Enters</text>
  <text x="80" y="140" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">The Hub becomes a control plane when it decides before downstream execution.</text>

  <rect x="70" y="230" width="190" height="140" rx="22" fill="#151A20" stroke="#4B5563" stroke-width="2"/>
  <text x="106" y="278" fill="#F9FAFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">Actor context</text>
  <text x="106" y="312" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">account</text>
  <text x="106" y="334" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">tenant</text>
  <text x="106" y="356" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">session / prefixes</text>

  <rect x="300" y="230" width="190" height="140" rx="22" fill="#151A20" stroke="#4B5563" stroke-width="2"/>
  <text x="326" y="278" fill="#F9FAFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">Classify route</text>
  <text x="326" y="312" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">read</text>
  <text x="326" y="334" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">write</text>
  <text x="326" y="356" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">destructive or admin</text>

  <rect x="530" y="230" width="190" height="140" rx="22" fill="#151A20" stroke="#D1D5DB" stroke-width="2.5"/>
  <text x="546" y="278" fill="#F9FAFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">Authorize</text>
  <text x="546" y="312" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">policy artifacts</text>
  <text x="546" y="334" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">service tier</text>
  <text x="546" y="356" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">review semantics</text>

  <rect x="760" y="230" width="190" height="140" rx="22" fill="#151A20" stroke="#4B5563" stroke-width="2"/>
  <text x="766" y="278" fill="#F9FAFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">Rate / quota</text>
  <text x="766" y="312" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">budget posture</text>
  <text x="766" y="334" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">window limits</text>
  <text x="766" y="356" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">deny or continue</text>

  <rect x="990" y="230" width="190" height="140" rx="22" fill="#151A20" stroke="#4B5563" stroke-width="2"/>
  <text x="1016" y="278" fill="#F9FAFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">Execute</text>
  <text x="1016" y="312" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">normalized headers</text>
  <text x="1016" y="334" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">provider call</text>
  <text x="1016" y="356" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">normalized error</text>
  <text x="1016" y="378" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">shape</text>

  <rect x="1220" y="230" width="170" height="140" rx="22" fill="#151A20" stroke="#4B5563" stroke-width="2"/>
  <text x="1248" y="278" fill="#F9FAFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">Trace</text>
  <text x="1248" y="312" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">correlation</text>
  <text x="1248" y="334" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">route log</text>
  <text x="1248" y="356" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">lookup</text>

  <line x1="260" y1="300" x2="300" y2="300" stroke="#6B7280" stroke-width="3"/>
  <polygon points="300,300 287,292 287,308" fill="#6B7280"/>
  <line x1="490" y1="300" x2="530" y2="300" stroke="#6B7280" stroke-width="3"/>
  <polygon points="530,300 517,292 517,308" fill="#6B7280"/>
  <line x1="720" y1="300" x2="760" y2="300" stroke="#6B7280" stroke-width="3"/>
  <polygon points="760,300 747,292 747,308" fill="#6B7280"/>
  <line x1="950" y1="300" x2="990" y2="300" stroke="#6B7280" stroke-width="3"/>
  <polygon points="990,300 977,292 977,308" fill="#6B7280"/>
  <line x1="1180" y1="300" x2="1220" y2="300" stroke="#6B7280" stroke-width="3"/>
  <polygon points="1220,300 1207,292 1207,308" fill="#6B7280"/>

  <rect x="110" y="500" width="1300" height="210" rx="26" fill="#12161B" stroke="#2B3138" stroke-width="2"/>
  <text x="156" y="520" fill="#F3F4F6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">Decision outputs before downstream call</text>

  <rect x="146" y="570" width="330" height="82" rx="16" fill="#0D0F12" stroke="#39414B"/>
  <text x="174" y="604" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">allow</text>
  <text x="174" y="630" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">route may run</text>

  <rect x="595" y="570" width="370" height="82" rx="16" fill="#0D0F12" stroke="#39414B"/>
  <text x="623" y="604" fill="#FCD34D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">require_human_review</text>
  <text x="623" y="630" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">stop and surface for review</text>

  <rect x="1084" y="570" width="300" height="82" rx="16" fill="#0D0F12" stroke="#39414B"/>
  <text x="1112" y="604" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">block</text>
  <text x="1112" y="630" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">deny before invoke</text>

  <text x="120" y="780" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">The Hub becomes more than a gateway when policy decisions are made here,</text>
  <text x="120" y="804" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">not pushed into connector-specific behavior after the fact.</text>
</svg>
