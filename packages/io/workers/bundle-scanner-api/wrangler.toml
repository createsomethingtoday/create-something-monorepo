# Bundle Scanner API Worker
# Auto-scans Webflow Marketplace submissions for security/policy compliance
#
# Canon: Security scanning recedes into infrastructure.
# Every submission is scanned; reviewers see results, not process.

name = "bundle-scanner-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Custom domain: uncomment to bind on the next `wrangler deploy`.
# The createsomething.io zone must be active in the same Cloudflare account.
# routes = [{ pattern = "scanner-api.createsomething.io/*", zone_name = "createsomething.io" }]

[vars]
ENVIRONMENT = "production"
# Allowed origins for CORS
ALLOWED_ORIGINS = "https://wf.createsomething.io,https://wf-asset-dashboard.vercel.app,https://webflow.com"

# Secrets — set before deploying (see .dev.vars.example for local dev):
#   wrangler secret put SCAN_WEBHOOK_SECRET   # required; POST /scan fails closed without it in production
#   wrangler secret put AIRTABLE_API_KEY      # optional; write scan results back to submission records
