<!-- Featured Templates Category Filter with Analytics Integration -->
<!-- Add this to your Webflow Featured Templates page's custom code (before </body> tag) -->

<!-- Load Category Filter Analytics First -->
<script src="https://landing-page-category-filter.vercel.app/category-filter-analytics.min.js"></script>

<!-- Load Custom Nest Script -->
<script src="https://landing-page-category-filter.vercel.app/custom-nest.min.js"></script>

<!-- Load Featured Templates Category Filter Script -->
<script src="https://landing-page-category-filter.vercel.app/category-filter-featured.min.js"></script>

<!-- Load SEO Enhancements Script -->
<script src="https://landing-page-category-filter.vercel.app/seo-enhancements.min.js"></script>

<!-- Additional Analytics Configuration -->
<script>
    // Page-specific analytics initialization
    wf_analytics.init({
        pageView: {
            name: "Featured Template Category Filter Viewed",
            data: {
                page_type: "featured_template_category_listing",
                filter_available: true,
                total_categories: 25, // Update based on actual count
                has_subcategories: true,
            },
        },
        page: "Featured Website Templates - Category Filter",
    });

    // Track template card clicks
    document.addEventListener("click", function (event) {
        var target = event.target.closest(".tm-templates_grid_item");
        if (target) {
            var templateName =
                target
                    .querySelector("h3, .template-title")
                    ?.textContent?.trim() || "Unknown Template";
            var templateLink = target.querySelector("a")?.href || "";

            wf_analytics.track("Featured Template Filter - Template Card Clicked", {
                template_name: templateName,
                template_url: templateLink,
                current_category:
                    CategoryFilterAnalytics.getContext().current_category,
                current_subcategory:
                    CategoryFilterAnalytics.getContext().current_subcategory,
                filter_active:
                    !!CategoryFilterAnalytics.getContext().current_category,
                template_type: "featured"
            });
        }
    });

    // Track filter combination usage
    document.addEventListener("categoryFilterUpdated", function (event) {
        var context = CategoryFilterAnalytics.getContext();

        if (context.current_category && context.current_subcategory) {
            wf_analytics.track(
                "Featured Template Filter - Advanced Filter Combination",
                {
                    combination:
                        context.current_category +
                        " > " +
                        context.current_subcategory,
                    template_type: "featured"
                },
            );
        }
    });

    // Featured Template specific analytics
    document.addEventListener("categoryFilterUpdated", function (event) {
        var context = CategoryFilterAnalytics.getContext();
        
        if (context.current_category) {
            wf_analytics.track("Featured Template Filter - Category Selected", {
                category: context.current_category,
                has_subcategory: !!context.current_subcategory,
                template_type: "featured"
            });
        }
    });

    console.log(
        "🚀 Featured Templates Category Filter with Analytics loaded successfully",
    );
</script>
