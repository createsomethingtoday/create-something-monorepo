<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Handoff receipt</title>
  <desc id="desc">A receipt-style proof artifact listing claim, validation, owner, refresh date, and next action.</desc>
  <rect width="1200" height="720" fill="#f7f7f7"/>
  <rect x="270" y="68" width="660" height="584" rx="18" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
  <text x="318" y="136" fill="#0a0e19" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="650">Image handoff receipt</text>
  <text x="318" y="178" fill="#636363" font-family="Inter, Arial, sans-serif" font-size="21">Ship the visual with its operating context.</text>
  <g font-family="Inter, Arial, sans-serif">
    <line x1="318" y1="220" x2="882" y2="220" stroke="#d9d9d9"/>
    <text x="318" y="270" fill="#636363" font-size="18" font-weight="650">CLAIM</text>
    <text x="318" y="302" fill="#0a0e19" font-size="24">The workflow is mapped and safe to review.</text>
    <text x="318" y="360" fill="#636363" font-size="18" font-weight="650">VALIDATION</text>
    <text x="318" y="392" fill="#0a0e19" font-size="24">Lesson route checked, asset legible at 50%.</text>
    <text x="318" y="450" fill="#636363" font-size="18" font-weight="650">OWNER</text>
    <text x="318" y="482" fill="#0a0e19" font-size="24">Operator or workflow lead.</text>
    <text x="318" y="540" fill="#636363" font-size="18" font-weight="650">NEXT ACTION</text>
    <text x="318" y="572" fill="#0a0e19" font-size="24">Use the image to brief Codex or the team.</text>
  </g>
  <rect x="742" y="116" width="116" height="38" rx="19" fill="#eef5ef"/>
  <text x="800" y="141" fill="#4e6f55" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="middle">READY</text>
</svg>
