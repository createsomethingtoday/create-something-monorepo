<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Database Automation Judgment lanes</title>
  <desc id="desc">Three horizontal lanes labeled Database, Automation, and Judgment with example artifacts for an operator workflow.</desc>
  <rect width="1200" height="720" fill="#f7f7f7"/>
  <text x="72" y="96" fill="#0a0e19" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="650">Map the work before automating it.</text>
  <text x="72" y="140" fill="#636363" font-family="Inter, Arial, sans-serif" font-size="22">Canon images make Database, Automation, and Judgment visible as separate lanes.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="72" y="205" width="1056" height="120" rx="14" fill="#ffffff" stroke="#d9d9d9"/>
    <rect x="92" y="225" width="190" height="80" rx="8" fill="#f2f2f2"/>
    <text x="122" y="273" fill="#0a0e19" font-size="26" font-weight="650">Database</text>
    <text x="330" y="257" fill="#636363" font-size="20">Business data, source records, API responses, saved files</text>
    <text x="330" y="289" fill="#0a0e19" font-size="18">Question: is the data correct and available?</text>
    <rect x="72" y="350" width="1056" height="120" rx="14" fill="#ffffff" stroke="#d9d9d9"/>
    <rect x="92" y="370" width="190" height="80" rx="8" fill="#eef5ef"/>
    <text x="118" y="418" fill="#0a0e19" font-size="26" font-weight="650">Automation</text>
    <text x="330" y="402" fill="#636363" font-size="20">MCP tools, scripts, workers, integration calls, retries</text>
    <text x="330" y="434" fill="#0a0e19" font-size="18">Question: did the execution path succeed?</text>
    <rect x="72" y="495" width="1056" height="120" rx="14" fill="#ffffff" stroke="#d9d9d9"/>
    <rect x="92" y="515" width="190" height="80" rx="8" fill="#fff2f2"/>
    <text x="126" y="563" fill="#0a0e19" font-size="26" font-weight="650">Judgment</text>
    <text x="330" y="547" fill="#636363" font-size="20">Policy, approval rule, stop condition, confidence, owner</text>
    <text x="330" y="579" fill="#0a0e19" font-size="18">Question: was the right policy applied?</text>
  </g>
</svg>
