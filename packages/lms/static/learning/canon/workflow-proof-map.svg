<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Workflow proof map</title>
  <desc id="desc">A CREATE SOMETHING learning diagram showing a workflow object moving through decision state, proof, owner, and next action.</desc>
  <rect width="1200" height="720" fill="#f7f7f7"/>
  <rect x="72" y="72" width="1056" height="576" rx="18" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
  <text x="112" y="132" fill="#0a0e19" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="650">Every image must prove the work.</text>
  <text x="112" y="176" fill="#636363" font-family="Inter, Arial, sans-serif" font-size="22">If the visual cannot answer one operational question, it is decoration.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="112" y="260" width="210" height="150" rx="10" fill="#f2f2f2" stroke="#cfcfcf"/>
    <text x="138" y="315" fill="#0a0e19" font-size="24" font-weight="650">Object</text>
    <text x="138" y="352" fill="#636363" font-size="18">What workflow,</text>
    <text x="138" y="378" fill="#636363" font-size="18">system, or asset?</text>
    <path d="M332 335H412" stroke="#2251ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M400 322l18 13-18 13" fill="none" stroke="#2251ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="422" y="260" width="210" height="150" rx="10" fill="#eef5ef" stroke="#b8cbbb"/>
    <text x="448" y="315" fill="#0a0e19" font-size="24" font-weight="650">State</text>
    <text x="448" y="352" fill="#4e6f55" font-size="18">Run, review,</text>
    <text x="448" y="378" fill="#4e6f55" font-size="18">stop, or escalate?</text>
    <path d="M642 335H722" stroke="#2251ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M710 322l18 13-18 13" fill="none" stroke="#2251ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="732" y="260" width="210" height="150" rx="10" fill="#f8fbff" stroke="#b8c7ff"/>
    <text x="758" y="315" fill="#0a0e19" font-size="24" font-weight="650">Proof</text>
    <text x="758" y="352" fill="#3553a6" font-size="18">Receipt, eval,</text>
    <text x="758" y="378" fill="#3553a6" font-size="18">screenshot, trace.</text>
    <path d="M942 335H1022" stroke="#2251ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M1010 322l18 13-18 13" fill="none" stroke="#2251ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1032" y="260" width="64" height="150" rx="10" fill="#0a0e19"/>
    <text x="1065" y="325" fill="#ffffff" font-size="18" font-weight="650" text-anchor="middle" transform="rotate(90 1065 325)">Owner</text>
  </g>
  <rect x="112" y="488" width="984" height="82" rx="10" fill="#0a0e19"/>
  <text x="144" y="538" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650">Next action:</text>
  <text x="292" y="538" fill="#d9d9d9" font-family="Inter, Arial, sans-serif" font-size="22">Name what the operator should do after reading the image.</text>
</svg>
