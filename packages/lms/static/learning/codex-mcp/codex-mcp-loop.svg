<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Codex app MCP learning loop</title>
  <desc id="desc">Operator starts in the Codex app, uses the MCP-building skill, creates a local MCP server, and returns evidence to Codex.</desc>
  <rect width="960" height="540" fill="#f7f5ef"/>
  <rect x="56" y="52" width="848" height="436" rx="16" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="96" y="102" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Learn Codex by creating one MCP capability</text>
  <text x="96" y="132" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">The Codex app is the operator surface. The terminal supports files, builds, and logs.</text>

  <g font-family="Arial, sans-serif">
    <rect x="92" y="190" width="150" height="96" rx="10" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
    <text x="167" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Operator</text>
    <text x="167" y="252" text-anchor="middle" font-size="14" fill="#374151">business question</text>

    <rect x="294" y="180" width="170" height="116" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <text x="379" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Codex app</text>
    <text x="379" y="242" text-anchor="middle" font-size="14" fill="#374151">MCP-building skill</text>
    <text x="379" y="265" text-anchor="middle" font-size="14" fill="#374151">plans the contract</text>

    <rect x="516" y="180" width="170" height="116" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="601" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Local package</text>
    <text x="601" y="242" text-anchor="middle" font-size="14" fill="#374151">TypeScript server</text>
    <text x="601" y="265" text-anchor="middle" font-size="14" fill="#374151">stdio transport</text>

    <rect x="738" y="190" width="130" height="96" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="803" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Evidence</text>
    <text x="803" y="252" text-anchor="middle" font-size="14" fill="#374151">structured result</text>

    <path d="M246 238 H286" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M468 238 H508" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M690 238 H730" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M804 302 C790 378 204 378 168 302" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <rect x="120" y="410" width="720" height="38" rx="8" fill="#111827"/>
  <text x="480" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Done means Codex can call the tool, inspect the data, and explain the next operator action.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
</svg>
