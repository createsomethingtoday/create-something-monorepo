<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 940" role="img" aria-labelledby="title desc">
  <title id="title">Minimal local MCP server skeleton for mobile</title>
  <desc id="desc">A vertical mobile diagram showing the package files, McpServer, stdio transport, and Codex discovery without overlapping arrows or tiny labels.</desc>
  <rect width="640" height="940" fill="#f5f7fb"/>
  <rect x="40" y="36" width="560" height="868" rx="18" fill="#ffffff" stroke="#1f2933" stroke-width="3"/>

  <text x="80" y="94" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Smallest useful</text>
  <text x="80" y="134" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">MCP shell</text>
  <text x="80" y="172" font-family="Inter, Arial, sans-serif" font-size="21" fill="#4b5563">Create only the files needed to prove</text>
  <text x="80" y="200" font-family="Inter, Arial, sans-serif" font-size="21" fill="#4b5563">the server can start cleanly.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="244" width="480" height="210" rx="14" fill="#f9fafb" stroke="#6b7280" stroke-width="3"/>
    <text x="118" y="294" font-size="24" font-weight="700" fill="#111827">packages/codex-demo-mcp</text>
    <text x="120" y="334" font-size="21" fill="#374151">package.json</text>
    <text x="120" y="366" font-size="21" fill="#374151">tsconfig.json</text>
    <text x="120" y="398" font-size="21" fill="#374151">src/index.ts</text>
    <rect x="116" y="418" width="250" height="30" rx="7" fill="#e5e7eb"/>
    <text x="241" y="439" text-anchor="middle" font-size="15" font-weight="650" fill="#111827">no business tool yet</text>

    <path d="M320 472 V520" stroke="#111827" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="148" y="536" width="344" height="104" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-width="3"/>
    <text x="320" y="582" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">McpServer</text>
    <text x="320" y="614" text-anchor="middle" font-size="19" fill="#374151">name + version</text>

    <path d="M320 654 V702" stroke="#111827" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="148" y="718" width="344" height="104" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="320" y="764" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Stdio transport</text>
    <text x="320" y="796" text-anchor="middle" font-size="19" fill="#374151">protocol on stdout</text>

    <path d="M506 770 C570 740 572 560 536 526" fill="none" stroke="#111827" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="426" y="468" width="108" height="92" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="480" y="506" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Codex</text>
    <text x="480" y="535" text-anchor="middle" font-size="17" fill="#374151">discovers</text>
  </g>

  <rect x="80" y="838" width="480" height="46" rx="10" fill="#111827"/>
  <text x="320" y="867" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff">Diagnostics go to stderr. stdout is protocol.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
</svg>
