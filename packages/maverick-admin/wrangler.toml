# Maverick X Admin App
# Cloudflare Pages configuration

name = "maverick-admin"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database - shared with maverick package
[[d1_databases]]
binding = "DB"
database_name = "maverick-x-db"
database_id = "2554c248-8ceb-4ee2-8a4d-965b39eb5f53"

# R2 Bucket for media - shared with maverick package
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "maverick-x-assets"

# KV for sessions - shared with maverick package
[[kv_namespaces]]
binding = "SESSIONS"
id = "07177a78d36b406191b9655492a40cef"

# Environment variables (set via dashboard)
# AUTH_SECRET - Session signing key
# ADMIN_EMAIL - Admin login email
# ADMIN_PASSWORD_HASH - Bcrypt hash of admin password
