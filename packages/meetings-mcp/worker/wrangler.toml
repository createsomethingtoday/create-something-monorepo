name = "meetings-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

[observability]
enabled = true

[vars]
BRAINTRUST_PROJECT_NAME = "meetings"
BRAINTRUST_ENABLED = "true"

# Secret required in production:
# - MCP_API_KEY
# - BRAINTRUST_API_KEY (optional; enables Braintrust telemetry export)

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "MeetingsMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MeetingsMCP"]

[[d1_databases]]
binding = "DB"
database_name = "meetings"
database_id = "8b88dd4c-8454-478a-b86b-42f31e12e076"
