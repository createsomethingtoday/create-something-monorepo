name = "ona-agent-chat"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".svelte-kit/cloudflare"

[vars]
ENVIRONMENT = "production"
IDENTITY_API_URL = "https://id.createsomething.space"
CS_IDENTITY_ISSUER = "https://id.createsomething.space"
CS_IDENTITY_JWKS_URL = "https://id.createsomething.space/.well-known/jwks.json"
CS_IDENTITY_AUDIENCE = "ona-agents"
CS_AUTH_SIGN_IN_URL = "/sign-in"
CS_AUTH_ALLOWED_EMAIL_DOMAINS = "createsomething.io"
ALLOW_CS_AUTH_PREVIEW = "false"
CS_AUTH_ALLOW_ANY_AUTHENTICATED = "false"

# Production operator access preserves the approved staff-domain policy. If a
# narrower subject/email rule replaces it later, promote that as a separate
# reviewed policy change.
# Other supported allow rules:
#   CS_AUTH_ALLOWED_SUBJECTS, CS_AUTH_ALLOWED_EMAILS,
#   CS_AUTH_ALLOWED_TENANT_IDS,
#   CS_AUTH_ALLOWED_ROLES, or CS_AUTH_ALLOW_ANY_AUTHENTICATED=true.
