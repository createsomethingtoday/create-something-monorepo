name = "ona-agent-chat"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".svelte-kit/cloudflare"

[vars]
ENVIRONMENT = "production"
ALLOW_CLERK_ACCESS_PREVIEW = "false"
CLERK_ALLOW_ANY_AUTHENTICATED = "false"
CLERK_SIGN_IN_URL = "https://createsomething.agency/sign-in"

# Required before production operator access:
# - CLERK_JWKS_URL or CLERK_ISSUER
# - one or more allow rules:
#   CLERK_ALLOWED_ORGANIZATION_IDS, CLERK_ALLOWED_ORGANIZATION_ROLES,
#   CLERK_ALLOWED_EMAILS, CLERK_ALLOWED_EMAIL_DOMAINS, or
#   CLERK_ALLOW_ANY_AUTHENTICATED=true for a private Clerk instance.
#
# Dify Service API keys remain server-side Pages secrets:
# DIFY_TEMPLATE_REVIEW_HUB_API_KEY, DIFY_ERIC_HUB_API_KEY, DIFY_NATALIA_HUB_API_KEY,
# DIFY_MARIANA_HUB_API_KEY, DIFY_VICKI_HUB_API_KEY, DIFY_PABLO_HUB_API_KEY,
# DIFY_SHEA_HUB_API_KEY, DIFY_ABUNDANCE_HUB_API_KEY,
# DIFY_CREATE_SOMETHING_GUIDE_AGENT_API_KEY,
# DIFY_YOUTUBE_TRANSCRIPT_NOTION_AGENT_API_KEY, DIFY_BLONDISH_HUB_API_KEY,
# DIFY_MORGAN_HUB_API_KEY, DIFY_VIV_HUB_API_KEY, DIFY_C3_HUB_API_KEY,
# DIFY_AARON_HUB_API_KEY.
