name = "playbook-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

# Production URL: https://playbook.mcp.createsomething.ltd
[[routes]]
pattern = "playbook.mcp.createsomething.ltd"
custom_domain = true

# Durable Object for MCP session state
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "PlaybookMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlaybookMCP"]

# Shared telemetry (fleet observability)
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

[vars]
# Optional override for the fleet watchdog telemetry MCP endpoint.
# HALFDOZEN_TELEMETRY_MCP_URL = "https://halfdozen-telemetry-mcp.half-dozen.workers.dev/mcp"

# Required secrets for protected Half Dozen agent route:
# wrangler secret put OPENAI_API_KEY
# wrangler secret put HALFDOZEN_AGENT_ROUTE_TOKEN
