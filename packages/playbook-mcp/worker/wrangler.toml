name = "playbook-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

# Production URL: https://playbook.mcp.createsomething.ltd
[[routes]]
pattern = "playbook.mcp.createsomething.ltd"
custom_domain = true

# Durable Object for MCP session state
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "PlaybookMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlaybookMCP"]

[triggers]
crons = ["0 4,13,18,23 * * *"]

# Shared telemetry (fleet observability)
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

[vars]
# Optional MCP endpoint overrides for Half Dozen scenario routes.
# HALFDOZEN_TELEMETRY_MCP_URL = "https://halfdozen-telemetry-mcp.half-dozen.workers.dev/mcp"
# HALFDOZEN_GMAIL_MCP_URL = "https://gmail.mcp.workway.co/mcp"
# HALFDOZEN_NOTION_MCP_URL = "https://createsomething-notion.mcp.workway.co/mcp"

# Langfuse tracing defaults (override per environment in the Cloudflare dashboard).
# Tracing is enabled automatically when `LANGFUSE_SECRET_KEY` is present; `LANGFUSE_ENABLED`
# provides an explicit on/off switch.
LANGFUSE_PROJECT_NAME = "CREATE SOMETHING"
LANGFUSE_ENABLED = "true"
INK_BRIDGE_ORIGIN = "https://ink.createsomething.agency"
HALFDOZEN_FLEET_WATCHDOG_CRON_ENABLED = "true"
HALFDOZEN_FLEET_WATCHDOG_CRON_UTC_HOURS = "4,13,18,23"
HALFDOZEN_AGENT_NOTIFY_EMAIL_FROM = "CREATE SOMETHING Ops <notifications@createsomething.io>"
HALFDOZEN_AGENT_NOTIFY_EMAIL_TO = "micah@createsomething.io"
HALFDOZEN_AGENT_NOTIFY_EMAIL_MODE = "alerts"
MCP_REGISTRY_SWEEP_HUB_HEALTH_URL = "https://cs-mcp-hub-remote.createsomething.workers.dev/health"
MCP_REGISTRY_SWEEP_TIMEOUT_MS = "60000"
MCP_REGISTRY_SWEEP_CRON_ENABLED = "true"
MCP_REGISTRY_SWEEP_CRON_UTC_HOURS = "4,13,18,23"

# Required secrets for protected Half Dozen agent routes:
# wrangler secret put OPENAI_API_KEY
# wrangler secret put HALFDOZEN_AGENT_ROUTE_TOKEN
# wrangler secret put RESEND_API_KEY
# wrangler secret put LANGFUSE_ALERT_WEBHOOK_SECRET
# wrangler secret put INK_BRIDGE_TOKEN

# Optional Langfuse tracing:
# wrangler secret put LANGFUSE_SECRET_KEY
# (Optional) wrangler secret put LANGFUSE_PUBLIC_KEY
# (Optional) set [vars] LANGFUSE_PROJECT_NAME = "Playbook MCP"

# Optional Ink bridge target:
# wrangler secret put INK_SOURCE_TOKEN

# Slack command ingress protection:
# wrangler secret put HALFDOZEN_SLACK_SIGNING_SECRET
# Optional workspace restriction:
# wrangler secret put HALFDOZEN_SLACK_TEAM_ID
