<!doctype html>
<html lang="en" data-render-state="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CREATE SOMETHING Render Lab</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #030404;
        color: #d8d3c6;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: #030404; }
      body { overflow-x: hidden; }
      main { position: relative; min-height: 100svh; isolation: isolate; overflow: hidden; }
      .stage { position: absolute; inset: 0; margin: 0; background: #030404; }
      .stage canvas, .fallback {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .stage canvas { z-index: 2; opacity: 0; transition: opacity 260ms ease; }
      .fallback { z-index: 1; opacity: 1; transition: opacity 260ms ease; }
      [data-render-state="ready"] .stage canvas { opacity: 1; }
      [data-render-state="ready"] .fallback { opacity: 0; }
      [data-render-state="fallback"] .stage canvas,
      [data-render-state="error"] .stage canvas { opacity: 0; }
      [data-render-state="fallback"] .fallback,
      [data-render-state="error"] .fallback { opacity: 1; }
      .veil {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(3,4,4,.98) 0%, rgba(3,4,4,.93) 27%, rgba(3,4,4,.34) 49%, rgba(3,4,4,.02) 76%),
          linear-gradient(180deg, rgba(3,4,4,.06), rgba(3,4,4,.38));
      }
      .content {
        position: relative;
        z-index: 4;
        display: grid;
        align-content: space-between;
        min-height: 100svh;
        width: min(41rem, 47vw);
        padding: clamp(1.25rem, 3vw, 3.5rem);
        pointer-events: none;
      }
      .eyebrow, .status, .receipt {
        font: 600 .68rem/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .eyebrow { margin: 0 0 1.5rem; color: #3e7fe6; }
      h1 { margin: 0; max-width: 11ch; font-size: clamp(2.7rem, 6vw, 6.8rem); font-weight: 460; line-height: .89; letter-spacing: -.065em; }
      .lede { max-width: 35rem; margin: 1.6rem 0 0; color: rgba(216,211,198,.68); font-size: clamp(.95rem, 1.25vw, 1.15rem); line-height: 1.55; }
      .receipt {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        width: min(34rem, 100%);
        background: rgba(216,211,198,.16);
        border: 1px solid rgba(216,211,198,.16);
        pointer-events: auto;
      }
      .receipt > div { min-width: 0; padding: .9rem; background: rgba(3,4,4,.82); }
      .receipt dt { margin: 0 0 .4rem; color: rgba(216,211,198,.42); }
      .receipt dd { margin: 0; overflow: hidden; color: #d8d3c6; text-overflow: ellipsis; white-space: nowrap; }
      .status { position: absolute; z-index: 5; right: 1rem; bottom: 1rem; color: rgba(216,211,198,.58); }
      [data-render-state="ready"] .status { color: #4fbd7b; }
      [data-render-state="fallback"] .status,
      [data-render-state="error"] .status { color: #d8d3c6; }
      @media (max-width: 700px) {
        main { display: grid; grid-template-rows: minmax(20rem, 46svh) minmax(22rem, 54svh); }
        .stage { position: relative; grid-row: 2; min-height: 54svh; }
        .veil { background: linear-gradient(180deg, #030404 0%, rgba(3,4,4,.95) 42%, rgba(3,4,4,.12) 72%, rgba(3,4,4,.25) 100%); }
        .content { position: absolute; inset: 0 0 auto; min-height: 46svh; width: 100%; padding: 1.25rem; }
        h1 { max-width: 10ch; font-size: clamp(2.7rem, 14vw, 4rem); }
        .lede { margin-top: 1rem; font-size: .9rem; }
        .receipt { grid-template-columns: 1fr 1fr 1fr; }
        .receipt > div { padding: .65rem; }
        .status { bottom: .75rem; right: .75rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage canvas, .fallback { transition: none; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <figure class="stage" aria-label="Deterministic macro rendering of a controlled basketball court field">
        <img class="fallback" id="render-fallback" src="/fallback.svg" alt="Static fallback: a cobalt control structure over an onyx field" />
      </figure>
      <div class="veil" aria-hidden="true"></div>
      <section class="content" aria-labelledby="render-title">
        <div>
          <p class="eyebrow">Render Lab / deterministic field 01</p>
          <h1 id="render-title">One controlled field. Every frame receipted.</h1>
          <p class="lede">A licensed source becomes an owned shot recipe: provenance in, optimized geometry through, responsive evidence out.</p>
        </div>
        <dl class="receipt" aria-label="Render receipt summary">
          <div><dt>Recipe</dt><dd id="receipt-recipe">Pending</dd></div>
          <div><dt>Backend</dt><dd id="receipt-backend">Pending</dd></div>
          <div><dt>Budget</dt><dd id="receipt-budget">Pending</dd></div>
        </dl>
      </section>
      <div class="status" id="runtime-status" role="status" aria-live="polite">Loading asset</div>
    </main>
    <script id="render-receipt-json" type="application/json">{"state":"loading"}</script>
    <script type="module" src="/scene.js"></script>
  </body>
</html>
