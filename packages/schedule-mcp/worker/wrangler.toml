name = "schedule-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

# Production URL: https://schedule.mcp.createsomething.agency
[[routes]]
pattern = "schedule.mcp.createsomething.agency"
custom_domain = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "schedule-mcp-db"
database_id = "79f21c22-94e8-4a6e-85fe-baae307c5364"

# Shared telemetry (fleet observability)
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "ScheduleMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduleMCP"]
