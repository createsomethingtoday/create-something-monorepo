name = "three-tier-framework-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

# Production URL: https://framework.mcp.createsomething.agency
[[routes]]
pattern = "framework.mcp.createsomething.agency"
custom_domain = true

# Durable Object for MCP session state
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "ThreeTierFrameworkMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ThreeTierFrameworkMCP"]

# Shared telemetry (fleet observability)
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"
