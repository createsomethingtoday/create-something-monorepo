name = "webflow-app-review-mcp"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

[observability]
enabled = true

# Optional default; can also be set as Worker secret/var.
[vars]
AIRTABLE_BASE_ID = "appMoIgXMTTTNIc3p"
AIRTABLE_GOVERNANCE_BASE_ID = "app1Q0o9xw2Zny7gw"
AIRTABLE_GOVERNANCE_FINDINGS_TABLE_ID = "tblIH1LQ8H3b2piNi"
OAUTH_ALLOWED_EMAIL_DOMAIN = "webflow.com"
OAUTH_ALLOWED_EMAILS = "pablo.miranda@webflow.com,shea.sisco@webflow.com,micah@webflow.com,micah@createsomething.io"
CF_ACCESS_TEAM_DOMAIN = "https://webflow.cloudflareaccess.com"
# Set this to the dedicated App Review Access application audience only after
# the Webflow Cloud hostname and Access application have been provisioned.
CF_ACCESS_AUD = ""

[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "cs-telemetry"
database_id = "f710641a-0c85-4a7b-bb73-2c16f8d024c3"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "WebflowAppReviewMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebflowAppReviewMCP"]
