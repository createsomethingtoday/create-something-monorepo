name = "webflow-docs-index"
main = "src/index.ts"
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"
# No public route for search: other Workers call the `search` RPC method through
# a service binding. The workers.dev URL serves /health and the key-gated
# /admin and /search routes (secret DOCS_INDEX_ADMIN_TOKEN; unset = 503).
workers_dev = true

[observability]
enabled = true

# Hourly: check the 50 pages that were checked longest ago (about one full pass
# of the docs per day). Daily: read the llms.txt tree for new and removed pages.
[triggers]
crons = ["23 * * * *", "7 9 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "webflow-docs-index"
# Set after `wrangler d1 create webflow-docs-index` (see README, First deploy).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[vectorize]]
binding = "VECTORIZE"
index_name = "webflow-docs"

[ai]
binding = "AI"

[vars]
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
