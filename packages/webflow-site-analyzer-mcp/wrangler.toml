# Webflow Site Analyzer MCP — Cloudflare Worker
# Uses nodejs_compat for Steel SDK + puppeteer-core WebSocket connections.

name = "webflow-site-analyzer-mcp"
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"
main = "src/worker.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Standard pricing — long-running requests supported via streaming.
# If CPU time limits are hit, switch to Workers Unbound via dashboard.

[[durable_objects.bindings]]
name = "TEMPLATE_REVIEW_JOBS"
class_name = "TemplateReviewJobDurableObject"

[[migrations]]
tag = "v1_template_review_jobs"
new_sqlite_classes = ["TemplateReviewJobDurableObject"]

[observability]
enabled = true

# Custom domain: analyzer.mcp.createsomething.agency
[[routes]]
pattern = "analyzer.mcp.createsomething.agency"
custom_domain = true

[vars]
ENVIRONMENT = "production"
CLOUDFLARE_ACCOUNT_ID = "9645bd52e640b8a4f40a3a55ff1dd75a"
BROWSER_RUN_ENABLED = "true"

# Secrets (set via `wrangler secret put`):
# - CLOUDFLARE_BROWSER_RUN_API_TOKEN (Browser Rendering - Edit only)
# - STEEL_API_KEY
# - WEBFLOW_SITE_ANALYZER_MCP_API_KEY
# - WEBFLOW_GROQ_API_KEY (preferred for URL classifier — fast + cheap)
# - WEBFLOW_OPENAI_API_KEY (fallback for URL classifier)
# - LANGFUSE_SECRET_KEY (optional, for observability)
