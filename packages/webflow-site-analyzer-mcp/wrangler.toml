# Webflow Site Analyzer MCP — Cloudflare Worker
# Uses nodejs_compat for Steel SDK + puppeteer-core WebSocket connections.

name = "webflow-site-analyzer-mcp"
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat_v2"]
workers_dev = true

# Standard pricing — long-running requests supported via streaming.
# If CPU time limits are hit, switch to Workers Unbound via dashboard.

[observability]
enabled = true

# The production MCP route is now served by packages/webflow-site-analyzer-mcp/workers/remote.
# Keep this worker on workers.dev only so future deploys do not steal analyzer.mcp.createsomething.agency.

[vars]
ENVIRONMENT = "production"

# Secrets (set via `wrangler secret put`):
# - STEEL_API_KEY
# - WEBFLOW_SITE_ANALYZER_MCP_API_KEY
# - WEBFLOW_GROQ_API_KEY (preferred for URL classifier — fast + cheap)
# - WEBFLOW_OPENAI_API_KEY (fallback for URL classifier)
# - BRAINTRUST_API_KEY (optional, for observability)
