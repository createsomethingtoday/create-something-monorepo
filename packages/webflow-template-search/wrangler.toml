name = "webflow-template-search"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
account_id = "9645bd52e640b8a4f40a3a55ff1dd75a"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "webflow-template-search"
database_id = "bffab674-a86b-456b-a72d-f620b2755396"

[vars]
ENVIRONMENT = "development"
AIRTABLE_BASE_ID = "appMoIgXMTTTNIc3p"
AIRTABLE_ASSETS_TABLE_ID = "tblRwzpWoLgE9MrUm"
AIRTABLE_STYLES_TABLE_ID = "tblG7E9LbQj0sBX0o"
AIRTABLE_CHILD_CATEGORIES_TABLE_ID = "tblWJXy3M6R8SeoFi"
AIRTABLE_TAGS_TABLE_ID = "tblb4969G7O75gVWV"
ALLOWED_ORIGINS = "https://webflow.com,https://www.webflow.com,https://templates.webflow.com,https://template-marketplace.webflow.io"
DEFAULT_PAGE_SIZE = "24"
DEFAULT_CLIENT_MODE = "shadow"
WEBFLOW_TEMPLATES_COLLECTION_ID = "641b464e78789f611a5d4496"
WEBFLOW_IMAGE_SYNC_MAX_ITEMS = "500"

[triggers]
crons = ["*/5 * * * *", "37 * * * *", "17 3 * * *"]

# Secrets:
# - AIRTABLE_API_KEY
# - SYNC_ADMIN_TOKEN
# - CMS_READ_ONLY
