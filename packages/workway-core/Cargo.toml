[package]
name = "workway-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic project-state and professional-review kernel for WorkWay"
license = "MIT"
repository = "https://github.com/createsomethingtoday/create-something-monorepo"
keywords = ["workway", "architecture", "deterministic", "validation"]

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
