[package]
name = "workway-edge"
version = "0.1.0"
edition = "2021"
description = "Local-only encrypted evidence intake boundary for WorkWay Edge"
license = "MIT"
repository = "https://github.com/createsomethingtoday/create-something-monorepo"
keywords = ["workway", "evidence", "local-first", "encryption"]

[dependencies]
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
workway-core = { path = "../workway-core" }

[dev-dependencies]
tempfile = "3"
