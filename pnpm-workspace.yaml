packages:
  - 'apps/*'
  - 'packages/*'
  - '!packages/loom'
  - '!packages/loom/npm'
  - '!packages/loom-mcp-remote'
  - 'packages/agents/*'
  - 'packages/*/clients/*'
  - 'packages/*/dashboard'
  - 'packages/*/extension'
  - 'packages/*/npm'
  - 'packages/*/worker'
  - 'packages/*/workers/*'
  - 'packages/huggingface-spaces/*'
  - 'packages/seeing/*'
