allowBuilds:
  '@swc/core': set this to true or false
  better-sqlite3: set this to true or false
  bufferutil: set this to true or false
  core-js-pure: set this to true or false
  esbuild: set this to true or false
  keccak: set this to true or false
  protobufjs: set this to true or false
  puppeteer: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
  utf-8-validate: set this to true or false
  workerd: set this to true or false
