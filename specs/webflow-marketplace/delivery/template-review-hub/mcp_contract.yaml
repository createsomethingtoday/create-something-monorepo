version: "0.1"
artifact: "mcp_contract"
status: "working_draft"

client:
  name: "Webflow Marketplace team"
  owner: "Marketplace review lead"
  workflow_name: "template_review_hub_lane"
  workflow_owner: "Marketplace review lead"

scope:
  objective: "Reduce objective checklist time and improve consistency in template review by delivering one governed MCP Hub lane for reviewers."
  workflow_boundary: "Starts when a template submission enters the review queue and ends when the reviewer validates the evidence, finalizes feedback, and issues the decision."
  out_of_scope:
    - "Subjective design judgment and final taste decisions"
    - "Autonomous creator-facing communication"
    - "Direct control-plane mutation by reviewers"

systems:
  source_systems:
    - name: "Airtable Marketplace Assets"
      role: "database"
      notes: "System of record for template assets, asset versions, review state, and release metadata."
    - name: "Webflow preview and published sites"
      role: "database"
      notes: "Source of truth for template structure, content, SEO, interactions, and published evidence."
  connected_systems:
    - name: "CREATE SOMETHING MCP Hub"
      role: "gateway"
      notes: "House entrypoint, broker, and governance surface for reviewer workflows."
    - name: "webflow-template-review-mcp"
      role: "workflow"
      notes: "Queue, asset, version, and release operations for template review."
    - name: "webflow-site-analyzer-mcp"
      role: "analysis"
      notes: "Preview/published-site analysis, checklist scoring, and unified template review runs."
    - name: "webflow-mcp"
      role: "analysis"
      notes: "Plagiarism detection and framework analysis."
    - name: "Composio"
      role: "integration"
      notes: "Optional connectivity and auth plumbing behind the house Hub. Not a reviewer-facing surface in this pilot."

resources:
  - uri: "template-review://queue-snapshot"
    name: "template_review_queue"
    description: "Current template review queue view for triage and selection."
    source_system: "Airtable Marketplace Assets"
    freshness_requirement: "near_realtime"
    access: "read"
    pii: false
  - uri: "airtable://assets/{asset_id}"
    name: "template_asset"
    description: "Template asset record with review metadata and publishing context."
    source_system: "Airtable Marketplace Assets"
    freshness_requirement: "near_realtime"
    access: "read"
    pii: false
  - uri: "airtable://asset_versions/{version_id}"
    name: "template_version"
    description: "Template version record with checklist, reviewer state, and feedback fields."
    source_system: "Airtable Marketplace Assets"
    freshness_requirement: "near_realtime"
    access: "read"
    pii: false
  - uri: "webflow-preview://submissions/{version_id}"
    name: "preview_site"
    description: "Preview URL and related extraction context for Designer-focused analysis."
    source_system: "Webflow preview and published sites"
    freshness_requirement: "realtime"
    access: "read"
    pii: false
  - uri: "webflow-site://published/{asset_id}"
    name: "published_site"
    description: "Published site URL and related evidence used for live-site review checks."
    source_system: "Webflow preview and published sites"
    freshness_requirement: "realtime"
    access: "read"
    pii: false

tools:
  - name: "template_review_list_queue"
    description: "List template submissions ready for review."
    action_type: "read"
    systems_touched:
      - "Airtable Marketplace Assets"
    approval_mode: "auto_allow"
    auth_scopes:
      - "review.queue.read"
    input_schema_summary:
      required: []
      optional:
        - "limit"
    output_contract:
      success_shape: "Returns queue records with review-relevant asset metadata."
      error_shape: "Returns structured Airtable or scope error."
    idempotency_expectation: "Pure read operation."
    fallback_behavior: "Use Airtable queue view manually if Hub read path fails."

  - name: "template_review_get_asset"
    description: "Read one template asset and associated versions."
    action_type: "read"
    systems_touched:
      - "Airtable Marketplace Assets"
    approval_mode: "auto_allow"
    auth_scopes:
      - "review.asset.read"
    input_schema_summary:
      required:
        - "asset_id"
      optional:
        - "versions_limit"
    output_contract:
      success_shape: "Returns asset metadata plus version history."
      error_shape: "Returns not-found, out-of-scope, or Airtable failure error."
    idempotency_expectation: "Pure read operation."
    fallback_behavior: "Open the asset directly in Airtable if Hub read path fails."

  - name: "run_template_review"
    description: "Run the unified template review across preview and published URLs and normalize findings into pass, fail, partial, and manual rows."
    action_type: "read"
    systems_touched:
      - "Webflow preview and published sites"
      - "webflow-site-analyzer-mcp"
    approval_mode: "auto_allow"
    auth_scopes:
      - "review.analysis.read"
    input_schema_summary:
      required:
        - "previewUrl"
        - "publishedUrl"
      optional:
        - "timeout"
        - "includeManual"
        - "crawlMaxPages"
        - "crawlMaxDepth"
    output_contract:
      success_shape: "Returns normalized checklist results, evidence, confidence, and fix hints."
      error_shape: "Returns structured analysis or extraction failure with correlation id."
    idempotency_expectation: "Pure read operation; may repeat analysis work."
    fallback_behavior: "Use narrower analysis tools or manual review if unified run fails."

  - name: "plagiarism_confidence"
    description: "Estimate plagiarism probability or originality risk for a template pair or URL pair."
    action_type: "read"
    systems_touched:
      - "webflow-mcp"
    approval_mode: "auto_allow"
    auth_scopes:
      - "review.originality.read"
    input_schema_summary:
      required:
        - "templateA"
        - "templateB"
      optional: []
    output_contract:
      success_shape: "Returns confidence estimate, evidence path, and supporting similarity context."
      error_shape: "Returns structured comparison failure."
    idempotency_expectation: "Pure read operation."
    fallback_behavior: "Reviewer flags originality concern manually if tool path is unavailable."

  - name: "template_review_request_changes"
    description: "Update a version to changes requested and attach reviewer feedback."
    action_type: "update"
    systems_touched:
      - "Airtable Marketplace Assets"
    approval_mode: "approval_required"
    auth_scopes:
      - "review.version.write"
    input_schema_summary:
      required:
        - "version_id"
        - "review_feedback"
      optional:
        - "review_status"
        - "improvement_areas"
    output_contract:
      success_shape: "Returns updated version record with review feedback applied."
      error_shape: "Returns validation, mapping, or Airtable update failure."
    idempotency_expectation: "Repeat updates overwrite the same review fields."
    fallback_behavior: "Reviewer completes the update directly in Airtable when write path is unavailable."

  - name: "template_review_approve_version"
    description: "Approve a version and update confirmed publishing metadata."
    action_type: "update"
    systems_touched:
      - "Airtable Marketplace Assets"
    approval_mode: "approval_required"
    auth_scopes:
      - "review.version.write"
      - "review.release.write"
    input_schema_summary:
      required:
        - "version_id"
      optional:
        - "release_date"
        - "release_record_id"
        - "mrp_id_overwrite"
        - "publishing_checklist"
    output_contract:
      success_shape: "Returns updated approved version record."
      error_shape: "Returns validation, mapping, or publishing failure."
    idempotency_expectation: "Repeat approval attempts should preserve approved state without destructive side effects."
    fallback_behavior: "Reviewer completes approval manually in Airtable and release workflow if needed."

  - name: "template_review_reject_version"
    description: "Reject a version with explicit reason and reviewer feedback."
    action_type: "update"
    systems_touched:
      - "Airtable Marketplace Assets"
    approval_mode: "approval_required"
    auth_scopes:
      - "review.version.write"
    input_schema_summary:
      required:
        - "version_id"
        - "reject_reason"
        - "rejection_feedback"
      optional: []
    output_contract:
      success_shape: "Returns updated rejected version record."
      error_shape: "Returns validation, mapping, or update failure."
    idempotency_expectation: "Repeat rejection attempts overwrite the same review fields."
    fallback_behavior: "Reviewer records rejection manually in Airtable if write path is unavailable."

prompts:
  - name: "template_review_reviewer_mode"
    purpose: "Guide the reviewer lane to gather evidence conservatively, separate objective findings from manual judgment, and escalate on uncertainty."
    usage: "Selected when running the governed template review workflow through the Hub."

auth:
  identity_source: "AUTH0"
  account_model: "per_user"
  production_write_access: true
  auth_notes:
    - "Reviewers should authenticate through the house Hub surface rather than direct downstream MCP endpoints."
    - "Composio-backed auth may support selected connector plumbing behind the Hub but should not become the reviewer-facing delivery abstraction."

policy_integration:
  control_surface: "agent_contract.yaml"
  observability_surface:
    - "Braintrust"
    - "cs-telemetry"
  release_gate_dependency: "Golden tasks must prove correct read behavior, approval-gated writes, blocked actions, and fallback handling."

error_model:
  expected_failures:
    - "STALE_STATE"
    - "AUTH_EXPIRED"
    - "FIELD_MAPPING_UNVERIFIED"
    - "PREVIEW_UNAVAILABLE"
    - "POLICY_AMBIGUITY"
  operator_visible_errors:
    - "Template review write path requires human review or manual Airtable fallback."
    - "Analysis incomplete; reviewer validation required."
    - "Current evidence is insufficient to support an automated recommendation."
  audit_fields:
    - "workflow_id"
    - "asset_id"
    - "version_id"
    - "tool_name"
    - "decision"
    - "correlation_id"

non_functional_requirements:
  latency_budget_ms: 15000
  retry_policy: "bounded_retry"
  logging_requirement: "All approval-required, blocked, and escalated actions must emit structured audit events and trace records."
  data_retention_notes:
    - "Reviewer-facing outputs should retain evidence and rationale without exposing unnecessary internal operational data."
    - "Creator-facing feedback remains human-reviewed before send."

acceptance:
  required_before_build:
    - "Hub lane composition for template review agreed"
    - "Workflow boundary approved by Marketplace review lead"
    - "Reviewer alpha owners identified"
  required_before_production:
    - "Golden-task checks pass"
    - "Manual fallback path verified"
    - "Reviewer playbook reviewed with pilot reviewers"
    - "Trace visibility confirmed for reads, writes, and escalations"
