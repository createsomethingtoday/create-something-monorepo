    mode: "compact"
    active_servers:
      - "webflow-template-review-mcp"
    max_proxy_tools: 22
  notes:
    - "Rollback removes direct webflow-site-analyzer-mcp visibility."
    - "Rollback keeps analyzer access only through the template-review bridge tools."
