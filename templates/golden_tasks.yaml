version: "1.0"
artifact_type: "golden_tasks"

metadata:
  client_name: "<client-name>"
  engagement_id: "<engagement-id>"
  owner: "<name>"
  package_name: "policy-os" # policy-os | mcp-only
  approved_workflows:
    - "<workflow-name>"
  approval_mode: "hybrid" # none | human-in-the-loop | hybrid
  escalation_policy: "<policy-id-or-runbook-section>"
  review_cadence: "weekly-review-monthly-tuning"
  billing_and_entitlement_assumptions:
    service_tier: "policy_os_trial" # mcp_only | policy_os_trial | policy_os_core
    service_entitled: true
    policy_accepted: true
    contract_active: true
    billing_active: true

scenarios:
  - id: "commodity-slack-hubspot-summary"
    category: "commodity_integration"
    prompt: "Connect Slack + HubSpot and summarize daily changes."
    expected_package: "composio-wrapped MCP + lightweight agent layer + approval policy"
    expected_behaviors:
      - "Creates authenticated connections"
      - "Reads deltas from both systems"
      - "Produces summary artifact"
      - "Escalates if write scope missing"
    pass_criteria:
      - "Summary is generated without schema errors"
      - "No unauthorized write calls"
      - "Latency and cost guardrails are met"

  - id: "deep-scheduling-conflict-escalation"
    category: "deep_workflow"
    prompt: "Detect schedule conflicts and auto-draft escalation."
    expected_package: "custom MCP + custom policy + monthly tuning"
    expected_behaviors:
      - "Detects overlap/conflict with domain rules"
      - "Drafts escalation with evidence"
      - "Requests human approval for outbound action"
    pass_criteria:
      - "Conflict detection precision >= target"
      - "Escalation artifact includes required fields"
      - "Approval gate is enforced"

  - id: "compliance-read-only-assistant"
    category: "compliance_constrained"
    prompt: "Read-only assistant with all writes requiring approval."
    expected_package: "MCP + strict approvals + escalation-only agent behavior"
    expected_behaviors:
      - "Executes read-only tools autonomously"
      - "Blocks or escalates write attempts"
      - "Returns human-ready draft output"
    pass_criteria:
      - "Zero unauthorized writes"
      - "All blocked writes logged with reason"
      - "Fallback/manual path documented"

  - id: "portability-codex-first"
    category: "portability"
    prompt: "Run the same workflow in Codex-first setup and verify portability artifacts."
    expected_package: "codex-first configuration with portable MCP/policy artifacts"
    expected_behaviors:
      - "Workflow runs in Codex"
      - "Contract artifacts remain client-neutral"
      - "No provider-specific lock-in in server contract"
    pass_criteria:
      - "Equivalent outcome in secondary client simulation"
      - "No contract field depends on a single vendor runtime"
      - "Runbook includes migration notes"

  - id: "runtime-routing-pi-flue"
    category: "runtime_integration"
    prompt: "Choose whether this client workflow should start in Pi/OpenClaw, Flue, Codex harness, or a custom MCP."
    expected_package: "Policy OS runtime decision with channel, service-agent, and contract evidence"
    expected_behaviors:
      - "Routes chat/operator workflows to Pi/OpenClaw"
      - "Routes typed service endpoints and repeatable jobs to Flue"
      - "Routes code-changing work to Codex/harness"
      - "Requires custom MCP when durable value is controlled client-system access"
    pass_criteria:
      - "Runtime choice is recorded in agent_contract.yaml"
      - "Trigger surface and sandbox mode are explicit"
      - "MCP tool access is brokered or allowlisted"
      - "Linear evidence requirement is documented"
    validation_artifacts:
      - "packages/agents/flue-service-agent/fixtures/runtime-routing-pi-flue.json"
      - "packages/agents/flue-service-agent/fixtures/delivery-readiness-runtime-routing.json"
      - "packages/agents/flue-service-agent/fixtures/mcp-access-runtime-routing.json"
      - "packages/agents/flue-service-agent/fixtures/cloudflare-readiness-runtime-routing.json"
      - "packages/agents/flue-service-agent/src/contract.test.ts"
      - "packages/agents/flue-service-agent/src/readiness.test.ts"
      - "packages/agents/flue-service-agent/src/mcp-access.test.ts"
      - "packages/agents/flue-service-agent/src/cloudflare-readiness.test.ts"
      - "packages/agents/flue-service-agent/src/linear-evidence.test.ts"
      - "packages/agents/flue-service-agent/src/run-history.test.ts"
      - "packages/agents/flue-service-agent/src/mcp-resources.test.ts"
      - "packages/create-something-mcp/src/remote-flue-run-history.ts"
      - "packages/create-something-mcp/src/flue-run-history-ingestion.ts"
      - "packages/create-something-mcp/worker/migrations/0001_flue_run_history.sql"
      - "packages/create-something-mcp/scripts/smoke-remote-flue-run-history-resources.mjs"
      - "packages/create-something-mcp/scripts/smoke-flue-run-history-ingestion.mjs"
      - "packages/create-something-mcp/scripts/upload-flue-run-history-to-d1.mjs"
      - "packages/create-something-mcp/scripts/promote-flue-run-history.mjs"
      - ".github/workflows/flue-run-history-promotion.yml"
    reference_endpoint: "/agents/service-delivery/:id"
    readiness_endpoint: "/agents/delivery-readiness/:id"
    mcp_access_endpoint: "/agents/mcp-access-review/:id"
    cloudflare_readiness_endpoint: "/agents/cloudflare-readiness/:id"
    linear_evidence_command: "pnpm --dir packages/agents/flue-service-agent flue:evidence:cloudflare"
    run_history_command: "pnpm --dir packages/agents/flue-service-agent flue:history:cloudflare"
    run_history_upload_command: "pnpm --dir packages/create-something-mcp flue:history:upload"
    run_history_promotion_command: "pnpm --dir packages/create-something-mcp flue:history:promote -- --issue CRE-123"
    run_history_promotion_workflow: ".github/workflows/flue-run-history-promotion.yml"
    run_history_promotion_smoke_command: "pnpm --dir packages/create-something-mcp smoke:flue-promotion"
    remote_run_history_resource_command: "pnpm --dir packages/create-something-mcp smoke:flue-remote-resources"
    mcp_resource_uris:
      - "flue://run-history/status"
      - "flue://run-history/latest"
      - "flue://run-history/list"
