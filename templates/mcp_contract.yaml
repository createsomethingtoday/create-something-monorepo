version: "1.1"
contract_type: "mcp_contract"

metadata:
  client_name: "<client-name>"
  engagement_id: "<engagement-id>"
  delivery_model: "agent-outcome-stack" # agent-outcome-stack | mcp-only
  status: "draft" # draft | active | deprecated
  owners:
    technical_owner: "<name>"
    client_owner: "<name>"
  codex_vector:
    primary_client: "codex"
    portability_target_clients:
      - "claude"
      - "cursor"

mcp_server:
  name: "<server-name>"
  version: "<semver>"
  transport: "sse" # sse | stdio | remote
  endpoints:
    production: "<https-endpoint>"
    staging: "<https-endpoint>"
  runtime:
    framework: "@create-something/mcp-core"
    hosting: "cloudflare-workers"

gateway:
  mode: "broker" # broker | compat
  broker_tools:
    search: "hub_tools_search"
    describe: "hub_tools_describe"
    invoke: "hub_tools_invoke"
  compat_window:
    enabled: false
    sunset_date: "<yyyy-mm-dd>"
    legacy_clients: []
  connector_scope:
    allowed_connectors: []
    allowed_servers: []
    blocked_connectors: []
  trace_requirements:
    correlation_id_header: "x-correlation-id"
    request_id_header: "x-request-id"
    require_related_task: true
    retention_days: 30

auth:
  strategy: "oauth" # oauth | api-key | service-account | mixed
  provider: "<provider-name>"
  scopes:
    required: []
    optional: []
  token_lifecycle:
    refresh_policy: "<policy>"
    revocation_policy: "<policy>"
  secrets:
    owner: "<team-or-person>"
    rotation_window_days: 90

resources:
  - id: "<resource-id>"
    uri: "<resource-uri>"
    schema_ref: "<schema-url-or-path>"
    data_classification: "internal" # public | internal | confidential | restricted
    freshness_sla_minutes: 15

tools:
  - name: "<tool-name>"
    tool_ref: "<server:tool>" # Required for brokered routing contracts
    description: "<what-it-does>"
    schema_ref: "<schema-url-or-path>"
    side_effect_level: "read" # read | write | destructive
    approval_required: "policy" # never | policy | always
    latency_budget_ms: 5000
    idempotent: true

policy_defaults:
  tenant_policy_mode: "allow-list" # allow-list | deny-list
  denied_tool_refs: []
  read_only_overrides: []
  escalation_on_policy_deny: true

quota_defaults:
  global:
    window_seconds: 60
    max_calls: 120
  connectors: []
  servers: []
  tools: []

prompts:
  - id: "<prompt-id>"
    purpose: "<why-this-prompt-exists>"
    owner: "<name>"
    version: "<prompt-version>"

error_model:
  retry_policy:
    max_retries: 2
    backoff_ms: 500
  codes:
    - code: "AUTH_EXPIRED"
      meaning: "Access token expired or revoked."
      user_action: "Reconnect account."
    - code: "SCOPE_MISSING"
      meaning: "Required OAuth scope is missing."
      user_action: "Grant required scope and retry."
    - code: "RATE_LIMITED"
      meaning: "Provider throttled requests."
      user_action: "Retry after cooldown."
    - code: "UPSTREAM_UNAVAILABLE"
      meaning: "Dependency is unavailable."
      user_action: "Use fallback/manual path."

handoff_bundle:
  required_artifacts:
    - "mcp_contract.yaml"
    - "agent_contract.yaml"
    - "outcome_contract.md"
    - "golden_tasks.yaml"
  operational_assets:
    - "endpoint inventory"
    - "auth scope matrix"
    - "tool/resource/prompt registry"
    - "incident + rollback runbook"
